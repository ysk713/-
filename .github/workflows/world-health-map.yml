# 世界医療情報マップ: 毎朝ニュースを収集してコミットし、GitHub Pages に公開する
name: world-health-map

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 06:17 (日本時間)
  workflow_dispatch:         # Actions タブから手動実行もできる

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: world-health-map
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ニュースと動画を収集
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # 任意。未設定でも動く
        run: python3 world-health-map/scripts/collect.py

      - name: 収集データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898181+github-actions[bot]@users.noreply.github.com"
          git add world-health-map/data/news
          git diff --cached --quiet || git commit -m "医療情報データを更新 ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: world-health-map
      - id: deploy
        uses: actions/deploy-pages@v4
