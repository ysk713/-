# 世界医療情報マップ: 毎朝ニュースを収集してリポジトリにコミットする
# 公開は GitHub Pages の「Deploy from a branch」で、このブランチをそのまま表示する
name: world-health-map

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 06:17 (日本時間)
  workflow_dispatch:         # Actions タブから手動実行もできる

permissions:
  contents: write

concurrency:
  group: world-health-map
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ニュースと動画を収集
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # 任意。未設定でも動く
        run: python3 world-health-map/scripts/collect.py

      - name: 収集データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898181+github-actions[bot]@users.noreply.github.com"
          git add world-health-map/data/news
          git diff --cached --quiet || git commit -m "医療情報データを更新 ($(date -u +%Y-%m-%d))"
          git push
