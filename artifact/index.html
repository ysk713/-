講者に「部下の不調に気づいた経験」を出し合ってもらい、その事例をもとに対応方法を話し合った。自分の経験と結びつけたことで、研修内容を職場で実践しやすくなった。<\/p>", "related": "<ul><li>アンドラゴジー（成人教育学）は、子どもを対象とするペダゴジーとの対比で提唱された。<\/li><\/ul>"}, {"id": "8-10", "chapter": 8, "topic": "経営層への働きかけ", "level": 2, "stem": "<p>メンタルヘルス教育研修の企画・推進に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["経営層には、メンタルヘルス対策が生産性やリスク管理に関わる経営課題であることを伝え、方針表明や資源配分への理解を得ることが重要である。", "経営層はメンタルヘルス対策の実務を担わないため、教育研修や情報提供の対象とする必要はない。", "教育研修の企画では、受講者数を増やすことだけを目標とし、内容の評価は行わないほうがよい。", "教育研修の計画を衛生委員会で調査審議することは認められていない。"], "answer": 0, "explanation": "<ul><li>②：誤り。経営層の理解と関与は、メンタルヘルス対策を推進するうえで欠かせない。<\/li><li>③：誤り。受講状況に加え、内容の理解度や職場での行動の変化なども評価する。<\/li><li>④：誤り。健康教育などの実施計画は、衛生委員会の調査審議事項に含まれる。<\/li><\/ul>", "example": "<p>D社の人事部は役員会で、メンタルヘルス不調による休業者数と代替要員のコスト、労災認定や訴訟のリスク、他社の取組み事例を説明した。その結果、社長がメンタルヘルス推進の方針を全社に表明し、外部EAPの予算が承認された。<\/p>", "related": "<ul><li>経営層向けには、数値（休業者数、損失額）や判例を用いて経営上の影響を具体的に示すと理解を得やすい。<\/li><\/ul>"}]}, {"num": 9, "title": "職場環境等の改善", "questions": [{"id": "9-1", "chapter": 9, "topic": "職場環境改善のためのヒント集", "level": 2, "stem": "<p>「職場環境改善のためのヒント集（メンタルヘルスアクションチェックリスト）」を用いた職場環境改善に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["職場環境改善は、専門家が一方的に改善策を決定し、従業員からの意見聴取は混乱を招くため避けるべきである。", "職場の良好事例を参考にしながら、従業員参加型のグループ討議で改善策を検討する方法がとられる。", "改善策は、低コストで実施可能なものや、すぐに取り組めるものから優先的に実施するとよい。", "ヒント集は、6つの領域、30項目のアクション（改善策）から構成されている。"], "answer": 0, "explanation": "<ul><li>職場環境改善は、労働者が参加して自らの職場の改善策を検討する<strong>参加型<\/strong>の手法が有効とされる。従業員の意見を反映させることで、実効性と主体性が高まる。<\/li><li>②③④：いずれも正しい。<\/li><\/ul>", "example": "<p>工場の製造課で、ヒント集を使って班ごとにグループ討議を行い、「作業手順書を写真入りにする」「休憩室の照明を明るくする」「朝礼で困りごとを共有する」など、費用のかからない改善策を3つ選んで実施した。<\/p>", "related": "<ul><li>6領域：A 作業計画への参加と情報の共有、B 勤務時間と作業編成、C 円滑な作業手順、D 作業場環境、E 職場内の相互支援、F 安心できる職場のしくみ。<\/li><li>改善は、現状把握 → 改善計画の立案 → 実施 → 評価 のPDCAで進める。<\/li><\/ul>"}, {"id": "9-2", "chapter": 9, "topic": "職場環境等の評価", "level": 2, "stem": "<p>職場環境等の評価と改善に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["職場環境改善の効果評価は、改善策を実施した直後に1回だけ行えば十分である。", "仕事のストレス判定図における総合健康リスクが80の職場は、全国平均よりも健康問題の発生リスクが20%高いと推定される。", "メンタルヘルス指針でいう職場環境等には、作業環境（照明、騒音、温度等）だけでなく、労働時間、仕事の量と質、職場の人間関係、職場の組織及び人事労務管理体制、職場の文化や風土なども含まれる。", "職場環境改善の対象は、照明や空調などの物理的環境に限られる。"], "answer": 2, "explanation": "<ul><li>①：誤り。効果が現れるまでには時間がかかるため、一定期間後の再評価（翌年のストレスチェック結果の比較等）も行うことが望ましい。<\/li><li>②：誤り。総合健康リスク80は、全国平均より<strong>20%低い<\/strong>ことを意味する。120であれば20%高い。<\/li><li>④：誤り。③のとおり、物理的環境に限られない。<\/li><\/ul>", "example": "<p>S社の職場環境改善では、騒音対策のような物理的環境だけでなく、会議を減らす、業務分担を見直す、評価基準を公開する（人事制度）といった項目も対象にした。<\/p>", "related": "<ul><li>職場環境等の評価には、ストレスチェックの集団分析のほか、管理監督者による日常の把握、産業保健スタッフによる職場巡視、労働者からの意見聴取等を活用する。<\/li><\/ul>"}, {"id": "9-3", "chapter": 9, "topic": "予防の段階", "level": 2, "stem": "<p>メンタルヘルス対策における予防の段階に関する次のア〜エの記述のうち、<strong>適切なものの組み合わせ<\/strong>を一つ選べ。<\/p>\n<p>ア．職場環境等の改善は、主に一次予防に位置づけられる取組みである。<br>イ．休業した労働者の職場復帰支援は、主に三次予防に位置づけられる取組みである。<br>ウ．メンタルヘルス不調の早期発見・早期対応は、主に一次予防に位置づけられる取組みである。<br>エ．ストレスチェック制度の主たる目的は、うつ病等の精神疾患の早期発見（二次予防）である。<\/p>", "choices": ["アとイ", "アとウ", "イとエ", "ウとエ"], "answer": 0, "explanation": "<ul><li>ア：正しい。一次予防＝メンタルヘルス不調の未然防止。<\/li><li>イ：正しい。三次予防＝職場復帰支援、再発防止。<\/li><li>ウ：誤り。早期発見・早期対応は<strong>二次予防<\/strong>。<\/li><li>エ：誤り。ストレスチェック制度の主たる目的は、労働者自身のストレスへの気づきの促進と職場環境改善による<strong>一次予防<\/strong>である。<\/li><\/ul>", "example": "<p>T社では、施策を予防の段階で整理して計画に位置づけた。一次予防＝長時間労働の削減と職場環境改善、二次予防＝「いつもと違う」部下への早期対応と相談窓口、三次予防＝休業者の職場復帰支援と再発防止。<\/p>", "related": "<ul><li>ストレスチェック制度の目的：①本人のストレスへの気づき、②ストレスの原因となる職場環境の改善、によるメンタルヘルス不調の未然防止。精神疾患の発見を一義的な目的とするものではない。<\/li><\/ul>"}, {"id": "9-4", "chapter": 9, "topic": "テレワークとメンタルヘルス", "level": 1, "stem": "<p>テレワークにおける健康確保に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["テレワークでは、上司や同僚とのコミュニケーション不足による孤立感・不安に留意する必要がある。", "テレワークを行う労働者についても、労働時間の適正な把握が必要である。", "テレワークを行う労働者も、ストレスチェックや長時間労働者に対する面接指導の対象となる。", "テレワークを行う労働者には、事業場外で勤務しているため、労働安全衛生法上の健康確保措置は適用されない。"], "answer": 3, "explanation": "<ul><li>テレワークを行う労働者にも労働安全衛生法は適用され、健康診断、ストレスチェック、面接指導等の健康確保措置を講じる必要がある。<\/li><li>①②③：いずれも正しい。面接指導は一定の要件のもとでオンライン（情報通信機器を用いた方法）で実施することも認められている。<\/li><\/ul>", "example": "<p>在宅勤務が中心の部署で、上司が週1回のオンライン1on1面談と、朝10分のチャット朝会を取り入れた。PCのログから深夜作業が多い社員を把握し、業務量を調整した。<\/p>", "related": "<ul><li>厚生労働省「テレワークの適切な導入及び実施の推進のためのガイドライン」には、自宅等の作業環境の確認のためのチェックリストが示されている。<\/li><\/ul>"}, {"id": "9-5", "chapter": 9, "topic": "治療と仕事の両立支援", "level": 2, "stem": "<p>厚生労働省「事業場における治療と仕事の両立支援のためのガイドライン」に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["両立支援の対象は、がんに罹患した労働者に限られている。", "両立支援は、労働者本人からの申出を基本とし、主治医の意見等を勘案して就業上の措置等を検討する。", "両立支援プランは人事部門が単独で作成するものであり、労働者本人とは共有しない。", "事業者は、本人の同意の有無にかかわらず、主治医に対して労働者の業務内容に関する情報を提供する義務を負う。"], "answer": 1, "explanation": "<ul><li>①：誤り。がん、脳卒中、心疾患、糖尿病、肝炎、難病など、反復・継続して治療が必要となる疾病が対象であり、メンタルヘルス不調も含まれうる。<\/li><li>③：誤り。両立支援プランは本人・主治医・産業医等の意見を踏まえて作成し、本人と共有する。<\/li><li>④：誤り。主治医への情報提供は、本人を介して、または本人の同意を得て行う。<\/li><\/ul>", "example": "<p>乳がんの治療中の社員が、主治医に勤務の情報を伝えて意見書をもらい、会社に提出した。会社は産業医の意見も聴き、抗がん剤治療の翌日は在宅勤務、通院日は時間単位の休暇とする両立支援プランを本人と一緒に作成した。<\/p>", "related": "<ul><li>両立支援の流れ：①労働者が勤務情報を主治医に提供 → ②主治医が意見書を作成 → ③労働者が事業者に提出 → ④事業者が産業医等の意見を聴取 → ⑤就業上の措置の決定・両立支援プランの作成。<\/li><\/ul>"}, {"id": "9-6", "chapter": 9, "topic": "参加型職場環境改善の進め方", "level": 2, "stem": "<p>参加型の職場環境改善の進め方に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["参加型の職場環境改善は、職場の問題点を指摘することだけを目的とし、改善策の検討までは行わない。", "参加型の職場環境改善では、職場の良い点（すでにできている点）も確認したうえで、実行可能な改善策を検討する。", "改善計画は、実施期限や担当者を決めず、各自の自主性に任せるのが望ましい。", "職場環境改善は、高ストレスと判定された個人だけを対象として行う。"], "answer": 1, "explanation": "<ul><li>①：誤り。問題点の把握にとどまらず、改善策を検討し実行することが目的。<\/li><li>③：誤り。実行を確実にするため、担当者と期限を決めて計画する。<\/li><li>④：誤り。職場環境改善は、職場（集団）を対象とした取組み。<\/li><\/ul>", "example": "<p>E社の「職場ドック」では、各職場が年1回チェックリストを使って良い点と改善点を話し合い、「担当：班長、期限：3か月後」のように担当者と期限を決めた改善計画を作って、半年後に結果を共有している。<\/p>", "related": "<ul><li>職場ドックは、人間ドックになぞらえた参加型の職場環境改善の手法。<\/li><\/ul>"}, {"id": "9-7", "chapter": 9, "topic": "組織的公正", "level": 3, "stem": "<p>組織的公正に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["分配的公正とは、報酬や評価などの結果の配分が公正であるかどうかに関する認識である。", "手続き的公正とは、評価や意思決定の手続きが公正であるかどうかに関する認識である。", "相互作用的公正（対人的公正）とは、上司などから敬意をもって誠実に扱われているかどうかに関する認識である。", "組織的公正が低いと感じていても、労働者の健康や心理的ストレス反応には影響しないことが明らかにされている。"], "answer": 3, "explanation": "<ul><li>組織的公正が低いと認識されている職場では、心理的ストレス反応や健康障害が多いことが研究で示されている。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>F社では昇格の基準が不明確で、「評価が上司の好き嫌いで決まる」という不満が多かった（手続き的公正が低い状態）。評価基準を公開し、評価面談で根拠を説明するようにしたところ、職場の不満が減った。<\/p>", "related": "<ul><li>新職業性ストレス簡易調査票では、組織の公正性やワーク・エンゲイジメントなど、より幅広い要因を測定できる。<\/li><\/ul>"}, {"id": "9-8", "chapter": 9, "topic": "心理的安全性", "level": 2, "stem": "<p>心理的安全性に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["心理的安全性とは、職場でミスをしても一切責任を問われない状態をいう。", "心理的安全性が高い職場では意見の対立が起こらないため、業務の質が高まる。", "心理的安全性とは、チームの中で、対人関係のリスクを恐れずに発言や質問ができるという認識が共有されている状態をいう。", "心理的安全性はメンバーの性格によって決まるため、管理監督者の関わり方では変えることができない。"], "answer": 2, "explanation": "<ul><li>①：誤り。責任を問わないことではなく、ミスや懸念を率直に報告・相談できる状態をいう。<\/li><li>②：誤り。心理的安全性が高い職場では、建設的な意見の対立がむしろ起こりやすい。<\/li><li>④：誤り。リーダーの関わり方（失敗を学びの機会とする、発言を歓迎する等）で高めることができる。<\/li><\/ul>", "example": "<p>G社の開発チームでは、会議で新人が意見を言わないことが課題だった。リーダーが自分の失敗談を先に話し、質問や反対意見に「言ってくれてありがとう」と返すようにしたところ、問題の早期報告が増えた。<\/p>", "related": "<ul><li>心理的安全性はEdmondsonが提唱した概念。高い目標と組み合わせることで、学習や成果につながるとされる。<\/li><\/ul>"}, {"id": "9-9", "chapter": 9, "topic": "ワーク・ライフ・バランス", "level": 2, "stem": "<p>ワーク・ライフ・バランスとメンタルヘルスに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["ワーク・ライフ・バランスの推進は労働者の私生活の問題であり、事業場のメンタルヘルス対策とは関係がない。", "長時間労働の削減や休暇の取得促進は、ワーク・ライフ・バランスの推進とメンタルヘルス対策の双方に役立つ。", "育児や介護と仕事の両立支援は、仕事と家庭の葛藤（ワーク・ファミリー・コンフリクト）によるストレスの軽減につながる。", "勤務間インターバル制度は、終業から次の始業までに一定時間の休息を確保し、睡眠時間の確保に役立つ。"], "answer": 0, "explanation": "<ul><li>仕事と生活の調和が崩れると、睡眠不足や家庭内の葛藤などを通じて心身の健康に影響する。ワーク・ライフ・バランスの推進はメンタルヘルス対策の一部として位置づけられる。<\/li><li>②③④：いずれも正しい。<\/li><\/ul>", "example": "<p>親の介護をしながら働く社員が、介護休暇を時間単位で取得し、週2日を在宅勤務にしたことで、仕事と介護の両立の負担が軽くなり、眠れない状態が改善した。<\/p>", "related": "<ul><li>2025年4月から改正育児・介護休業法が段階的に施行され、介護に直面した労働者への両立支援制度の個別周知・意向確認などが事業主に義務づけられた。<\/li><\/ul>"}, {"id": "9-10", "chapter": 9, "topic": "事務所の作業環境", "level": 3, "stem": "<p>事務所衛生基準規則に定める事務所の作業環境に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["事務所の作業面の照度の基準は、2021年の改正で廃止された。", "事務室の気温は、10℃以上35℃以下となるよう努めることとされている。", "一般的な事務作業を行う作業面の照度は、300ルクス以上とされている。", "事務室の相対湿度は、10%以上20%以下となるよう努めることとされている。"], "answer": 2, "explanation": "<ul><li>①：誤り。2021年の改正で照度の基準は<strong>引き上げられ<\/strong>、一般的な事務作業は300ルクス以上、付随的な事務作業は150ルクス以上とされた。<\/li><li>②：誤り。事務室の気温は<strong>18℃以上28℃以下<\/strong>となるよう努める（2022年4月から）。<\/li><li>④：誤り。相対湿度は<strong>40%以上70%以下<\/strong>となるよう努める。<\/li><\/ul>", "example": "<p>H社の執務室では、社員から目の疲れや頭痛の訴えが続いていた。照度計で測ると作業面が200ルクス程度だったため照明を増やし、温度と湿度も基準内になるよう空調を調整した。<\/p>", "related": "<ul><li>パソコン作業については、厚生労働省「情報機器作業における労働衛生管理のためのガイドライン」（2019年）がある。<\/li><li>物理的な作業環境の不快さも、ストレス要因の一つとなる。<\/li><\/ul>"}]}], "essays": [{"title": "長時間労働職場における心の健康づくり施策の立案", "problem": "<p>あなたは、従業員約800人の製造業A社（本社・単一事業場）の人事部メンタルヘルス担当課長である。A社の状況は次のとおりである。<\/p>\n<ul><li>新製品立ち上げに伴い、開発部門（約60人）で時間外・休日労働が月80時間を超える者が常態的に10人程度いる。<\/li><li>直近のストレスチェックの集団分析で、開発部門の総合健康リスクは135であった（全社平均は102）。<\/li><li>開発部門では、この1年でメンタルヘルス不調による休業者が2名発生している。<\/li><li>開発部長は「繁忙期は一時的なもの。本人の気持ちの問題もある」と述べ、対策に消極的である。<\/li><li>嘱託産業医が月1回来社しているが、衛生委員会でメンタルヘルスが議題になることはほとんどない。<\/li><\/ul>\n<p><strong>設問1<\/strong> A社の開発部門におけるメンタルヘルス上の問題点を、組織的な観点から3つ挙げて説明しなさい。<\/p>\n<p><strong>設問2<\/strong> 人事部メンタルヘルス担当課長として、心の健康づくり計画に基づき、一次予防・二次予防・三次予防の観点から具体的な施策を立案し、その実施にあたっての留意点を述べなさい。<\/p>\n<p>（解答目安：設問1・2あわせて 1,000〜1,200字）<\/p>", "sections": [{"label": "採点ポイント", "html": "<div class=\"tbl\"><table><thead><tr><th>観点<\/th><th>主な採点ポイント<\/th><th>配点目安<\/th><\/tr><\/thead><tbody><tr><td>問題点の把握<\/td><td>長時間労働（80時間超の常態化）、集団分析の高リスク、管理監督者の認識不足、衛生委員会の形骸化・産業保健体制の不十分さ<\/td><td>30%<\/td><\/tr><tr><td>一次予防<\/td><td>労働時間管理・業務量の適正化、集団分析に基づく参加型職場環境改善、管理監督者教育（ラインによるケア）、トップの方針表明<\/td><td>30%<\/td><\/tr><tr><td>二次予防<\/td><td>長時間労働者への医師の面接指導（80時間超・申出、産業医への情報提供・本人通知）、高ストレス者の面接指導勧奨、相談窓口の周知<\/td><td>20%<\/td><\/tr><tr><td>三次予防<\/td><td>職場復帰支援プログラム（手引き5ステップ）、休業者の復職後フォローアップ、再発防止<\/td><td>10%<\/td><\/tr><tr><td>留意点・論理性<\/td><td>衛生委員会での調査審議、個人情報保護・不利益取扱いの防止、PDCAによる評価、安全配慮義務の観点<\/td><td>10%<\/td><\/tr><\/tbody><\/table><\/div>"}, {"label": "解答例", "html": "<p><strong>設問1<\/strong><\/p>\n<p>第一に、長時間労働が常態化している点である。開発部門では時間外・休日労働が月80時間を超える者が常に10人程度おり、過重労働による心身の健康障害のリスクが高い。これはメンタルヘルス不調のみならず脳・心臓疾患の要因ともなり、休業者2名の発生も含め、使用者として安全配慮義務違反を問われるおそれがある。<\/p>\n<p>第二に、管理監督者の認識不足である。開発部長は問題を「一時的」「本人の気持ちの問題」と捉えているが、総合健康リスク135は全国平均より約35%健康問題の発生リスクが高いことを示しており、個人の問題ではなく職場環境の問題として対応する必要がある。ラインによるケアが機能していない。<\/p>\n<p>第三に、事業場としての推進体制が形骸化している点である。衛生委員会でメンタルヘルスが審議されておらず、心の健康づくり計画に基づくPDCAが回っていない。産業医も十分に活用されていない。<\/p>\n<p><strong>設問2<\/strong><\/p>\n<p>まず、経営トップによるメンタルヘルスケア推進の方針表明を得たうえで、衛生委員会で開発部門の現状を報告し、心の健康づくり計画に重点施策として位置づける。<\/p>\n<p>一次予防としては、①開発部門の業務量と人員配置を見直し、応援人員の投入や納期調整により時間外労働を削減する。客観的方法による労働時間把握を徹底する。②集団分析結果を開発部門にフィードバックし、職場環境改善のためのヒント集等を用いた従業員参加型の職場環境改善を行う。③開発部長を含む管理監督者に対し、ストレスの基礎知識、「いつもと違う」部下への気づきと相談対応、長時間労働の健康影響等についての研修を実施する。<\/p>\n<p>二次予防としては、月80時間超の労働者について、産業医への情報提供と本人への通知を確実に行い、申出による医師の面接指導を勧奨する。面接指導後は医師の意見を聴取し、就業上の措置を講じる。高ストレス者にも面接指導の申出を勧奨し、社内外の相談窓口を周知する。<\/p>\n<p>三次予防としては、職場復帰支援の手引きに沿った社内プログラムを整備し、休業者2名について主治医・産業医と連携した職場復帰支援プランを作成し、復帰後のフォローアップを行う。<\/p>\n<p>実施にあたっては、面接指導の申出や相談を理由とする不利益取扱いをしないこと、健康情報を適切に管理し、管理監督者には就業上必要な情報に加工して伝えることに留意する。また、集団分析結果を管理監督者の人事評価に用いない。施策の効果は、時間外労働時間、翌年度の総合健康リスク、休業者数等の指標で評価し、計画を見直していく。<\/p>\n<p>（約1,150字）<\/p>"}]}, {"title": "うつ病で休業した社員の職場復帰支援", "problem": "<p>B社（従業員約400人、IT企業）の営業部に所属するCさん（35歳、男性）は、昨年度の組織改編で営業目標が大幅に引き上げられた後、不眠や遅刻が目立つようになり、精神科を受診してうつ病と診断され、6か月間休業している。<\/p>\n<p>先日、Cさんから「主治医から復職可能と言われた」として、「職場復帰可能。ただし当面は残業を控えること」と記載された診断書が人事部に提出された。人事部が本人と面談したところ、次のことが分かった。<\/p>\n<ul><li>起床時間が日によって8時〜11時とばらつきがある。<\/li><li>「早く戻らないと居場所がなくなる」と強い焦りを口にしている。<\/li><li>「営業部に戻るのは正直不安だ」とも話している。<\/li><li>B社には職場復帰支援に関する社内規程がなく、試し出勤制度もない。<\/li><\/ul>\n<p><strong>設問1<\/strong> Cさんの職場復帰の可否を判断するにあたり、人事労務管理スタッフとして確認・検討すべき事項を述べなさい。<\/p>\n<p><strong>設問2<\/strong> 厚生労働省「心の健康問題により休業した労働者の職場復帰支援の手引き」を踏まえ、B社として今後整備すべき体制・制度と、Cさんへの具体的な支援の進め方を述べなさい。<\/p>\n<p>（解答目安：設問1・2あわせて 1,000〜1,200字）<\/p>", "sections": [{"label": "採点ポイント", "html": "<div class=\"tbl\"><table><thead><tr><th>観点<\/th><th>主な採点ポイント<\/th><th>配点目安<\/th><\/tr><\/thead><tbody><tr><td>復帰可否の判断材料<\/td><td>主治医の判断と職場で求められる業務遂行能力の違い、生活リズムの回復（起床時間の安定）、通勤可能性、焦りによる早期復帰のリスク、本人の意欲・不安<\/td><td>30%<\/td><\/tr><tr><td>関係者の連携<\/td><td>産業医の意見聴取、本人同意を得た主治医への情報提供・照会、管理監督者・人事・産業保健スタッフの連携<\/td><td>20%<\/td><\/tr><tr><td>職場復帰支援プラン<\/td><td>復帰日、就業上の配慮（時間外労働の禁止、業務量・目標の調整）、復帰先（原則元の職場と、発症要因を踏まえた配慮）、フォローアップ<\/td><td>25%<\/td><\/tr><tr><td>体制整備<\/td><td>手引き5ステップに沿った社内プログラム・規程、試し出勤制度（処遇・労災の取扱い明確化）、衛生委員会での審議、教育研修<\/td><td>15%<\/td><\/tr><tr><td>留意点<\/td><td>個人情報保護、本人の焦りへの配慮、再発防止、休業期間満了など就業規則との関係<\/td><td>10%<\/td><\/tr><\/tbody><\/table><\/div>"}, {"label": "解答例", "html": "<p><strong>設問1<\/strong><\/p>\n<p>主治医の「復職可能」の判断は、日常生活レベルの回復を示すにとどまり、職場で求められる業務遂行能力まで回復していることを必ずしも意味しない。そのため、次の事項を確認する。<\/p>\n<p>第一に、生活リズムの回復状況である。Cさんは起床時間が8時〜11時とばらついており、決まった時間に起床し通勤できる状態にあるとはいえない。睡眠・食事の状況、日中の活動量を生活記録表等で確認する。<\/p>\n<p>第二に、通勤時間帯に一人で安全に通勤できるか、業務に必要な集中力や作業能力が回復しているかである。<\/p>\n<p>第三に、本人の意欲と心理状態である。「居場所がなくなる」という焦りは、十分な回復前の復職を招き、再発につながるおそれがある。一方、営業部への不安は、発症要因との関係で復帰先の検討材料となる。<\/p>\n<p>第四に、主治医の判断根拠である。本人の同意を得て、職場の業務内容や求められる能力を主治医に情報提供し、就業上の配慮について意見を求める。<\/p>\n<p>これらを踏まえ、産業医の意見を聴取し、職場復帰の可否を判断する。<\/p>\n<p><strong>設問2<\/strong><\/p>\n<p>体制・制度としては、まず手引きの5つのステップに沿った職場復帰支援プログラムを策定し、衛生委員会で調査審議のうえ社内規程として明文化し、全従業員に周知する。休業中のケア、復帰可否の判断手順、職場復帰支援プランの作成、フォローアップについて、人事労務、管理監督者、産業医等の役割を明確にする。あわせて、模擬出勤・通勤訓練・試し出勤等の制度を設け、その間の処遇や災害時の取扱いをあらかじめ定めておく。管理監督者向けに職場復帰支援の研修も行う。<\/p>\n<p>Cさんへの支援としては、現時点では生活リズムが安定していないため、直ちに復職とせず、生活記録をつけながら一定期間起床時間の安定を目指してもらう。焦りに対しては、会社として復帰を支援する姿勢を伝え、安心して療養できるよう配慮する。生活リズムが整った段階で、通勤訓練等を経て再度可否を判断する。<\/p>\n<p>復帰可能と判断した場合は、本人、管理監督者、産業医、人事担当者で職場復帰支援プランを作成する。復帰先は原則として元の営業部とするが、発症の契機が営業目標の大幅な引上げであることから、当面は目標設定の免除・軽減、時間外労働の禁止、顧客対応の段階的再開等の配慮を行う。本人の不安が強く、職場の要因が大きい場合は、配置転換も選択肢として検討する。<\/p>\n<p>復帰後は、管理監督者と産業医等が定期的に面談し、症状の再燃や業務の負荷を確認しながら、就業上の配慮を段階的に見直す。Cさんの健康情報は必要最小限の関係者に限って共有し、職場には就業上の配慮事項のみを伝える。<\/p>\n<p>（約1,150字）<\/p>"}]}, {"title": "パワーハラスメントの相談対応と再発防止", "problem": "<p>あなたは、従業員約600人の物流会社D社の人事部ハラスメント相談担当者である。D社の状況は次のとおりである。<\/p>\n<ul><li>配送センターの社員Eさん（28歳、女性）から、「F課長から、ほかの社員の前で『給料泥棒』『辞めてしまえ』と毎日のように怒鳴られている」と相談があった。<\/li><li>Eさんは最近眠れず、食欲がなく、出勤前に涙が出ると話している。「相談したことが課長に知られたら、もっとひどくなる」と強い不安を訴えている。<\/li><li>F課長は業績を上げており、配送センター長は「厳しいが、指導熱心な課長だ」と評価している。<\/li><li>D社にはハラスメント防止の方針と相談窓口はあるが、相談後の対応手順は定まっておらず、管理職向けの研修も行われていない。<\/li><\/ul>\n<p><strong>設問1<\/strong> Eさんの相談を受けた担当者として、初期対応で行うべきことと留意点を述べなさい。<\/p>\n<p><strong>設問2<\/strong> 事実確認から再発防止までの一連の対応について、D社が組織として行うべきことを述べなさい。<\/p>\n<p>（解答目安：設問1・2あわせて 1,000〜1,200字）<\/p>", "sections": [{"label": "採点ポイント", "html": "<div class=\"tbl\"><table><thead><tr><th>観点<\/th><th>主な採点ポイント<\/th><th>配点目安<\/th><\/tr><\/thead><tbody><tr><td>初期対応<\/td><td>傾聴と受容、相談者の安全とプライバシーの確保、本人の意向確認、不利益取扱いの禁止の説明、今後の流れの説明<\/td><td>25%<\/td><\/tr><tr><td>健康面への配慮<\/td><td>不眠・食欲低下などの心身の不調への気づき、産業医・保健師への相談や受診の勧奨、必要に応じた就業上の配慮<\/td><td>20%<\/td><\/tr><tr><td>事実確認<\/td><td>相談者・行為者双方からの聴取、主張が異なる場合の第三者からの聴取、迅速・中立な対応、記録<\/td><td>20%<\/td><\/tr><tr><td>事後の措置<\/td><td>被害者への配慮（配置・業務上の措置、メンタルヘルス不調への支援）、行為者への措置（懲戒・指導）、パワハラの3要素と6類型に照らした判断<\/td><td>20%<\/td><\/tr><tr><td>再発防止<\/td><td>方針の再周知、管理職研修、対応手順の整備、業績のみで管理職を評価しない仕組み、衛生委員会等での共有<\/td><td>15%<\/td><\/tr><\/tbody><\/table><\/div>"}, {"label": "解答例", "html": "<p><strong>設問1<\/strong><\/p>\n<p>まず、Eさんが安心して話せるよう、プライバシーが守られる場所と時間を確保し、話をさえぎらずに傾聴する。つらい状況を打ち明けたことを受け止め、評価や批判をせずに事実と気持ちを聴き取る。いつ、どこで、誰の前で、どのような言動があったかを、本人の言葉で記録する。<\/p>\n<p>次に、Eさんの不安に配慮して、相談内容は本人の同意なく関係者に伝えないこと、相談したことを理由に不利益な取扱いをしないことを明確に説明する。そのうえで、事実確認の進め方や、課長から聴取する時期・方法について本人の意向を確認する。<\/p>\n<p>また、Eさんには不眠、食欲低下、出勤前の涙など、心身の不調のサインがみられる。本人の同意を得て産業医や保健師との面談につなぎ、必要に応じて医療機関の受診を勧める。事実確認が終わるまでの間も、本人が希望すれば、F課長と直接接する機会を減らすなどの暫定的な措置を検討する。<\/p>\n<p><strong>設問2<\/strong><\/p>\n<p>組織としては、まず迅速かつ中立的に事実確認を行う。Eさんの同意を得たうえで、F課長からも話を聴く。主張が食い違う場合は、怒鳴る場面を見ていた同僚など第三者からも聴取する。聴取の内容は記録し、協力者にも不利益な取扱いをしないことを伝える。<\/p>\n<p>事実が確認された場合、ほかの社員の前で「給料泥棒」「辞めてしまえ」と繰り返し怒鳴ることは、業務上必要かつ相当な範囲を超えた「精神的な攻撃」にあたり、職場のパワーハラスメントに該当すると考えられる。課長の業績が高いことや、本人に指導の意図があったことは、判断を左右しない。<\/p>\n<p>被害者への措置として、Eさんの意向を踏まえて配置や業務上の関係を見直し、産業保健スタッフによる心身のケアを継続する。行為者への措置として、就業規則に基づき懲戒処分を検討するとともに、指導方法の改善について教育を行う。<\/p>\n<p>再発防止としては、ハラスメントを行ってはならないという方針を経営トップから改めて周知し、管理職を対象としたハラスメント防止研修を実施する。相談から事実確認、措置の決定までの手順と担当者を規程として明文化する。業績だけでなく部下の育成や職場環境も管理職の評価に含めることも検討する。取組みの状況は衛生委員会で共有し、ストレスチェックの集団分析なども活用して職場環境の改善を継続する。<\/p>\n<p>（約1,100字）<\/p>"}]}], "matome": "<blockquote>2026年10月時点の内容です。施行日が未確定の改正は、受験前に厚生労働省等の公式情報で確認してください。<\/blockquote>\n<h3>労働時間・面接指導<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>数字<\/th><\/tr><\/thead><tbody><tr><td>時間外労働の上限（原則）<\/td><td>月45時間・年360時間<\/td><\/tr><tr><td>特別条項の上限<\/td><td>年720時間、複数月平均80時間以内、単月100時間<strong>未満<\/strong>（時間外＋休日）、月45時間超は年6か月まで<\/td><\/tr><tr><td>長時間労働者の面接指導（一般）<\/td><td>時間外・休日労働 月80時間超＋疲労の蓄積＋<strong>申出<\/strong><\/td><\/tr><tr><td>研究開発業務従事者<\/td><td>月100時間超で申出なしに義務<\/td><\/tr><tr><td>高度プロフェッショナル<\/td><td>健康管理時間の週40時間超部分が月100時間超で義務<\/td><\/tr><tr><td>産業医への情報提供<\/td><td>月80時間超の労働者の氏名・時間等<\/td><\/tr><tr><td>面接指導結果の記録<\/td><td>5年保存<\/td><\/tr><tr><td>労働時間の状況の記録<\/td><td>3年保存<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>ストレスチェック<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>実施義務<\/td><td>常時50人以上の事業場（50人未満は現在努力義務。2025年改正で義務化予定）<\/td><\/tr><tr><td>頻度<\/td><td>1年以内ごとに1回<\/td><\/tr><tr><td>実施者<\/td><td>医師、保健師、研修修了の歯科医師・看護師・精神保健福祉士・公認心理師<\/td><\/tr><tr><td>実施事務従事者になれない者<\/td><td>解雇・昇進・異動に直接の権限を持つ者<\/td><\/tr><tr><td>調査票<\/td><td>職業性ストレス簡易調査票（57項目／簡略版23項目）<\/td><\/tr><tr><td>面接指導<\/td><td>高ストレス者の<strong>申出<\/strong>により実施<\/td><\/tr><tr><td>期限の目安<\/td><td>申出：通知後おおむね1か月以内／面接指導：申出後おおむね1か月以内／意見聴取：面接後おおむね1か月以内<\/td><\/tr><tr><td>記録の保存<\/td><td>結果（事業者提供分）5年、面接指導結果5年<\/td><\/tr><tr><td>集団分析<\/td><td>努力義務、10人未満は原則全員同意が必要<\/td><\/tr><tr><td>労基署への報告<\/td><td>年1回（50人以上）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>体制<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>項目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>衛生委員会<\/td><td>常時50人以上で設置、毎月1回以上開催、議事録3年保存<\/td><\/tr><tr><td>産業医<\/td><td>50人以上で選任、1,000人以上（有害業務500人以上）で専属、3,000人超で2人以上<\/td><\/tr><tr><td>産業医の勧告<\/td><td>衛生委員会に報告、記録3年保存<\/td><\/tr><tr><td>推進担当者<\/td><td>衛生管理者等・常勤保健師等から選任が望ましい、人事権を有する者は不適当<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>労災認定（精神障害・2023年改正）<\/h3>\n<ul><li>要件：①対象疾病の発病 ②発病前おおむね6か月の業務による強い心理的負荷 ③業務以外の要因によらない<\/li><li>極度の長時間労働：発病直前1か月におおむね160時間超、または3週間におおむね120時間以上<\/li><li>追加された出来事：カスタマーハラスメント、感染症等の危険性の高い業務<\/li><li>悪化：特別な出来事がなくても、強い心理的負荷で悪化した場合は悪化部分を認める<\/li><\/ul>\n<h3>傷病手当金<\/h3>\n<ul><li>待期3日（連続）→ 4日目から<\/li><li>標準報酬日額相当額の3分の2<\/li><li>支給開始日から<strong>通算<\/strong>1年6か月（2022年1月〜）<\/li><\/ul>\n<h3>ハラスメント<\/h3>\n<ul><li>パワハラ防止措置義務：大企業2020年6月、中小企業2022年4月<\/li><li>3要素：優越的な関係／業務上必要かつ相当な範囲を超える／就業環境が害される<\/li><li>6類型：身体的な攻撃、精神的な攻撃、人間関係からの切り離し、過大な要求、過小な要求、個の侵害<\/li><li>2025年改正：カスタマーハラスメント対策の措置義務化（施行日は要確認）<\/li><\/ul>\n<h3>主要な判例<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>判例<\/th><th>ポイント<\/th><\/tr><\/thead><tbody><tr><td>電通事件（最判2000年）<\/td><td>業務による疲労・心理的負荷の過度な蓄積を防ぐ注意義務<\/td><\/tr><tr><td>東芝事件（最判2014年）<\/td><td>精神的健康情報の不申告を理由とする過失相殺は不可<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>職場復帰支援の手引き 5ステップ<\/h3>\n<ol><li>病気休業開始及び休業中のケア<\/li><li>主治医による職場復帰可能の判断<\/li><li>職場復帰の可否の判断及び職場復帰支援プランの作成<\/li><li>最終的な職場復帰の決定<\/li><li>職場復帰後のフォローアップ<\/li><\/ol>\n<p>→ 原則は元の職場へ復帰。試し出勤（模擬出勤・通勤訓練・試し出勤）は処遇・労災の取扱いを事前に明確化。<\/p>"};
const NUMS = ["①", "②", "③", "④"];
const ALL = DATA.chapters.flatMap(c => c.questions);
const chapterTitle = n => DATA.chapters.find(c => c.num === n).title;

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
};
let results = store.get("mh1-results", {});   // { "3-2": true/false } 最後の回答の正誤
const prefs = store.get("mh1-prefs", { chapter: 0, shuffle: false, wrong: false });

const state = { list: [], pos: 0, selected: null, answered: false };

/* ---------- タブ ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));
function showView(v) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  ["quiz", "essay", "matome"].forEach(k => document.getElementById("view-" + k).hidden = k !== v);
}
document.getElementById("count-quiz").textContent = ALL.length;
document.getElementById("count-essay").textContent = DATA.essays.length;

/* ---------- 選択問題 ---------- */
function renderChips() {
  const box = document.getElementById("chapter-chips");
  const items = [{ n: 0, label: "全章" }].concat(DATA.chapters.map(c => ({ n: c.num, label: "第" + c.num + "章" })));
  box.innerHTML = items.map(i => `<button class="chip" data-n="${i.n}" aria-pressed="${prefs.chapter === i.n}" title="${i.n ? chapterTitle(i.n) : "全" + ALL.length + "問"}">${i.label}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { prefs.chapter = +b.dataset.n; savePrefs(); renderChips(); buildList(); }));
}
const optShuffle = document.getElementById("opt-shuffle");
const optWrong = document.getElementById("opt-wrong");
optShuffle.checked = prefs.shuffle; optWrong.checked = prefs.wrong;
optShuffle.addEventListener("change", () => { prefs.shuffle = optShuffle.checked; savePrefs(); buildList(); });
optWrong.addEventListener("change", () => { prefs.wrong = optWrong.checked; savePrefs(); buildList(); });
function savePrefs() { store.set("mh1-prefs", prefs); }

function buildList(keepId) {
  let list = ALL.filter(q => !prefs.chapter || q.chapter === prefs.chapter);
  if (prefs.wrong) list = list.filter(q => results[q.id] !== true);
  if (prefs.shuffle) {
    list = list.slice();
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  }
  state.list = list;
  state.pos = Math.max(0, keepId ? list.findIndex(q => q.id === keepId) : 0);
  resetQuestion();
}
function resetQuestion() { state.selected = null; state.answered = false; renderQuestion(); }

const markCircle = '<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3.5c9.5-.3 16.8 7 16.5 16.2-.3 9.2-7.8 16.6-17 16.3C10.4 35.7 3.4 28.6 3.6 19.8 3.8 11.4 10.2 4.6 18.6 3.6"/></svg>';
const markCross = '<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 8 L32 32 M32 8 L8 32"/></svg>';

function renderQuestion() {
  const el = document.getElementById("sheet");
  const q = state.list[state.pos];
  if (!q) {
    el.innerHTML = `<p class="empty">この条件で出題できる問題はありません。${prefs.wrong ? "選んだ範囲の問題はすべて正解しています。「間違えた問題・未回答だけ」を外すと全問を解き直せます。" : ""}</p>`;
    return;
  }
  const choices = q.choices.map((c, i) => {
    const cls = ["choice"];
    let mark = "";
    if (state.answered) {
      if (i === q.answer) { cls.push("is-answer"); mark = markCircle; }
      else if (i === state.selected) { cls.push("is-wrong"); mark = markCross; }
    }
    return `<button class="${cls.join(" ")}" role="radio" aria-checked="${state.selected === i}" data-i="${i}" ${state.answered ? "disabled" : ""}>
      <span class="num">${NUMS[i]}${mark}</span><span>${c}</span></button>`;
  }).join("");
  const correct = state.answered && state.selected === q.answer;
  const verdict = state.answered ? `
    <div class="verdict">
      <div class="verdict-head">${correct ? "正解" : "不正解"}<small>正解は ${NUMS[q.answer]}</small></div>
      <div class="expl">${q.explanation}</div>
      ${q.example ? `<div class="example"><div class="related-label">実例</div>${q.example}</div>` : ""}
      ${q.related ? `<div class="related"><div class="related-label">関連知識</div>${q.related}</div>` : ""}
    </div>` : "";
  el.innerHTML = `
    <div class="qmeta">
      <span class="qno">問題 ${q.id}</span><span class="qtopic">${q.topic}</span>
      <span class="qlevel" aria-label="難易度${q.level}">${"★".repeat(q.level)}${"☆".repeat(3 - q.level)}</span>
      <span class="qchap">第${q.chapter}章 ${chapterTitle(q.chapter)}</span>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="choices" role="radiogroup" aria-label="選択肢">${choices}</div>
    ${verdict}
    <div class="actions">
      <button class="btn quiet" id="btn-prev" ${state.pos === 0 ? "disabled" : ""}>← 前の問題</button>
      ${state.answered
        ? `<button class="btn primary" id="btn-next" ${state.pos >= state.list.length - 1 ? "disabled" : ""}>次の問題 →</button>`
        : `<button class="btn primary" id="btn-submit" ${state.selected === null ? "disabled" : ""}>解答する</button>`}
      <span class="kbd-hint">キー操作：1〜4で選択、Enterで解答・次へ</span>
      <span class="progress">${state.pos + 1} / ${state.list.length}</span>
    </div>`;
  el.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => select(+b.dataset.i)));
  el.querySelector("#btn-prev").addEventListener("click", () => go(-1));
  el.querySelector("#btn-submit")?.addEventListener("click", submit);
  el.querySelector("#btn-next")?.addEventListener("click", () => go(1));
}
function select(i) { if (state.answered) return; state.selected = i; renderQuestion(); document.getElementById("btn-submit")?.focus(); }
function submit() {
  if (state.selected === null || state.answered) return;
  const q = state.list[state.pos];
  state.answered = true;
  results[q.id] = state.selected === q.answer;
  store.set("mh1-results", results);
  renderQuestion(); renderScore();
  document.getElementById("btn-next")?.focus({ preventScroll: true });
}
function go(d) {
  const p = state.pos + d;
  if (p < 0 || p >= state.list.length) return;
  state.pos = p; resetQuestion();
  document.getElementById("sheet").scrollIntoView({ block: "nearest" });
}
document.addEventListener("keydown", e => {
  if (document.getElementById("view-quiz").hidden || e.target.closest("textarea, input")) return;
  if (["1", "2", "3", "4"].includes(e.key)) select(+e.key - 1);
  else if (e.key === "Enter" && !e.target.closest("button")) state.answered ? go(1) : submit();
});

function renderScore() {
  const el = document.getElementById("score");
  const done = ALL.filter(q => q.id in results);
  const ok = done.filter(q => results[q.id]).length;
  const pts = Math.round(ok * 150 / ALL.length);
  const rows = DATA.chapters.map(c => {
    const d = c.questions.filter(q => q.id in results), k = d.filter(q => results[q.id]).length;
    const dots = c.questions.map(q => `<span class="dot ${q.id in results ? (results[q.id] ? "ok" : "ng") : ""}" title="問題${q.id}"></span>`).join("");
    return `<button class="chap-row" data-n="${c.num}" title="第${c.num}章だけ出題する">
      <span class="chap-num">第${c.num}章</span><span class="chap-name">${c.title}</span>
      <span class="chap-pct">${d.length ? Math.round(k / d.length * 100) + "%" : "—"}</span>
      <span></span><span class="dots">${dots}</span></button>`;
  }).join("");
  el.innerHTML = `
    <h2>成績</h2>
    <div class="total"><b>${ok}</b><span>/ ${ALL.length}問 正解（回答済み ${done.length}問）</span></div>
    ${rows}
    <div class="legend"><span><i style="background:var(--ai)"></i>正解</span><span><i style="background:var(--shu)"></i>不正解</span><span><i style="border:1px solid var(--rule)"></i>未回答</span></div>
    <div class="passline">選択問題換算 <b>${pts}</b> / 150点。合格には選択と論述の合計105点以上、かつ論述25点以上が必要です。</div>
    <div class="actions" style="margin-top:10px"><button class="btn quiet" id="btn-reset">成績をリセット</button></div>`;
  el.querySelectorAll(".chap-row").forEach(b => b.addEventListener("click", () => { prefs.chapter = +b.dataset.n; savePrefs(); renderChips(); buildList(); }));
  const reset = el.querySelector("#btn-reset");
  reset.addEventListener("click", () => {
    if (reset.dataset.armed) { results = {}; store.set("mh1-results", results); renderScore(); buildList(); return; }
    reset.dataset.armed = "1"; reset.textContent = "もう一度押すとリセットします";
    setTimeout(() => { if (reset.isConnected) { delete reset.dataset.armed; reset.textContent = "成績をリセット"; } }, 4000);
  });
}

/* ---------- 論述問題 ---------- */
let essayIdx = 0, timerId = null, remaining = 60 * 60;
function renderEssayPick() {
  document.getElementById("essay-pick").innerHTML = DATA.essays.map((e, i) =>
    `<button class="chip" data-i="${i}" aria-pressed="${i === essayIdx}">論述${i + 1}　${e.title}</button>`).join("");
  document.querySelectorAll("#essay-pick .chip").forEach(b => b.addEventListener("click", () => { essayIdx = +b.dataset.i; renderEssayPick(); renderEssay(); }));
}
function renderEssay() {
  const e = DATA.essays[essayIdx];
  const draft = store.get("mh1-essay-" + essayIdx, "");
  document.getElementById("essay").innerHTML = `
    <h2>論述問題${essayIdx + 1}　${e.title}</h2>
    ${e.problem}
    <div class="answer-box">
      <div class="answer-tools">
        <span class="timer" id="timer"></span>
        <button class="btn" id="btn-timer"></button>
        <button class="btn quiet" id="btn-timer-reset">60分に戻す</button>
        <span class="charcount" id="charcount"></span>
      </div>
      <label for="draft-${essayIdx}" class="kbd-hint">解答欄（下書きはこの端末に自動保存されます）</label>
      <textarea id="draft-${essayIdx}" placeholder="設問1　まず、問題点として……">${draft.replace(/</g, "&lt;")}</textarea>
    </div>
    ${e.sections.map(s => `<details class="reveal"><summary>${s.label}を見る</summary><div>${s.html}</div></details>`).join("")}`;
  const ta = document.getElementById("draft-" + essayIdx);
  ta.addEventListener("input", () => { store.set("mh1-essay-" + essayIdx, ta.value); updateCount(ta.value); });
  updateCount(draft);
  document.getElementById("btn-timer").addEventListener("click", toggleTimer);
  document.getElementById("btn-timer-reset").addEventListener("click", () => { stopTimer(); remaining = 3600; paintTimer(); });
  paintTimer();
}
function updateCount(text) {
  const n = text.replace(/\s/g, "").length;
  const el = document.getElementById("charcount");
  el.className = "charcount" + (n >= 1000 && n <= 1200 ? " in-range" : "");
  el.innerHTML = `<b>${n.toLocaleString()}</b>字（目安 1,000〜1,200字）`;
}
function paintTimer() {
  const t = document.getElementById("timer"); if (!t) return;
  const a = Math.abs(remaining), m = Math.floor(a / 60), s = a % 60;
  t.textContent = (remaining < 0 ? "−" : "") + m + ":" + String(s).padStart(2, "0");
  t.classList.toggle("over", remaining < 0);
  document.getElementById("btn-timer").textContent = timerId ? "一時停止" : (remaining === 3600 ? "60分タイマー開始" : "再開");
}
function toggleTimer() { timerId ? stopTimer() : (timerId = setInterval(() => { remaining--; paintTimer(); }, 1000)); paintTimer(); }
function stopTimer() { clearInterval(timerId); timerId = null; }

/* ---------- まとめ ---------- */
document.getElementById("matome").innerHTML = DATA.matome;

renderChips(); buildList(); renderScore(); renderEssayPick(); renderEssay();
if (location.hash === "#essay" || location.hash === "#matome") showView(location.hash.slice(1));
</script>
