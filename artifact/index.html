<title>Ⅰ種 メンタルヘルス問題集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 答案用紙のレイアウト：左に問題用紙（白いシート）、右に章別の成績表。採点は赤ペンの○と✕で示す */
:root {
  --paper: #eef0ec;
  --sheet: #ffffff;
  --ink: #1d2733;
  --muted: #5a6572;
  --rule: #d5dad3;
  --ai: #2c4878;
  --ai-soft: #e3e9f3;
  --shu: #c23a28;
  --shu-soft: #f8e6e2;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161b; --sheet: #1b2128; --ink: #e5e8eb; --muted: #9aa4ae; --rule: #2f3843;
    --ai: #95b0e3; --ai-soft: #24304a; --shu: #f07a64; --shu-soft: #3a2420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161b; --sheet: #1b2128; --ink: #e5e8eb; --muted: #9aa4ae; --rule: #2f3843;
  --ai: #95b0e3; --ai-soft: #24304a; --shu: #f07a64; --shu-soft: #3a2420; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

header.top { padding-block: 28px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4vw, 34px); line-height: 1.3; margin: 2px 0 0; text-wrap: balance; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-top: 16px; overflow-x: auto; }
nav.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer;
  color: var(--muted); font-weight: 500; white-space: nowrap; margin-bottom: -1px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ai); }
nav.tabs .count { font-size: 12px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; margin-top: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* 出題条件 */
.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 3px 12px;
  font-size: 13px; cursor: pointer; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--sheet); }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toggle input { accent-color: var(--ai); }

/* 問題用紙 */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: clamp(18px, 3vw, 32px); }
.qmeta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 16px; }
.qno { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.qtopic { font-weight: 700; }
.qlevel { color: var(--shu); letter-spacing: .1em; font-size: 13px; }
.qchap { color: var(--muted); font-size: 12px; width: 100%; }
.stem p { margin: 0 0 12px; }
.stem strong { text-decoration: underline; text-decoration-color: var(--ai); text-underline-offset: 4px; text-decoration-thickness: 2px; font-weight: 700; }

.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.choice {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left;
  border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--radius); padding: 10px 14px 10px 8px; cursor: pointer;
}
.choice:hover:not([disabled]) { border-color: var(--ai); }
.choice[aria-checked="true"] { border-color: var(--ai); background: var(--ai-soft); }
.choice[disabled] { cursor: default; }
.choice .num { position: relative; font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.4; text-align: center; }
.choice .mark { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); overflow: visible; pointer-events: none; }
.choice .mark path { fill: none; stroke: var(--shu); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 140; stroke-dashoffset: 0; animation: draw .45s ease-out; }
@keyframes draw { from { stroke-dashoffset: 140; } }
@media (prefers-reduced-motion: reduce) { .choice .mark path { animation: none; } }
.choice.is-answer { border-color: var(--shu); }
.choice.is-wrong { background: var(--shu-soft); border-color: var(--shu); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--radius); padding: 8px 18px; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--sheet); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); padding-inline: 8px; }
.progress { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.kbd-hint { font-size: 12px; color: var(--muted); }

.verdict { margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--shu); }
.verdict-head { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--shu); }
.verdict-head small { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--ink); margin-left: 8px; }
.expl, .related { max-width: 70ch; }
.expl ul, .related ul, .expl ol, .related ol { padding-left: 1.3em; margin: 8px 0; }
.expl li, .related li { margin: 4px 0; }
.related { margin-top: 14px; background: var(--paper); border-radius: var(--radius); padding: 10px 16px; font-size: 14px; }
.example { margin-top: 14px; border-left: 3px solid var(--ai); background: var(--ai-soft); border-radius: 0 var(--radius) var(--radius) 0; padding: 10px 16px; font-size: 14px; max-width: 70ch; }
.example p { margin: 4px 0 0; }
.related-label { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.empty { color: var(--muted); padding: 24px 0; }

/* 成績表 */
aside.score { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; }
aside h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 4px; }
.total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.total b { font-family: var(--font-display); font-size: 30px; }
.total span { color: var(--muted); font-size: 13px; }
.chap-row { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) 3.2em; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; border-top: 1px dashed var(--rule); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.chap-row:hover .chap-name { color: var(--ai); }
.chap-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.chap-num { font-weight: 700; }
.chap-pct { text-align: right; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 3px; grid-column: 2 / 3; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--rule); }
.dot.ok { background: var(--ai); border-color: var(--ai); }
.dot.ng { background: var(--shu); border-color: var(--shu); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.passline { font-size: 12px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 10px; }

/* 論述 */
.essay-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.essay h2 { font-family: var(--font-display); font-size: 21px; margin: 0 0 12px; text-wrap: balance; }
.essay p, .essay li { max-width: 70ch; }
.essay ul { padding-left: 1.3em; }
.answer-box { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 16px; }
.answer-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; }
.timer { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; min-width: 4.5em; }
.timer.over { color: var(--shu); }
textarea {
  width: 100%; min-height: 280px; resize: vertical; border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 14px; font: inherit; line-height: 2; color: var(--ink); background: var(--sheet);
  background-image: linear-gradient(transparent calc(2em - 1px), var(--rule) calc(2em - 1px), var(--rule) 2em, transparent 2em);
  background-size: 100% 2em; background-position: 0 14px; background-attachment: local;
}
.charcount { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.charcount b { color: var(--ink); }
.charcount.in-range b { color: var(--ai); }
details.reveal { margin-top: 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); }
details.reveal summary { cursor: pointer; padding: 10px 16px; font-weight: 700; }
details.reveal > div { padding: 0 16px 14px; }

.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
th, td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--paper); font-weight: 700; white-space: nowrap; }

/* まとめ */
.matome h3 { font-family: var(--font-display); font-size: 19px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--ai); }
.matome h3:first-of-type { margin-top: 8px; }
.matome blockquote { margin: 0 0 8px; padding: 10px 14px; background: var(--shu-soft); border-radius: var(--radius); font-size: 13px; }
.matome ul, .matome ol { padding-left: 1.3em; }
.matome p, .matome li { max-width: 72ch; }

.disclaimer { margin-top: 28px; font-size: 12px; color: var(--muted); max-width: 80ch; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">メンタルヘルス・マネジメント検定 Ⅰ種（マスターコース）</div>
      <h1>Ⅰ種 メンタルヘルス問題集</h1>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-quiz" aria-selected="true" data-view="quiz">選択問題<span class="count" id="count-quiz"></span></button>
    <button role="tab" id="tab-essay" aria-selected="false" data-view="essay">論述問題<span class="count" id="count-essay"></span></button>
    <button role="tab" id="tab-matome" aria-selected="false" data-view="matome">直前まとめ</button>
  </nav>

  <section id="view-quiz">
    <div class="layout">
      <div>
        <div class="controls">
          <div class="chips" id="chapter-chips" aria-label="出題範囲"></div>
          <div class="row">
            <label class="toggle"><input type="checkbox" id="opt-shuffle"> シャッフル</label>
            <label class="toggle"><input type="checkbox" id="opt-wrong"> 間違えた問題・未回答だけ</label>
          </div>
        </div>
        <article class="sheet" id="sheet" aria-live="polite"></article>
      </div>
      <aside class="score" id="score"></aside>
    </div>
  </section>

  <section id="view-essay" hidden>
    <div style="margin-top:20px">
      <div class="essay-pick" id="essay-pick"></div>
      <article class="sheet essay" id="essay"></article>
    </div>
  </section>

  <section id="view-matome" hidden>
    <article class="sheet matome" id="matome" style="margin-top:20px"></article>
  </section>

  <p class="disclaimer">出題傾向をもとに作成したオリジナル問題で、過去問・公式問題ではありません。「実例」は、判例を除き理解のための架空の事例です。法令・指針は2026年10月時点の内容です。受験前に最新の公式テキストと公式サイトで確認してください。成績と論述の下書きは、この端末のブラウザにだけ保存されます。</p>
</div>

<script>
const DATA = {"chapters": [{"num": 1, "title": "企業経営におけるメンタルヘルス対策の意義と重要性", "questions": [{"id": "1-1", "chapter": 1, "topic": "心の健康の保持増進のための指針", "level": 1, "stem": "<p>「労働者の心の健康の保持増進のための指針」（メンタルヘルス指針）に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["事業者は、衛生委員会等において十分調査審議を行い、「心の健康づくり計画」を策定することが求められている。", "メンタルヘルスケアは、「セルフケア」「ラインによるケア」「事業場内産業保健スタッフ等によるケア」「事業場外資源によるケア」の4つのケアが継続的かつ計画的に行われることが重要である。", "ストレスチェック制度の導入により、労働者の心の健康問題への気づきと対応はストレスチェックで行うこととされたため、管理監督者による日常的な職場の把握は不要となった。", "メンタルヘルスケアは、中長期的視点に立って継続的かつ計画的に行われるようにすることが重要である。"], "answer": 2, "explanation": "<ul><li>ストレスチェック制度は、メンタルヘルス指針に基づく取組みの一部として位置づけられるもので、ラインによるケアを代替するものではない。管理監督者が「いつもと違う」部下に気づき、相談対応することは引き続き重要。<\/li><li>①：指針は、衛生委員会等での調査審議を経て心の健康づくり計画を策定することを求めている。<\/li><li>②・④：4つのケアの継続的・計画的な実施、中長期的視点はいずれも指針の基本的な考え方。<\/li><\/ul>", "example": "<p>製造業A社（従業員300人）では、ストレスチェックの導入後、管理職が「不調者はストレスチェックで分かる」と考えて部下への声かけをやめた。ストレスチェックを受けなかった社員の欠勤が増えていたことに誰も気づかず、休業に至った。ストレスチェックは年1回で受検も任意のため、日常のラインによるケアの代わりにはならない。<\/p>", "related": "<ul><li>指針は2006年策定、2015年のストレスチェック制度施行にあわせて改正。<\/li><li>メンタルヘルスケアの推進にあたっての留意事項：①心の健康問題の特性、②労働者の個人情報の保護への配慮、③人事労務管理との関係、④家庭・個人生活等の職場以外の問題。<\/li><\/ul>"}, {"id": "1-2", "chapter": 1, "topic": "安全配慮義務と判例", "level": 2, "stem": "<p>安全配慮義務およびメンタルヘルスに関する判例についての次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["東芝事件（最高裁 2014年）では、労働者が神経科への通院や病名等を使用者に申告しなかったことは、損害賠償額の算定にあたり過失相殺の理由になると判示された。", "電通事件（最高裁 2000年）では、使用者は、業務の遂行に伴う疲労や心理的負荷等が過度に蓄積して労働者の心身の健康を損なうことがないよう注意する義務を負うと判示された。", "労働契約法第5条の安全配慮義務の対象となる「生命、身体等の安全」には、心の健康は含まれないと解されている。", "安全配慮義務違反が成立するためには、損害が発生していれば足り、使用者に予見可能性があったかどうかは問題とならない。"], "answer": 1, "explanation": "<ul><li>①：誤り。東芝事件では、精神的健康に関する情報は労働者にとって通常知られたくない情報であり、申告がなかったことを理由に過失相殺をすることはできないとされた。使用者は申告がなくても健康に配慮する必要がある。<\/li><li>②：電通事件最高裁判決の判示内容として正しい。過重労働による自殺について使用者の責任を認めた代表的判例。<\/li><li>③：誤り。行政通達上、「生命、身体等の安全」には心身の健康も含まれるとされている。<\/li><li>④：誤り。安全配慮義務違反の判断では、予見可能性と結果回避可能性（結果回避義務）が問題となる。<\/li><\/ul>", "example": "<p>【電通事件】入社2年目の社員が、深夜までの長時間労働を続けた末にうつ病を発症し、1991年に自殺した。最高裁は、会社が業務量を調整する措置をとらなかったとして会社の責任を認めた。【東芝事件】液晶ライン立ち上げのプロジェクトで過重な業務を担った技術者がうつ病で休職した事案。最高裁は、神経科への通院などを会社に申告していなかったことを理由に賠償額を減らすことはできないとした。<\/p>", "related": "<ul><li>労働契約法第5条（2008年施行）：「使用者は、労働契約に伴い、労働者がその生命、身体等の安全を確保しつつ労働することができるよう、必要な配慮をするものとする。」<\/li><li>不法行為責任（民法709条・715条）と債務不履行責任（民法415条）の両面から責任が問われうる。<\/li><\/ul>"}, {"id": "1-3", "chapter": 1, "topic": "時間外労働の上限規制", "level": 2, "stem": "<p>労働基準法の時間外労働の上限規制に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["時間外労働の上限は、原則として月45時間・年360時間である。", "臨時的な特別の事情があり労使が合意する場合（特別条項）でも、時間外労働は年720時間以内としなければならない。", "特別条項による場合でも、時間外労働と休日労働の合計について、2か月ないし6か月の平均がいずれも80時間以内でなければならない。", "特別条項による場合、時間外労働と休日労働の合計は、単月で100時間以下でなければならない。"], "answer": 3, "explanation": "<ul><li>単月の上限は「100時間<strong>未満<\/strong>」であり、100時間ちょうどは違反となる。「以下」と「未満」の違いは頻出の引っかけ。<\/li><li>①②③：いずれも正しい。<\/li><li>このほか、月45時間を超えることができるのは年6か月までとされている。<\/li><\/ul>", "example": "<p>B社の設計部門では特別条項を使っており、ある社員の月の時間外・休日労働がちょうど100時間になった。担当者は「100時間以内なら問題ない」と考えていたが、単月は100時間「未満」でなければならないため違反となる。勤怠システムで90時間台にアラートを出すなど、余裕をもった管理をしておくと防げる。<\/p>", "related": "<ul><li>上限規制は大企業2019年4月、中小企業2020年4月から適用。建設業・自動車運転業務・医師等は2024年4月から（一部特例あり）。<\/li><li>違反した場合は罰則（6か月以下の懲役〔拘禁刑〕または30万円以下の罰金）の対象。<\/li><\/ul>"}, {"id": "1-4", "chapter": 1, "topic": "健康経営", "level": 1, "stem": "<p>健康経営に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["健康経営優良法人の認定を受けるためには、ストレスチェックの集団分析結果における総合健康リスクが全国平均を下回っていることが必須要件とされている。", "経済産業省は、東京証券取引所と共同で、健康経営に優れた上場企業を「健康経営銘柄」として選定している。", "健康経営優良法人認定制度には、大規模法人部門と中小規模法人部門がある。", "健康経営は、従業員の健康保持・増進の取組みが、将来的に収益性等を高める投資であるとの考えのもと、健康管理を経営的視点から考え、戦略的に実践することをいう。"], "answer": 0, "explanation": "<ul><li>健康経営優良法人の認定要件は、経営理念・方針、組織体制、制度・施策実行、評価・改善、法令遵守・リスクマネジメントといった取組みの枠組みで評価されるものであり、集団分析の数値が全国平均を下回ることを必須とする要件はない。<\/li><li>②③④：いずれも正しい。<\/li><\/ul>", "example": "<p>C社は健康経営優良法人の申請にあたり、ストレスチェックの数値ではなく、社長による健康経営の方針表明、担当者の配置、管理職研修の実施、ストレスチェック受検率の向上策といった取組みを整理して申請した。認定はこうした取組みの枠組みで評価される。<\/p>", "related": "<ul><li>大規模法人部門の上位法人は「ホワイト500」、中小規模法人部門の上位法人は「ブライト500」の冠が付く。<\/li><li>メンタルヘルス対策は、生産性（プレゼンティーイズム・アブセンティーイズム）、リスクマネジメント、企業イメージの観点から経営課題と位置づけられる。<\/li><\/ul>"}, {"id": "1-5", "chapter": 1, "topic": "精神障害の労災認定", "level": 3, "stem": "<p>厚生労働省「心理的負荷による精神障害の認定基準」（2023年9月改正）に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["発病直前の1か月におおむね100時間を超える時間外労働を行った場合は、「特別な出来事」（極度の長時間労働）に該当する。", "2023年の改正では、顧客や取引先、施設利用者等からの著しい迷惑行為（いわゆるカスタマーハラスメント）は、業務による出来事の評価対象から除外された。", "認定要件の一つとして、対象疾病の発病前おおむね6か月の間に、業務による強い心理的負荷が認められることが挙げられている。", "すでに精神障害を発病している労働者の症状が悪化した場合には、いかなる場合であっても業務起因性は認められない。"], "answer": 2, "explanation": "<ul><li>認定要件は次の3つ。<ol><li>対象疾病を発病していること<\/li><li>発病前おおむね6か月の間に、業務による強い心理的負荷が認められること<\/li><li>業務以外の心理的負荷や個体側要因により発病したとは認められないこと<\/li><\/ol><\/li><li>①：誤り。「極度の長時間労働」は、発病直前の1か月におおむね<strong>160時間<\/strong>を超える（または3週間におおむね120時間以上の）時間外労働。<\/li><li>②：誤り。2023年改正で「顧客や取引先、施設利用者等から著しい迷惑行為を受けた」が具体的出来事として<strong>追加<\/strong>された。あわせて「感染症等の病気や事故の危険性が高い業務に従事した」も追加。<\/li><li>④：誤り。2023年改正により、悪化前おおむね6か月以内に「特別な出来事」がなくても、業務による強い心理的負荷で悪化したと医学的に判断されるときは、悪化した部分について業務起因性を認めることとされた。<\/li><\/ul>", "example": "<p>コールセンターのオペレーターが、顧客から長時間の暴言や土下座の要求を繰り返し受けた後にうつ病を発症した場合、2023年改正で追加された「顧客や取引先、施設利用者等から著しい迷惑行為を受けた」として心理的負荷が評価される。人事は、迷惑行為の記録や会社としての対応体制を整えておく必要がある。<\/p>", "related": "<ul><li>恒常的長時間労働（月100時間程度）は、出来事と組み合わせて総合評価する際に考慮される。<\/li><li>2020年には「パワーハラスメント」が具体的出来事として明示された。<\/li><\/ul>"}, {"id": "1-6", "chapter": 1, "topic": "プレゼンティーイズム", "level": 1, "stem": "<p>健康問題による生産性の損失に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["アブセンティーイズムとは、出勤しているものの、心身の不調により業務遂行能力が低下している状態をいう。", "プレゼンティーイズムとは、出勤しているものの、心身の健康上の問題により本来の業務遂行能力が十分に発揮できていない状態をいう。", "メンタルヘルス不調による生産性の損失は、休業による損失だけで評価でき、出勤中の能率低下は考慮する必要がない。", "健康経営の観点では、プレゼンティーイズムによる損失は、アブセンティーイズムによる損失よりも常に小さいとされている。"], "answer": 1, "explanation": "<ul><li>①：誤り。説明はプレゼンティーイズムのもの。アブセンティーイズムは、病気による欠勤・休業の状態をいう。<\/li><li>③：誤り。出勤中の能率低下（プレゼンティーイズム）も大きな損失であり、評価に含める必要がある。<\/li><li>④：誤り。国内外の研究では、健康関連の損失のうちプレゼンティーイズムによるものが大きいとする報告が多い。<\/li><\/ul>", "example": "<p>うつ状態で集中できず、以前の倍の時間をかけて仕事をしている社員は、欠勤がなくても生産性が大きく下がっている（プレゼンティーイズム）。U社では健康経営の指標として、欠勤日数に加え、出勤時の業務遂行度を自己評価する質問票（WHO-HPQなど）も測定している。<\/p>", "related": "<ul><li>メンタルヘルス対策の経営上の意義は、生産性の維持・向上、リスクマネジメント（安全配慮義務・労災）、企業イメージ・人材確保の観点から整理される。<\/li><\/ul>"}, {"id": "1-7", "chapter": 1, "topic": "過労死等防止対策推進法", "level": 2, "stem": "<p>過労死等防止対策推進法に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["過労死等防止対策推進法は、2014年に制定された。", "「過労死等」には、業務における強い心理的負荷による精神障害を原因とする自殺による死亡が含まれる。", "毎年11月は「過労死等防止啓発月間」とされている。", "「過労死等」は死亡に至った場合に限られ、死亡に至らない脳・心臓疾患や精神障害は含まれない。"], "answer": 3, "explanation": "<ul><li>「過労死等」は、①業務における過重な負荷による脳血管疾患・心臓疾患を原因とする死亡、②業務における強い心理的負荷による精神障害を原因とする自殺による死亡、③死亡には至らないが、これらの脳血管疾患・心臓疾患、精神障害、と定義されている。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>11月の啓発月間に合わせて、V社では全管理職に長時間労働の健康影響を学ぶeラーニングを配信し、各部署の時間外労働の実績を衛生委員会で報告した。<\/p>", "related": "<ul><li>国は「過労死等の防止のための対策に関する大綱」を定め、毎年、過労死等の概要と施策の状況を報告書（過労死等防止対策白書）として国会に報告している。<\/li><\/ul>"}, {"id": "1-8", "chapter": 1, "topic": "人的資本とメンタルヘルス", "level": 2, "stem": "<p>企業経営とメンタルヘルス対策に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["従業員の心身の健康は人的資本の重要な要素であり、メンタルヘルス対策は企業価値の向上や投資家への情報開示の観点からも重視されている。", "有価証券報告書における人的資本に関する情報の記載は、上場企業であっても任意とされている。", "メンタルヘルス対策は福利厚生の一環であり、企業の生産性やリスクマネジメントとは関係がない。", "メンタルヘルス不調による休業者が発生しても、休業中の所得は傷病手当金で補填されるため、企業に経営上の負担は生じない。"], "answer": 0, "explanation": "<ul><li>②：誤り。2023年3月期決算以降、有価証券報告書に人材育成方針や社内環境整備方針、その指標・目標などの記載が求められている。<\/li><li>③：誤り。メンタルヘルス対策は、生産性やリスクマネジメントと密接に関わる経営課題である。<\/li><li>④：誤り。傷病手当金は健康保険から本人に支給されるもので、企業には代替要員の確保、職場の生産性低下、周囲の負担増などの損失が生じる。<\/li><\/ul>", "example": "<p>W社は統合報告書で、ストレスチェックの受検率、高ストレス者の割合、メンタルヘルス不調による休業者数の推移を開示し、管理職研修や職場環境改善の取組みとあわせて説明した。<\/p>", "related": "<ul><li>有価証券報告書では、女性管理職比率、男性の育児休業取得率、男女間賃金差異の記載も求められている。<\/li><li>内閣官房「人的資本可視化指針」（2022年）は、人的資本の開示項目の一つとして健康・安全を挙げている。<\/li><\/ul>"}, {"id": "1-9", "chapter": 1, "topic": "第14次労働災害防止計画", "level": 3, "stem": "<p>第14次労働災害防止計画のメンタルヘルス対策に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["メンタルヘルス対策に取り組む事業場の割合を、2027年までに80%以上とすることが目標とされている。", "常時50人未満の小規模事業場におけるストレスチェック実施の割合を、2027年までに50%以上とすることが目標とされている。", "計画期間は、2023年度から2032年度までの10年間である。", "計画では、事業者が取り組む事項の実施状況を示すアウトプット指標と、その結果として期待されるアウトカム指標が設定されている。"], "answer": 2, "explanation": "<ul><li>第14次労働災害防止計画の期間は、2023年度から2027年度までの<strong>5年間<\/strong>である。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>X社では、第14次労働災害防止計画の目標を参考に、自社の安全衛生計画にも「全事業所でのストレスチェック実施（50人未満の営業所を含む）」「管理職研修の受講率100%」といった実施状況の目標と、「高ストレス者の割合の低下」という成果の目標を設定した。<\/p>", "related": "<ul><li>労働災害防止計画は、労働安全衛生法に基づき厚生労働大臣が策定する。<\/li><li>50人未満の事業場では、地域産業保健センターなどの支援を活用したストレスチェックの実施が想定されている。<\/li><\/ul>"}, {"id": "1-10", "chapter": 1, "topic": "労災保険と民事上の損害賠償", "level": 2, "stem": "<p>労災保険と民事上の損害賠償に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["労災保険の保険料は、労働者と事業主が折半して負担する。", "労災保険給付には慰謝料が含まれないため、労災認定された場合でも、使用者が民事上の損害賠償責任を問われることがある。", "労災保険は正社員のみが対象であり、パートタイム労働者やアルバイトは対象とならない。", "労災認定を受けた場合には、使用者の民事上の損害賠償責任はすべて免除される。"], "answer": 1, "explanation": "<ul><li>①：誤り。労災保険の保険料は<strong>全額事業主<\/strong>が負担する。<\/li><li>③：誤り。労災保険は、雇用形態にかかわらず、原則としてすべての労働者が対象となる。<\/li><li>④：誤り。使用者は、労災保険給付が行われた価額の限度で損害賠償責任を免れるにとどまり、慰謝料などは別途請求されうる。<\/li><\/ul>", "example": "<p>長時間労働によりうつ病を発症し、自殺に至って労災認定された社員の遺族が、会社に対して安全配慮義務違反を理由に慰謝料などの損害賠償を請求することがある。電通事件も、こうした民事訴訟の一つである。<\/p>", "related": "<ul><li>業務上の傷病による療養のための休業期間とその後30日間は、原則として解雇が制限される（労働基準法19条）。<\/li><\/ul>"}]}, {"num": 2, "title": "メンタルヘルスケアの活動領域と人事労務部門の役割", "questions": [{"id": "2-1", "chapter": 2, "topic": "衛生委員会", "level": 1, "stem": "<p>労働安全衛生法に定める衛生委員会に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["業種を問わず、常時50人以上の労働者を使用する事業場では、衛生委員会を設置しなければならない。", "衛生委員会の委員は、議長を含め全員を、労働者の過半数で組織する労働組合（ない場合は労働者の過半数代表者）が指名しなければならない。", "衛生委員会の議事で重要なものに係る記録は、3年間保存しなければならない。", "衛生委員会は、毎月1回以上開催しなければならない。"], "answer": 1, "explanation": "<ul><li>委員は事業者が指名する。そのうち<strong>議長以外の委員の半数<\/strong>については、過半数労働組合（ない場合は過半数代表者）の推薦に基づき指名しなければならない。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>従業員120人のD社では、総務部長を議長とし、産業医、衛生管理者、衛生に関し経験のある社員で衛生委員会を構成している。議長以外の委員の半数は労働組合の推薦に基づいて指名した。毎月第2火曜に開催し、ストレスチェックの実施方法や長時間労働者の状況を審議して、議事録を3年間保存している。<\/p>", "related": "<ul><li>メンタルヘルス対策の樹立に関すること、ストレスチェック制度の実施方法等、長時間労働者の健康障害防止対策は、衛生委員会の調査審議事項とされている。<\/li><li>安全委員会と衛生委員会をあわせて「安全衛生委員会」とすることもできる。<\/li><\/ul>"}, {"id": "2-2", "chapter": 2, "topic": "産業医", "level": 2, "stem": "<p>産業医制度に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["事業者は、時間外・休日労働が1か月当たり100時間を超えた労働者の情報のみを産業医に提供すれば足りる。", "常時50人未満の労働者を使用する事業場においても、産業医の選任が義務づけられている。", "事業者は、産業医から勧告を受けた場合であっても、その勧告に従わないときは、勧告の内容を記録する必要はない。", "常時1,000人以上の労働者を使用する事業場（一定の有害業務の場合は常時500人以上）では、専属の産業医を選任しなければならない。"], "answer": 3, "explanation": "<ul><li>①：誤り。時間外・休日労働が月<strong>80時間<\/strong>を超えた労働者の氏名・超えた時間等の情報を産業医に提供しなければならない。<\/li><li>②：誤り。50人未満の事業場では、医師等に健康管理等を行わせるよう<strong>努める<\/strong>（努力義務）。<\/li><li>③：誤り。事業者は産業医の勧告を尊重しなければならず、勧告の内容と講じた措置（講じない場合はその旨と理由）を記録し、3年間保存しなければならない。また勧告の内容等を衛生委員会に報告しなければならない（2019年改正）。<\/li><\/ul>", "example": "<p>従業員1,200人の工場では専属産業医を選任している。毎月、時間外・休日労働が80時間を超えた社員の氏名と時間を人事から産業医に提供し、産業医が面接指導の申出を勧めている。産業医が「特定部署の人員を増やすべき」と勧告したときは、衛生委員会に報告して対応を検討し、勧告内容と対応を記録した。<\/p>", "related": "<ul><li>常時3,000人を超える事業場では2人以上の産業医を選任。<\/li><li>2019年の働き方改革関連法により、産業医の独立性・中立性の強化、産業医への情報提供、労働者からの健康相談体制整備等が規定された。<\/li><\/ul>"}, {"id": "2-3", "chapter": 2, "topic": "人事労務管理スタッフと推進担当者", "level": 2, "stem": "<p>メンタルヘルス指針における人事労務管理スタッフ等の役割に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["人事労務管理スタッフは、管理監督者だけでは解決できない職場配置、人事異動、職場の組織等の人事労務管理が心の健康に及ぼす影響を把握し、労働時間等の労働条件の改善や適正配置に配慮する。", "事業場内メンタルヘルス推進担当者は、産業医等の助言・指導等を得ながら事業場のメンタルヘルスケアの推進の実務を担当する。", "事業場内メンタルヘルス推進担当者は、職場の実情をよく把握していることが重要であるため、労働者について人事権を有する者を選任することが望ましい。", "事業場内メンタルヘルス推進担当者は、衛生管理者等や常勤の保健師等から選任することが望ましい。"], "answer": 2, "explanation": "<ul><li>指針は、推進担当者は労働者のメンタルヘルスに関する個人情報を取り扱うことから、<strong>労働者について人事権を有する者を選任することは適当でない<\/strong>としている。<\/li><li>①②④：いずれも指針の内容に沿っている。<\/li><\/ul>", "example": "<p>E社では、はじめ人事課長を事業場内メンタルヘルス推進担当者にする案が出た。しかし「相談すると人事評価に響くのでは」と社員が相談をためらうおそれがあるため、衛生管理者の資格を持つ総務課の係長を選任した。<\/p>", "related": "<ul><li>事業場内産業保健スタッフ等＝産業医等、衛生管理者等、保健師等、心の健康づくり専門スタッフ、人事労務管理スタッフ、事業場内メンタルヘルス推進担当者。<\/li><li>ストレスチェックの「実施事務従事者」にも、人事権を有する者はなれない（問題5-3参照）。<\/li><\/ul>"}, {"id": "2-4", "chapter": 2, "topic": "長時間労働者に対する面接指導", "level": 2, "stem": "<p>労働安全衛生法に基づく長時間労働者に対する医師による面接指導に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["一般の労働者については、時間外・休日労働時間が1か月当たり80時間を超え、かつ疲労の蓄積が認められる者が申し出た場合に、事業者は医師による面接指導を行わなければならない。", "新たな技術・商品等の研究開発業務に従事する労働者については、時間外・休日労働時間が1か月当たり80時間を超えた場合、本人の申出がなくても面接指導を行わなければならない。", "面接指導の結果の記録については、法令上の保存義務はない。", "労働基準法第41条に定める管理監督者は、労働時間の規制が適用されないため、事業者による労働時間の状況の把握の対象外である。"], "answer": 0, "explanation": "<ul><li>②：誤り。研究開発業務従事者については、月<strong>100時間<\/strong>を超えた場合に申出なしで面接指導が義務となる（80時間超・疲労蓄積の場合は一般労働者と同様に申出により実施）。<\/li><li>③：誤り。面接指導の結果の記録は<strong>5年間<\/strong>保存しなければならない。<\/li><li>④：誤り。労働時間の状況の把握は、管理監督者や裁量労働制適用者を含むすべての労働者（高度プロフェッショナル制度対象者を除く）が対象。<\/li><\/ul>", "example": "<p>システム開発会社で、裁量労働制のエンジニアの週40時間を超えた時間が月85時間に達した。人事はPCのログで労働時間の状況を把握しており、本人に時間数を通知して面接指導の申出を勧めた。申出を受けて産業医が面接し、「1か月間は時間外労働を制限」という意見を出した。<\/p>", "related": "<ul><li>高度プロフェッショナル制度対象者：健康管理時間のうち週40時間を超えた時間が月100時間を超えた場合、申出なしで面接指導が義務。<\/li><li>事業者は、80時間を超えた労働者本人にも、その時間に関する情報を通知しなければならない。<\/li><\/ul>"}, {"id": "2-5", "chapter": 2, "topic": "健康情報と個人情報保護", "level": 2, "stem": "<p>労働者の健康情報の取扱いに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["病歴は、個人情報保護法上の「要配慮個人情報」に該当する。", "労働安全衛生法に基づく健康診断の結果であっても、本人の同意がない限り、事業者は一切取得することができない。", "ストレスチェックの結果は、本人の同意なく実施者から事業者に提供してはならない。", "要配慮個人情報を取得する場合には、法令に基づく場合等を除き、あらかじめ本人の同意を得なければならない。"], "answer": 1, "explanation": "<ul><li>労働安全衛生法に基づく健康診断の結果は、事業者が実施義務を負い、記録の作成・保存義務もあるため、「法令に基づく場合」として本人の同意なく取得できる。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>F社では、健康診断の結果は法令に基づいて人事が保管しているが、ストレスチェックの結果は本人の同意がない限り人事は見られない。高ストレス者が面接指導を申し出たときは、申出をもって同意があったものとみなし、その社員の結果だけを産業医を通じて受け取っている。<\/p>", "related": "<ul><li>「労働者の心身の状態に関する情報の適正な取扱いのために事業者が講ずべき措置に関する指針」（2018年）により、事業者は<strong>取扱規程<\/strong>を策定することとされた（衛生委員会等で審議）。<\/li><li>健康情報の加工（「就業上の措置に必要な範囲」で病名等を伏せて伝える）も重要な実務ポイント。<\/li><\/ul>"}, {"id": "2-6", "chapter": 2, "topic": "衛生管理者と職場巡視", "level": 2, "stem": "<p>衛生管理者および職場巡視に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["常時50人以上の労働者を使用する事業場では、衛生管理者を選任しなければならない。", "衛生管理者は、少なくとも毎週1回作業場等を巡視しなければならない。", "産業医による作業場等の巡視は、いかなる場合も少なくとも3か月に1回行えば足りる。", "衛生管理者は、労働者の健康障害を防止するための措置など、衛生に係る技術的事項を管理する。"], "answer": 2, "explanation": "<ul><li>産業医の巡視は<strong>原則として毎月1回以上<\/strong>。事業者から所定の情報（衛生管理者の巡視結果など）が毎月提供され、事業者の同意を得ている場合に限り、<strong>2か月に1回以上<\/strong>とすることができる。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>X社（従業員150人）では、衛生管理者が毎週金曜に職場を巡視して照明や整理整頓を確認している。産業医には衛生管理者の巡視結果などを毎月提供し、事業者の同意を得たうえで、産業医の巡視を2か月に1回としている。<\/p>", "related": "<ul><li>衛生管理者の選任数は、事業場の規模に応じて増える（50〜200人は1人、201〜500人は2人など）。<\/li><li>10人以上50人未満の事業場では、衛生推進者（業種によっては安全衛生推進者）を選任する。<\/li><\/ul>"}, {"id": "2-7", "chapter": 2, "topic": "4つのケア", "level": 1, "stem": "<p>メンタルヘルス指針の4つのケアに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["セルフケアは労働者自身が行うものであるため、事業者が教育研修や相談体制の整備を行う必要はない。", "ラインによるケアには、職場環境等の把握と改善、労働者からの相談対応、職場復帰における支援が含まれる。", "事業場内産業保健スタッフ等は、セルフケアやラインによるケアが効果的に実施されるよう、労働者や管理監督者を支援する。", "事業場外資源によるケアでは、必要に応じて事業場外の専門機関のネットワークを活用する。"], "answer": 0, "explanation": "<ul><li>労働者がストレスに気づき対処するためには、事業者による教育研修・情報提供や、相談しやすい体制の整備が必要である。指針も、事業者がセルフケアを支援するよう求めている。<\/li><li>②③④：いずれも正しい。<\/li><\/ul>", "example": "<p>Y社では、セルフケアとして全社員にストレス対処のeラーニングを提供し、ラインによるケアとして管理職研修、産業保健スタッフ等によるケアとして保健師の面談、事業場外資源によるケアとして外部EAPとの契約を行い、4つのケアを組み合わせている。<\/p>", "related": "<ul><li>管理監督者自身もセルフケアの対象である。<\/li><\/ul>"}, {"id": "2-8", "chapter": 2, "topic": "労働時間と休日の基本", "level": 1, "stem": "<p>労働基準法に定める労働時間・休憩・休日に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["労働時間が6時間を超える場合には、少なくとも1時間の休憩を与えなければならない。", "法定労働時間は、原則として1日10時間、1週50時間である。", "時間外労働をさせるには、労使協定（36協定）を締結すれば足り、労働基準監督署長への届出は不要である。", "使用者は、労働者に対して、毎週少なくとも1回、または4週間を通じて4日以上の休日を与えなければならない。"], "answer": 3, "explanation": "<ul><li>①：誤り。6時間を超える場合は少なくとも<strong>45分<\/strong>、8時間を超える場合は少なくとも<strong>1時間<\/strong>の休憩が必要。<\/li><li>②：誤り。法定労働時間は原則として<strong>1日8時間、1週40時間<\/strong>。<\/li><li>③：誤り。36協定は締結し、労働基準監督署長に<strong>届け出て<\/strong>はじめて効力が生じる。<\/li><\/ul>", "example": "<p>Z社の所定労働時間は9時〜18時（休憩1時間）の8時間。19時まで働いた日は1時間の時間外労働となるため、36協定を締結して届け出たうえで、25%以上の割増賃金を支払っている。<\/p>", "related": "<ul><li>割増賃金率：時間外労働25%以上（月60時間超は50%以上、中小企業も2023年4月から適用）、休日労働35%以上、深夜労働25%以上。<\/li><\/ul>"}, {"id": "2-9", "chapter": 2, "topic": "年次有給休暇と勤務間インターバル", "level": 2, "stem": "<p>年次有給休暇および勤務間インターバル制度に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["年10日以上の年次有給休暇が付与される労働者に対し、使用者は、そのうち年5日について時季を指定して取得させなければならない。", "年5日の取得義務は正社員のみが対象であり、パートタイム労働者は付与日数にかかわらず対象とならない。", "勤務間インターバル制度の導入は、事業主の努力義務とされている。", "年次有給休暇は、雇入れの日から6か月間継続勤務し、全労働日の8割以上出勤した労働者に付与される。"], "answer": 1, "explanation": "<ul><li>パートタイム労働者でも、比例付与により年10日以上の年次有給休暇が付与される場合は、年5日の取得義務の対象となる。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>週4日勤務のパート社員でも、勤続3年6か月で年10日の年休が付与されると、年5日の取得義務の対象になる。A社では年休の取得状況を管理簿で確認し、取得が進んでいない社員に時季を指定している。<\/p>", "related": "<ul><li>勤務間インターバル制度：前日の終業時刻から翌日の始業時刻までに一定時間の休息を確保する制度。睡眠時間の確保に役立つ。<\/li><li>年5日の時季指定義務に違反した場合は罰則（30万円以下の罰金）の対象となる。<\/li><\/ul>"}, {"id": "2-10", "chapter": 2, "topic": "健康情報の取扱規程", "level": 3, "stem": "<p>「労働者の心身の状態に関する情報の適正な取扱いのために事業者が講ずべき措置に関する指針」に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["心身の状態の情報の取扱規程は、産業医が単独で作成すれば足り、衛生委員会等で審議する必要はない。", "ストレスチェックの結果は、事業者が本人の同意なく直接取り扱うことができる情報に分類される。", "健康診断の受診・未受診の情報や、長時間労働者が面接指導を申し出た事実は、事業者が直接取り扱う必要がある情報とされている。", "健康情報は、どのような場合でも、加工せずにそのまま管理監督者へ伝えなければならない。"], "answer": 2, "explanation": "<ul><li>①：誤り。取扱規程は、衛生委員会等を活用して労使が関与して策定し、労働者に周知する。<\/li><li>②：誤り。ストレスチェックの結果は、本人の同意がない限り事業者が取り扱ってはならない情報である。<\/li><li>④：誤り。就業上の措置に必要な範囲に限って、病名などを伏せた形に加工して伝えることが望ましい。<\/li><\/ul>", "example": "<p>B社の取扱規程では、人事部が扱う情報を「健康診断の受診状況、面接指導の申出の有無、医師の就業上の意見」に限り、健康診断の詳しい検査値やストレスチェックの個人結果は産業保健スタッフが管理すると定めている。<\/p>", "related": "<ul><li>指針は心身の状態の情報を3つに分類している：①事業者が直接取り扱う必要がある情報、②取扱規程に基づき事業者が取り扱う情報（健康診断の結果など）、③原則として事業者が取り扱ってはならない情報（本人の同意のないストレスチェック結果など）。<\/li><\/ul>"}]}, {"num": 3, "title": "ストレスおよびメンタルヘルスに関する基礎知識", "questions": [{"id": "3-1", "chapter": 3, "topic": "職業性ストレスモデル", "level": 2, "stem": "<p>職業性ストレスに関する理論モデルについての次のア〜エの記述のうち、<strong>適切なものの組み合わせ<\/strong>を一つ選べ。<\/p>\n<p>ア．Karasekの仕事の要求度－コントロールモデルでは、仕事の要求度が高く、コントロール（裁量度）が低い「高ストレイン」群で心身のストレス反応が最も生じやすいとされる。<br>イ．Siegristの努力－報酬不均衡モデルでは、報酬として金銭的報酬のみが想定されている。<br>ウ．NIOSHの職業性ストレスモデルでは、仕事のストレッサーとストレス反応の関係に、個人的要因、仕事外の要因、緩衝要因が影響するとされる。<br>エ．Lazarusの心理学的ストレスモデルでは、一次評価で対処可能性を評価し、二次評価でストレッサーの脅威性を評価する。<\/p>", "choices": ["アとイ", "アとウ", "イとエ", "ウとエ"], "answer": 1, "explanation": "<ul><li>ア：正しい。Johnsonらはこれに社会的支援（サポート）を加えた「要求度－コントロール－サポートモデル」を提唱した。<\/li><li>イ：誤り。報酬には、金銭（経済的報酬）、心理的報酬（尊重）、キャリア（仕事の安定性・昇進）が含まれる。また個人要因として「オーバーコミットメント」が挙げられる。<\/li><li>ウ：正しい。緩衝要因の代表が上司・同僚・家族からの社会的支援。<\/li><li>エ：誤り。<strong>一次評価<\/strong>＝ストレッサーが自分にとって脅威かどうか（無関係／無害・肯定的／ストレスフル）の評価、<strong>二次評価<\/strong>＝対処可能性やコーピング資源の評価。逆になっている。<\/li><\/ul>", "example": "<p>工場のライン作業で、生産目標は高いのに作業のペースや手順を自分で決められない状態は、Karasekのモデルでいう「高ストレイン」にあたる。作業の進め方を班で決められるようにする（コントロールを高める）ことや、班長からの支援を増やすことが対策になる。<\/p>", "related": "<ul><li>Lazarus &amp; Folkman のコーピング：問題焦点型（問題そのものの解決）と情動焦点型（情動の調整）。<\/li><li>「仕事の要求度－資源モデル（JD-Rモデル）」は、ストレス（健康障害プロセス）と動機づけプロセスの2つの経路を想定する。<\/li><\/ul>"}, {"id": "3-2", "chapter": 3, "topic": "汎適応症候群", "level": 1, "stem": "<p>Selyeの汎適応症候群（全身適応症候群）に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["ストレッサーに対する生体の反応過程は、警告反応期、抵抗期、疲憊期の3期に分けられる。", "警告反応期は、ショック相と反ショック相に分けられる。", "疲憊期に入っても、ストレッサーが持続している限り、生体の抵抗力は高い水準で維持される。", "抵抗期では、ストレッサーに対する抵抗力が高まり、一見安定した状態となる。"], "answer": 2, "explanation": "<ul><li>疲憊期では、長期間のストレッサーにより適応エネルギーが枯渇し、抵抗力が低下して、さまざまな疾患が生じやすくなる。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>繁忙期に入った営業職の社員が、最初の数日は疲れや不眠を感じ（警告反応期）、その後は気が張って乗り切れているように見える（抵抗期）。しかし繁忙が数か月続くと、急に体調を崩すことがある（疲憊期）。元気そうに見える時期にも休養を確保させることが大切になる。<\/p>", "related": "<ul><li>ストレス反応の生理学的経路：視床下部－下垂体－副腎皮質系（HPA系：コルチゾール）と、交感神経－副腎髄質系（アドレナリン・ノルアドレナリン）。<\/li><li>Cannonは「闘争か逃走か（fight or flight）」反応を提唱した。<\/li><\/ul>"}, {"id": "3-3", "chapter": 3, "topic": "精神疾患の特徴", "level": 2, "stem": "<p>職場でみられる精神疾患に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["適応障害は、DSM-5では、はっきりと確認できるストレス因に反応して、その始まりから3か月以内に情動面または行動面の症状が出現するものとされている。", "うつ病の気分の日内変動としては、朝方に軽く、夕方に悪化するパターンが典型的である。", "双極性障害のうつ状態に対しては、抗うつ薬の単剤投与が第一選択とされている。", "パニック障害のパニック発作は、通常、数時間以上持続することが特徴である。"], "answer": 0, "explanation": "<ul><li>①：正しい。ストレス因やその結果が終結すると、症状はその後6か月以上持続しないとされる。<\/li><li>②：誤り。うつ病では<strong>朝方に悪く、夕方に軽快する<\/strong>日内変動が典型的。朝の出勤困難として現れやすい。<\/li><li>③：誤り。双極性障害では気分安定薬（リチウム等）や一部の非定型抗精神病薬が中心。抗うつ薬単剤は躁転のリスクがある。<\/li><li>④：誤り。パニック発作は突然生じ、数分以内にピークに達し、通常は数十分程度で治まる。<\/li><\/ul>", "example": "<p>部下が「朝がどうしても起きられない。午後になると少し楽になる」と話し、月曜の遅刻が増えている。うつ病の日内変動の可能性があるため、上司は遅刻を叱るのではなく、「いつもと違う」様子を心配していると伝えて、産業医や保健師への相談を勧める。<\/p>", "related": "<ul><li>うつ病の中核症状：抑うつ気分、興味・喜びの喪失。身体症状（不眠、食欲低下、倦怠感）が前面に出ることも多い。<\/li><li>アルコール依存症では否認が特徴的で、職場では遅刻・欠勤（特に月曜）、二日酔いでの出勤などが手がかりとなる。<\/li><\/ul>"}, {"id": "3-4", "chapter": 3, "topic": "ワーク・エンゲイジメントとバーンアウト", "level": 2, "stem": "<p>ワーク・エンゲイジメントおよびバーンアウトに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["ワーク・エンゲイジメントは、「活力」「熱意」「没頭」の3つによって特徴づけられる、仕事に関連するポジティブで充実した心理状態である。", "ワーカホリズムは、活動水準が高い点ではワーク・エンゲイジメントと共通するが、仕事への態度が否定的である点で異なる。", "Maslachらによるバーンアウトの概念は、「情緒的消耗感」「脱人格化」「個人的達成感の低下」の3つの症状から構成される。", "仕事の要求度－資源モデルでは、仕事の資源（上司の支援、裁量権等）は、動機づけプロセスを通じてバーンアウトを高めるとされる。"], "answer": 3, "explanation": "<ul><li>JD-Rモデルでは、仕事の資源や個人の資源は<strong>ワーク・エンゲイジメントを高め<\/strong>、それが健康・組織アウトカム（パフォーマンス等）につながる（動機づけプロセス）。バーンアウトを高めるのは仕事の要求度（健康障害プロセス）。<\/li><li>①②③：いずれも正しい（ワーク・エンゲイジメントはSchaufeliらが提唱）。<\/li><\/ul>", "example": "<p>病棟看護師のGさんは熱心に患者に接していたが、人員不足が続いて疲れ切り（情緒的消耗感）、患者に事務的で冷たい対応をするようになり（脱人格化）、「何をやっても役に立てていない」と感じるようになった（個人的達成感の低下）。バーンアウトの3症状がそろった例である。<\/p>", "related": "<ul><li>活動水準と仕事への態度の2軸で、ワーク・エンゲイジメント（高・肯定）、ワーカホリズム（高・否定）、職務満足感／リラックス（低・肯定）、バーンアウト（低・否定）と整理される。<\/li><li>ポジティブメンタルヘルスの考え方は、ストレスチェック後の職場環境改善にも活用される。<\/li><\/ul>"}, {"id": "3-5", "chapter": 3, "topic": "ライフイベントとストレス", "level": 1, "stem": "<p>HolmesとRaheの社会的再適応評価尺度に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["生活上の出来事（ライフイベント）に再適応するために必要な労力の大きさを数値化したものである。", "昇進や結婚などの好ましい出来事はストレッサーとはならないため、尺度には含まれていない。", "「結婚」を50点として基準にし、他の出来事を評価している。", "最も得点が高い出来事は「配偶者の死」である。"], "answer": 1, "explanation": "<ul><li>結婚、昇進、休暇などの好ましい出来事も、生活の変化として再適応を要するためストレッサーになりうる。実際に尺度に含まれている（「結婚」が基準の50点）。<\/li><li>①③：正しい。<\/li><li>④：配偶者の死は100点で最高点。<\/li><\/ul>", "example": "<p>念願の課長に昇進した社員が、部下の管理や新しい責任に追われ、2か月後から不眠と気分の落ち込みが続くようになった。いわゆる「昇進うつ病」の例で、好ましい出来事もストレッサーになる。人事は昇進直後の面談やフォローアップ研修を用意しておくとよい。<\/p>", "related": "<ul><li>一定期間内の得点合計が高いほど、その後の健康障害の発生率が高いとされた。<\/li><li>ライフイベントに対し、Lazarusは日常の苛立ちごと（デイリーハッスルズ）の重要性を指摘した。<\/li><li>昇進うつ病、荷下ろしうつ病など、好ましい出来事が契機となる状態にも注意。<\/li><\/ul>"}, {"id": "3-6", "chapter": 3, "topic": "睡眠と健康", "level": 1, "stem": "<p>睡眠に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["起床後に朝の光を浴びると、体内時計がリセットされ、夜の自然な眠気につながる。", "就寝前のカフェイン摂取は、寝つきを悪くする原因となる。", "昼寝をする場合は、午後の早い時間に短時間（30分以内程度）とするのがよい。", "寝酒（就寝前の飲酒）は、寝つきをよくし睡眠の質も高めるため、不眠対策として推奨される。"], "answer": 3, "explanation": "<ul><li>アルコールは一時的に寝つきをよくするが、夜中に目が覚めやすくなるなど睡眠の質を下げる。習慣化すると量が増え、アルコール依存のリスクも高まる。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>交代勤務の工場では、夜勤明けの帰宅時はサングラスで強い光を避け、帰宅後は遮光カーテンで部屋を暗くして眠るよう保健師が指導している。不眠を寝酒で紛らわせていた社員には、アルコールで夜中に目が覚めやすくなることを説明した。<\/p>", "related": "<ul><li>厚生労働省「健康づくりのための睡眠ガイド2023」では、成人はおおむね6時間以上の睡眠時間を確保することが目安とされている。<\/li><li>不眠は、うつ病の初期症状として現れることが多い。<\/li><\/ul>"}, {"id": "3-7", "chapter": 3, "topic": "アルコール関連問題", "level": 2, "stem": "<p>アルコール関連問題に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["AUDITは、WHOが作成したアルコール使用障害のスクリーニングテストである。", "アルコール依存症の離脱症状（手の震え、発汗、不眠など）は、飲酒している最中に最も強く現れる。", "アルコール依存症の本人は、多くの場合、自らの飲酒問題を積極的に認めるため、周囲からの働きかけは不要である。", "アルコール依存症の治療目標は、すべての場合において節酒であり、断酒は推奨されない。"], "answer": 0, "explanation": "<ul><li>②：誤り。離脱症状は、飲酒をやめたり減らしたりしたときに現れる。<\/li><li>③：誤り。アルコール依存症では「否認」が特徴的で、本人は問題を認めにくい。周囲からの働きかけが重要。<\/li><li>④：誤り。アルコール依存症の治療目標は原則として断酒である（軽症例などで節酒が選択されることはある）。<\/li><\/ul>", "example": "<p>月曜日の欠勤や遅刻が多く、朝から酒の臭いがする社員に対し、上司は飲酒そのものを責めず「勤務状況が心配だ」と事実を伝え、産業医との面談につないだ。産業医はAUDITで評価し、専門の医療機関の受診を勧めた。<\/p>", "related": "<ul><li>断酒会やAA（アルコホーリクス・アノニマス）などの自助グループが回復を支える。<\/li><li>家族が飲酒の後始末をして問題を見えにくくしてしまうこと（イネイブリング）にも注意する。<\/li><\/ul>"}, {"id": "3-8", "chapter": 3, "topic": "発達障害", "level": 2, "stem": "<p>職場における発達障害に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["自閉スペクトラム症（ASD）では、対人コミュニケーションの困難や、限定された興味・こだわりなどの特性がみられる。", "注意欠如・多動症（ADHD）の特性は子どもの時期に限られ、成人になると必ず消失する。", "発達障害の特性のために職場への適応が難しくなり、うつ病などの二次障害を生じることがある。", "事業主は、障害者雇用促進法により、過重な負担にならない範囲で、障害のある労働者に合理的配慮を提供しなければならない。"], "answer": 1, "explanation": "<ul><li>ADHDの特性は成人期にも続くことが多く、不注意によるミスや段取りの困難として職場で問題になることがある。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>口頭の指示が重なると混乱しやすい社員に対し、指示をチャットで文章にする、優先順位を一つずつ示す、静かな席に配置するといった配慮を行ったところ、ミスが減った。<\/p>", "related": "<ul><li>合理的配慮の内容は、本人との話合いにより決める。<\/li><li>2024年4月の改正障害者差別解消法の施行により、事業者による合理的配慮の提供は雇用以外の分野でも義務となった（雇用の分野は障害者雇用促進法で規定）。<\/li><\/ul>"}, {"id": "3-9", "chapter": 3, "topic": "ストレス反応の分類", "level": 1, "stem": "<p>ストレス反応に関する次のア〜エの記述のうち、<strong>適切なものの組み合わせ<\/strong>を一つ選べ。<\/p>\n<p>ア．不安、イライラ、気分の落ち込みは、心理的反応にあたる。<br>イ．飲酒量や喫煙量の増加は、行動的反応にあたる。<br>ウ．動悸、頭痛、胃の不調は、心理的反応にあたる。<br>エ．事故やミスの増加は、身体的反応にあたる。<\/p>", "choices": ["アとイ", "アとウ", "イとエ", "ウとエ"], "answer": 0, "explanation": "<ul><li>ア：正しい。<\/li><li>イ：正しい。<\/li><li>ウ：誤り。動悸、頭痛、胃の不調などは<strong>身体的反応<\/strong>。<\/li><li>エ：誤り。事故やミスの増加は<strong>行動的反応<\/strong>。<\/li><\/ul>", "example": "<p>ある社員は、イライラや不安（心理的反応）に加え、頭痛や胃の不調（身体的反応）が続き、喫煙本数が増えて作業ミスも目立つようになった（行動的反応）。3種類の反応が同時に現れることも多い。<\/p>", "related": "<ul><li>職業性ストレス簡易調査票では、心身のストレス反応として「活気、イライラ感、疲労感、不安感、抑うつ感、身体愁訴」を測定する。<\/li><\/ul>"}, {"id": "3-10", "chapter": 3, "topic": "ソーシャルサポート", "level": 2, "stem": "<p>ソーシャルサポートの種類に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["情報的サポートとは、相手の気持ちに共感し、励ましたり慰めたりすることである。", "評価的サポートとは、仕事を手伝ったり金銭的に援助したりすることである。", "道具的サポートとは、仕事を手伝う、人手を増やすなど、問題解決のために直接的な手助けをすることである。", "情緒的サポートとは、問題解決に役立つ知識や情報を提供することである。"], "answer": 2, "explanation": "<ul><li>①：誤り。説明は<strong>情緒的サポート<\/strong>。<\/li><li>②：誤り。説明は<strong>道具的サポート<\/strong>。評価的サポートは、仕事ぶりを適切に評価し、フィードバックすること。<\/li><li>④：誤り。説明は<strong>情報的サポート<\/strong>。<\/li><\/ul>", "example": "<p>締切前で困っている部下に、上司が「大変だったね」と声をかけ（情緒的）、作業の一部を他のメンバーに割り振り（道具的）、過去の類似案件の資料を渡し（情報的）、「この部分の分析はよくできている」と伝えた（評価的）。<\/p>", "related": "<ul><li>Houseはソーシャルサポートを、情緒的・道具的・情報的・評価的の4つに分類した。<\/li><li>仕事のストレス判定図の「職場の支援判定図」は、上司の支援と同僚の支援から健康リスクを示す。<\/li><\/ul>"}]}, {"num": 4, "title": "人事労務管理スタッフに求められる能力", "questions": [{"id": "4-1", "chapter": 4, "topic": "パワーハラスメントの定義", "level": 1, "stem": "<p>労働施策総合推進法および厚生労働省の指針（パワハラ防止指針）における職場のパワーハラスメントに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["職場のパワーハラスメントは、「優越的な関係を背景とした言動」「業務上必要かつ相当な範囲を超えたもの」「労働者の就業環境が害されるもの」の3つの要素をすべて満たすものをいう。", "客観的にみて、業務上必要かつ相当な範囲で行われる適正な業務指示や指導は、職場のパワーハラスメントには該当しない。", "「優越的な関係」とは職務上の地位が上位の者との関係に限られ、同僚や部下からの言動がパワーハラスメントに該当することはない。", "業務上の合理性なく、能力や経験とかけ離れた程度の低い仕事を命じることや、仕事を与えないことは、「過小な要求」の例とされている。"], "answer": 2, "explanation": "<ul><li>同僚や部下からの言動でも、その者が業務上必要な知識や豊富な経験を有しており協力を得なければ業務の円滑な遂行が困難な場合や、集団による行為で抵抗・拒絶が困難な場合は「優越的な関係」に該当しうる。<\/li><li>①②④：いずれも指針の内容に沿っている。<\/li><\/ul>", "example": "<p>専門知識を持つ部下たちが、異動してきた上司に対して集団で業務に必要な情報を共有せず、無視を続けた。上司は業務を進められず、就業環境が害された。部下から上司への言動でも「優越的な関係を背景とした言動」にあたりうる例である。<\/p>", "related": "<ul><li>6類型：①身体的な攻撃、②精神的な攻撃、③人間関係からの切り離し、④過大な要求、⑤過小な要求、⑥個の侵害。<\/li><li>「個の侵害」には、性的指向・性自認や病歴等の機微な個人情報を本人の了解を得ずに他の労働者に暴露すること（アウティング）が含まれる。<\/li><\/ul>"}, {"id": "4-2", "chapter": 4, "topic": "パワハラ防止のための事業主の措置義務", "level": 2, "stem": "<p>職場のパワーハラスメント防止のための事業主の措置義務に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["労働者がパワーハラスメントについて相談したことを理由とする解雇その他不利益な取扱いは、就業規則に禁止規定がなければ法律上禁止されない。", "中小企業事業主についても、2022年4月から雇用管理上の措置が義務化された。", "事業主が措置義務に違反した場合には、直ちに刑事罰が科される。", "相談窓口は、事業場内に設置しなければならず、外部機関に委託することは認められない。"], "answer": 1, "explanation": "<ul><li>①：誤り。相談したこと、事実確認に協力したこと等を理由とする不利益取扱いは<strong>法律で禁止<\/strong>されている。<\/li><li>②：正しい。大企業は2020年6月から、中小企業は2022年4月から義務化（それまでは努力義務）。<\/li><li>③：誤り。違反に対しては厚生労働大臣による助言・指導・勧告、勧告に従わない場合の企業名公表等の行政措置が中心であり、直ちに刑事罰が科されるわけではない。<\/li><li>④：誤り。相談窓口は外部機関への委託も可能。<\/li><\/ul>", "example": "<p>従業員80人のH社は、2022年4月の義務化に合わせて、ハラスメントを行ってはならない旨と懲戒規定を就業規則に明記した。社内窓口に加えて社外の相談窓口（社会保険労務士事務所）を設け、相談したことを理由に不利益な取扱いをしないことを全社員に周知した。<\/p>", "related": "<ul><li>事業主が講ずべき措置：①方針の明確化と周知・啓発、②相談に応じ適切に対応するための体制整備、③事後の迅速かつ適切な対応、④プライバシー保護・不利益取扱い禁止の周知等。<\/li><li>2025年の法改正により、カスタマーハラスメント対策も事業主の雇用管理上の措置義務とされた（施行日は公式情報で確認）。<\/li><\/ul>"}, {"id": "4-3", "chapter": 4, "topic": "積極的傾聴", "level": 1, "stem": "<p>Rogersの来談者中心療法に基づく、相談対応において求められる基本的態度に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["相談者の話を早い段階で要約・評価し、聴き手が適切と考える解決策を指示することが最も重要である。", "相談者の話の内容に関わらず、相談者を一人の人間として尊重する「無条件の肯定的関心」が重要である。", "聴き手が自分の感情や考えを偽らず、ありのままの自分でいる「自己一致（純粋性）」が重要である。", "相談者の内的世界を、あたかも自分自身のものであるかのように感じ取ろうとする「共感的理解」が重要である。"], "answer": 0, "explanation": "<ul><li>積極的傾聴では、評価・批判・説得・指示を急がず、相談者の気持ちを受け止めることが基本。早期の評価や助言は、相談者が話しにくくなる要因になる。<\/li><li>②③④：Rogersの3条件（共感的理解、無条件の肯定的関心、自己一致）。<\/li><\/ul>", "example": "<p>部下が「最近よく眠れなくて……」と話したとき、上司がすぐに「早く寝ればいいよ」と助言すると、会話はそこで終わってしまう。「眠れないんだね。いつ頃からかな？」と受け止めて開かれた質問で続けたところ、仕事の負担が増えたことが背景にあると分かった。<\/p>", "related": "<ul><li>傾聴の技法：うなずき・あいづち、繰り返し、言い換え、感情の反映、要約、開かれた質問（オープンクエスチョン）。<\/li><li>「なぜ？」で問い詰める質問は、相手に責められている印象を与えやすい。<\/li><\/ul>"}, {"id": "4-4", "chapter": 4, "topic": "傷病手当金", "level": 2, "stem": "<p>健康保険法の傷病手当金に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["任意継続被保険者期間中に初めて発症した傷病についても、傷病手当金は支給される。", "支給額は、1日につき、支給開始日以前12か月間の標準報酬月額の平均額の30分の1に相当する額の3分の1である。", "支給期間は、同一の傷病について、支給開始日から暦の上で1年6か月を経過した時点で終了する。", "業務外の傷病で労務に服することができない場合、連続する3日間の待期期間を経て、4日目から支給される。"], "answer": 3, "explanation": "<ul><li>①：誤り。任意継続被保険者には傷病手当金は支給されない（資格喪失前から継続して受給している場合等の継続給付は別）。<\/li><li>②：誤り。支給額は標準報酬日額相当額の<strong>3分の2<\/strong>。<\/li><li>③：誤り。2022年1月の改正により、支給開始日から<strong>通算して1年6か月<\/strong>となった（途中で出勤し支給されない期間があれば、その分延長される）。<\/li><\/ul>", "example": "<p>月曜日からうつ病で休業し、有給休暇を使わなかった場合、月・火・水曜日が待期期間となり、木曜日から傷病手当金の支給対象になる。標準報酬月額が30万円で推移していた人なら、日額は1万円の3分の2で約6,667円となる。<\/p>", "related": "<ul><li>業務上の傷病（労災認定）の場合は労災保険の休業（補償）給付の対象となり、傷病手当金は支給されない。<\/li><li>精神科通院医療費の自己負担を軽減する制度として、障害者総合支援法の「自立支援医療（精神通院医療）」（原則1割負担）がある。<\/li><\/ul>"}, {"id": "4-5", "chapter": 4, "topic": "労働時間の状況の把握", "level": 2, "stem": "<p>労働安全衛生法に基づく労働時間の状況の把握に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["事業者は、タイムカードによる記録、パーソナルコンピュータ等の使用時間の記録等の客観的な方法により、労働者の労働時間の状況を把握しなければならない。", "把握した労働時間の状況の記録は、3年間保存しなければならない。", "裁量労働制の適用を受ける労働者は、みなし労働時間制がとられているため、労働時間の状況の把握の対象とはならない。", "労働者の自己申告による把握は、客観的な方法により把握することがやむを得ず困難な場合に限り認められる。"], "answer": 2, "explanation": "<ul><li>労働時間の状況の把握は、健康確保（面接指導）のために行うものであり、裁量労働制適用者や管理監督者も対象となる。対象外は高度プロフェッショナル制度の対象者（別途「健康管理時間」を把握）。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>裁量労働制の研究職についても、入退館記録で在社時間を把握する。I社では、在社時間から計算した週40時間を超える時間が月80時間を超えた研究員に、産業医の面接指導の案内が自動で届く仕組みにしている。<\/p>", "related": "<ul><li>自己申告制の場合は、適正な申告の説明、実態調査、申告時間の上限設定の禁止等の措置が求められる。<\/li><li>過重労働は、メンタルヘルス不調と脳・心臓疾患の双方のリスク要因である。<\/li><\/ul>"}, {"id": "4-6", "chapter": 4, "topic": "セクシュアルハラスメント", "level": 1, "stem": "<p>職場におけるセクシュアルハラスメントに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["職場におけるセクシュアルハラスメントには、「対価型」と「環境型」がある。", "同性に対する性的な言動は、職場におけるセクシュアルハラスメントには該当しない。", "被害を受ける者の性的指向や性自認にかかわらず、性的な言動であればセクシュアルハラスメントに該当しうる。", "取引先など他の事業主が雇用する労働者や顧客からの性的な言動も、職場におけるセクシュアルハラスメントとなりうる。"], "answer": 1, "explanation": "<ul><li>男女雇用機会均等法に基づく指針では、同性に対するものも職場におけるセクシュアルハラスメントに含まれるとされている。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>男性社員が、男性の上司から飲み会の席で容姿や性的な経験について繰り返しからかわれ、出社がつらくなった。同性間の性的な言動もセクハラにあたるため、会社は相談に応じて事実確認を行う必要がある。<\/p>", "related": "<ul><li>対価型：性的な言動への対応（拒否など）により、解雇・降格などの不利益を受けるもの。環境型：性的な言動により就業環境が不快なものとなり、能力の発揮に重大な悪影響が生じるもの。<\/li><li>2020年の改正で、他社から事実確認などへの協力を求められた場合に応じるよう努めることが定められた。<\/li><\/ul>"}, {"id": "4-7", "chapter": 4, "topic": "妊娠・出産・育児休業等に関するハラスメント", "level": 2, "stem": "<p>妊娠・出産、育児休業等に関するハラスメントに関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["妊娠・出産等に関するハラスメントの防止措置は、事業主の努力義務にとどまる。", "業務分担や安全配慮の観点から客観的にみて業務上の必要性に基づく言動であっても、妊娠中の労働者に対するものはすべてハラスメントに該当する。", "育児休業の取得を相談した労働者に対し、上司が「休むなら辞めてもらう」と言うことは、制度等の利用への嫌がらせ型のハラスメントにあたる。", "育児休業等に関するハラスメントの防止措置の対象は、女性労働者に限られる。"], "answer": 2, "explanation": "<ul><li>①：誤り。男女雇用機会均等法・育児介護休業法により、事業主の<strong>措置義務<\/strong>とされている。<\/li><li>②：誤り。業務上の必要性に基づく言動（体調に配慮した業務量の調整など）はハラスメントに該当しない。<\/li><li>④：誤り。男性労働者の育児休業取得などに関する言動も対象となる。<\/li><\/ul>", "example": "<p>男性社員が育児休業の取得を申し出たところ、上司から「男が育休なんて、出世をあきらめたのか」と言われた。男性の育休取得に関する嫌がらせも、育児休業等に関するハラスメントにあたる。<\/p>", "related": "<ul><li>2つの型：「制度等の利用への嫌がらせ型」と「状態への嫌がらせ型」（妊娠・出産したことなどに関する言動）。<\/li><\/ul>"}, {"id": "4-8", "chapter": 4, "topic": "障害者雇用と合理的配慮", "level": 2, "stem": "<p>障害者雇用促進法に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["精神障害者は、2018年4月から障害者雇用義務の対象に加えられた。", "事業主は、障害のある労働者からの相談に適切に対応するための体制を整備しなければならない。", "事業主は、募集・採用や賃金などの待遇について、障害者であることを理由とする差別をしてはならない。", "合理的配慮の提供は事業主の努力義務であり、過重な負担の有無にかかわらず提供しなくてもよい。"], "answer": 3, "explanation": "<ul><li>合理的配慮の提供は事業主の<strong>義務<\/strong>である。ただし、事業主にとって過重な負担となる場合は除かれる。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>うつ病の既往があり精神障害者保健福祉手帳を持つ人を採用したC社では、本人と話し合い、通院日の時間単位の休暇、週1回の上司との短い面談、業務指示の文書化を合理的配慮として取り決めた。<\/p>", "related": "<ul><li>法定雇用率は段階的に引き上げられているため、最新の率を公式情報で確認しておく。<\/li><li>精神障害者である短時間労働者の算定には特例措置がある。<\/li><\/ul>"}, {"id": "4-9", "chapter": 4, "topic": "アサーション", "level": 1, "stem": "<p>アサーションに関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["アサーションとは、自分も相手も大切にしながら、自分の気持ちや考えを率直に、その場にふさわしい方法で表現することである。", "アサーティブな自己表現とは、相手の意見を常に優先し、自分の考えは控えることをいう。", "攻撃的な自己表現は、自分の主張を通すことができるため、職場の人間関係を良好にする。", "DESC法は、相手を説得するために、自分の感情だけを強く伝える手法である。"], "answer": 0, "explanation": "<ul><li>②：誤り。説明は<strong>非主張的<\/strong>な自己表現。<\/li><li>③：誤り。攻撃的な自己表現は相手を傷つけ、人間関係を悪化させやすい。<\/li><li>④：誤り。DESC法は、状況の描写、気持ちの表現、提案、選択肢の提示という順序で、相手を尊重しながら伝える手法。<\/li><\/ul>", "example": "<p>残業が続く中で新しい仕事を頼まれた社員が、DESC法で「今週は締切が3件重なっています（D）。このままでは品質が落ちそうで心配です（E）。締切を来週にするか、他の方に頼んでいただけませんか（S）。難しければ、優先順位を一緒に決めさせてください（C）」と伝えた。<\/p>", "related": "<ul><li>自己表現の3タイプ：非主張的、攻撃的、アサーティブ。<\/li><li>DESC：Describe（描写する）、Express／Explain（表現する・説明する）、Specify（提案する）、Choose（選択する）。<\/li><\/ul>"}, {"id": "4-10", "chapter": 4, "topic": "私傷病休職と復職", "level": 3, "stem": "<p>私傷病による休職と復職に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["私傷病による休職制度は、労働基準法によりすべての事業主に設置が義務づけられている。", "私傷病による休職期間中も、使用者は通常どおりの賃金を全額支払わなければならない。", "職種や業務内容を限定せずに雇用された労働者が従前の業務を完全には行えない場合、使用者は他の業務への配置の可能性を検討することなく、労務の提供がないと判断してよい。", "休職期間満了時の復職の可否の判断にあたっては、主治医や産業医の意見を参考に、休職前の業務だけでなく、配置可能な他の業務の有無も考慮されることがある。"], "answer": 3, "explanation": "<ul><li>①：誤り。休職制度は法律上の義務ではなく、就業規則などで任意に定める制度。<\/li><li>②：誤り。休職期間中の賃金は就業規則などの定めによる。無給とし、健康保険の傷病手当金でまかなうことが多い。<\/li><li>③：誤り。片山組事件の最高裁判決により、職種を限定しない労働契約では、配置される現実的可能性がある他の業務についても検討する必要がある。<\/li><\/ul>", "example": "<p>【片山組事件（最高裁 1998年）】現場監督をしていた労働者が病気のため現場作業ができなくなり、事務作業を申し出たが、会社は自宅療養を命じて賃金を支払わなかった。最高裁は、職種を限定していない場合、配置される現実的可能性がある他の業務について労務を提供できるなら、労務の提供があったと解すべきだとした。<\/p>", "related": "<ul><li>再発を繰り返すケースに備え、同一・類似の傷病による休職期間を通算する規定を就業規則に置くことが多い。<\/li><\/ul>"}]}, {"num": 5, "title": "メンタルヘルスケアに関する方針と計画", "questions": [{"id": "5-1", "chapter": 5, "topic": "心の健康づくり計画で定める事項", "level": 1, "stem": "<p>メンタルヘルス指針において、心の健康づくり計画で定める事項として示されて<strong>いないもの<\/strong>を一つ選べ。<\/p>", "choices": ["事業者がメンタルヘルスケアを積極的に推進する旨の表明に関すること", "労働者の健康情報の保護に関すること", "心の健康づくり計画の実施状況の評価及び計画の見直しに関すること", "心の健康問題による休業者数の削減目標と、目標未達成時の管理監督者の処分に関すること"], "answer": 3, "explanation": "<p>指針が示す心の健康づくり計画で定める事項は次の7つ。<\/p>\n<ol><li>事業者がメンタルヘルスケアを積極的に推進する旨の表明に関すること<\/li><li>事業場における心の健康づくりの体制の整備に関すること<\/li><li>事業場における問題点の把握及びメンタルヘルスケアの実施に関すること<\/li><li>メンタルヘルスケアを行うために必要な人材の確保及び事業場外資源の活用に関すること<\/li><li>労働者の健康情報の保護に関すること<\/li><li>心の健康づくり計画の実施状況の評価及び計画の見直しに関すること<\/li><li>その他労働者の心の健康づくりに必要な措置に関すること<\/li><\/ol>\n<p>数値目標の設定自体は有用だが、管理監督者の処分を定めることは示されておらず、休業者の申告抑制など逆効果を招くおそれもある。<\/p>", "example": "<p>J社の心の健康づくり計画（3か年）の例：①社長メッセージで方針を表明、②推進担当者と産業医の役割分担を明記、③ストレスチェックと管理職研修を実施、④外部EAPと契約、⑤健康情報の取扱規程を策定、⑥毎年度末に衛生委員会で評価して見直す。<\/p>", "related": "<ul><li>方針表明は、トップ（経営者）自らが行うことで組織全体への浸透が図られる。<\/li><\/ul>"}, {"id": "5-2", "chapter": 5, "topic": "計画の策定と評価", "level": 2, "stem": "<p>心の健康づくり計画の策定と評価に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["メンタルヘルスケアの効果は短期間で現れるため、計画期間は1年以内とし、単年度ごとに完結させることが指針上求められている。", "計画の評価にあたっては、取組みの実施状況（研修実施回数や受講率など）だけでなく、休業者数や高ストレス者の割合などの成果も評価指標とすることが望ましい。", "心の健康づくり計画は、安全衛生計画とは別個独立に策定しなければならず、安全衛生計画の中に位置づけてはならない。", "数値目標を設定することは、労働者の個人情報保護の観点から避けるべきである。"], "answer": 1, "explanation": "<ul><li>①：誤り。メンタルヘルスケアは<strong>中長期的視点<\/strong>に立って継続的かつ計画的に行うことが重要。<\/li><li>②：正しい。PDCAサイクルにおける評価では、ストラクチャー（体制）、プロセス（実施状況）、アウトカム（成果）など複数の視点で評価することが有用。<\/li><li>③：誤り。指針は、心の健康づくり計画を各事業場の安全衛生に関する計画の中に位置づけることが望ましいとしている。<\/li><li>④：誤り。集団単位の数値目標は個人の特定につながらない形で設定でき、取組みの評価に有用。<\/li><\/ul>", "example": "<p>K社では、計画の評価指標を「管理職研修の受講率90%以上」（実施状況）と「高ストレス者の割合を3年で2ポイント下げる」「メンタルヘルス不調による休業者数」（成果）の両方で設定し、毎年度、衛生委員会で確認している。<\/p>", "related": "<ul><li>第14次労働災害防止計画（2023〜2027年度）では、メンタルヘルス対策に取り組む事業場の割合を80%以上とすることなどが目標とされている。<\/li><\/ul>"}, {"id": "5-3", "chapter": 5, "topic": "ストレスチェック制度の実施体制", "level": 2, "stem": "<p>ストレスチェック制度に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["ストレスチェックの実施者となれるのは、医師、保健師、または厚生労働大臣が定める研修を修了した歯科医師、看護師、精神保健福祉士もしくは公認心理師である。", "検査を受ける労働者について解雇、昇進または異動に関して直接の権限を持つ監督的地位にある者は、ストレスチェックの実施の事務に従事してはならない。", "高ストレス者と判定され、面接指導が必要と実施者が認めた労働者については、本人の申出がなくても、事業者は医師による面接指導を受けさせなければならない。", "事業者は、労働者がストレスチェックを受けないことを理由として、不利益な取扱いをしてはならない。"], "answer": 2, "explanation": "<ul><li>面接指導は、高ストレス者で面接指導が必要と認められた労働者から<strong>申出があった場合<\/strong>に実施する。事業者は申出を勧奨することはできるが、申出なく実施する義務はない。<\/li><li>①②④：いずれも正しい。なお、労働者にストレスチェックの受検義務はない。<\/li><\/ul>", "example": "<p>L社では、ストレスチェックの実施者を嘱託産業医とし、調査票の配布・回収やデータ入力などの実施事務は、人事権のない総務課の担当者が行う。人事部長は個人の結果を見ることができない。高ストレス者には、実施者から面接指導の申出を勧める案内が届く。<\/p>", "related": "<ul><li>申出の時期：結果通知後おおむね1か月以内 → 面接指導：申出後おおむね1か月以内 → 医師からの意見聴取：面接指導後おおむね1か月以内。<\/li><li>面接指導の申出をもって、事業者に結果提供の同意があったものとみなされる。<\/li><\/ul>"}, {"id": "5-4", "chapter": 5, "topic": "ストレスチェック制度の数字", "level": 2, "stem": "<p>ストレスチェック制度に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["常時50人以上の労働者を使用する事業場では、1年以内ごとに1回、定期にストレスチェックを実施しなければならない。", "本人の同意を得て事業者に提供されたストレスチェックの結果の記録は、3年間保存しなければならない。", "ストレスチェックの結果の集団ごとの集計・分析は、事業者の義務とされている。", "面接指導の結果の記録は、3年間保存しなければならない。"], "answer": 0, "explanation": "<ul><li>②：誤り。事業者に提供された結果は事業者が<strong>5年間<\/strong>保存しなければならない（同意がない場合は実施者による保存、5年間が望ましい）。<\/li><li>③：誤り。集団分析は<strong>努力義務<\/strong>。<\/li><li>④：誤り。面接指導の結果の記録は<strong>5年間<\/strong>保存。<\/li><\/ul>", "example": "<p>6月にストレスチェックを実施した会社では、翌年も6月頃に実施する（1年以内ごとに1回）。実施状況は年1回労働基準監督署に報告し、本人の同意を得て受け取った結果と面接指導の記録は5年間保存する。<\/p>", "related": "<ul><li>50人以上の事業場は、実施状況を所轄労働基準監督署長に報告（年1回）。<\/li><li>使用する調査票は「職業性ストレス簡易調査票」（57項目）が推奨されている。①仕事のストレス要因、②心身のストレス反応、③周囲のサポートの3領域を含むことが必要。<\/li><li>2025年の労働安全衛生法改正により、50人未満の事業場でもストレスチェックが義務化されることとなった（公布後3年以内に施行。施行日は公式情報で確認）。<\/li><\/ul>"}, {"id": "5-5", "chapter": 5, "topic": "集団分析の活用", "level": 3, "stem": "<p>ストレスチェックの集団分析とその活用に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["「仕事のストレス判定図」は、全国平均を100として、職場の総合健康リスクを示すものである。", "集団分析の結果は、職場の管理監督者のマネジメント能力を示すものであるため、管理監督者個人の人事評価に直接反映させるべきである。", "集団ごとの集計・分析の単位が10人を下回る場合には、原則として、その集団の全員の同意がない限り、事業者に結果を提供してはならない。", "「仕事のストレス判定図」は、「量－コントロール判定図」と「職場の支援判定図」から構成される。"], "answer": 1, "explanation": "<ul><li>集団分析の結果は職場環境改善のために活用すべきものであり、管理監督者の評価に直接使うと、結果の隠蔽や現場の萎縮を招くおそれがある。ストレスチェック指針も、管理監督者の人事評価に用いるなどの不適切な取扱いに留意するよう求めている。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>M社では、総合健康リスクが130だった営業課について、課長を責めるのではなく、課員が参加するワークショップを開いて「定例会議を半分に減らす」「訪問予定を共有する」などの改善策を決めた。翌年のストレスチェックでは112に下がった。<\/p>", "related": "<ul><li>総合健康リスク120 → 健康問題の発生リスクが全国平均より約20%高いと推定。<\/li><li>集団分析結果は衛生委員会で共有し、職場環境改善計画につなげる（第9章参照）。<\/li><\/ul>"}, {"id": "5-6", "chapter": 5, "topic": "高ストレス者の選定", "level": 3, "stem": "<p>ストレスチェックにおける高ストレス者の選定に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["高ストレス者は、「心身のストレス反応」の評価点数が高い者、または「心身のストレス反応」の評価点数が一定以上で、かつ「仕事のストレス要因」と「周囲のサポート」の評価点数の合計が著しく高い者を選定する。", "高ストレス者の選定基準は事業場ごとに定めることは認められず、すべての事業場で全国一律の基準を用いなければならない。", "高ストレス者の選定は、「周囲のサポート」の評価点数のみに基づいて行う。", "高ストレス者に該当した労働者は、自動的に精神疾患と診断されたものとみなされる。"], "answer": 0, "explanation": "<ul><li>②：誤り。選定基準は、実施者の意見と衛生委員会等での調査審議を踏まえて、事業者が決定する。<\/li><li>③：誤り。「心身のストレス反応」を中心に評価する。<\/li><li>④：誤り。ストレスチェックは診断ではなく、高ストレス者に該当しても精神疾患と診断されたわけではない。<\/li><\/ul>", "example": "<p>U社では、厚生労働省のストレスチェック実施マニュアルが示す評価基準の例を参考にし、実施者の意見と衛生委員会での審議を経て、高ストレス者の選定基準を決めた。<\/p>", "related": "<ul><li>調査票の点数に加え、実施者などによる面談（補足的面談）の結果を参考にして選定する方法もある。<\/li><\/ul>"}, {"id": "5-7", "chapter": 5, "topic": "結果の通知と同意", "level": 2, "stem": "<p>ストレスチェック結果の通知と事業者への提供に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["ストレスチェックの結果は、実施者から直接本人に通知される。", "本人に通知する内容には、個人のストレスプロフィール、高ストレス者に該当するかどうか、面接指導の要否が含まれる。", "事業者は、ストレスチェックの実施前または実施時に、結果を事業者に提供することについての同意を労働者から一括して取得することができる。", "結果の提供についての同意は、書面または電磁的記録によって取得する必要がある。"], "answer": 2, "explanation": "<ul><li>同意の取得は、本人に結果が通知された<strong>後<\/strong>に行う必要があり、実施前や実施時に取得することは認められない。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>V社では、受検画面に「結果を会社に提供することに同意する」のチェック欄を設けていたが、ストレスチェック指針に反するため廃止した。現在は、結果の通知後に、面接指導の対象者に個別に同意を確認している。<\/p>", "related": "<ul><li>結果の通知は、封書や、本人だけが見られる電子的な方法で行う。<\/li><\/ul>"}, {"id": "5-8", "chapter": 5, "topic": "ストレスチェック後の面接指導", "level": 2, "stem": "<p>ストレスチェック後の医師による面接指導に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["面接指導は、医師に限らず保健師が行うこともできる。", "面接指導を行う医師は、対象労働者の勤務の状況、心理的な負担の状況、その他の心身の状況を確認する。", "事業者は、面接指導の結果に基づいて医師の意見を聴く必要はない。", "面接指導を行う医師は、精神科の専門医でなければならない。"], "answer": 1, "explanation": "<ul><li>①：誤り。面接指導は<strong>医師<\/strong>が行う。<\/li><li>③：誤り。事業者は、面接指導の結果に基づき、就業上の措置について医師の意見を聴かなければならない。<\/li><li>④：誤り。精神科医である必要はなく、事業場の状況を知る産業医などが行うことが望ましいとされる。<\/li><\/ul>", "example": "<p>高ストレス者として面接指導を申し出た社員に対し、産業医が勤務時間、仕事の負担、睡眠の状況などを確認した。産業医は「時間外労働を月20時間以内に制限し、1か月後に再面談」という意見を事業者に出した。<\/p>", "related": "<ul><li>一定の要件を満たせば、情報通信機器を用いたオンラインでの面接指導も認められている。<\/li><\/ul>"}, {"id": "5-9", "chapter": 5, "topic": "不利益な取扱いの禁止", "level": 2, "stem": "<p>ストレスチェック制度における不利益な取扱いの禁止に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["面接指導の申出をしたことを理由とする不利益な取扱いは禁止されている。", "医師の意見とその内容・程度が著しく異なる就業上の措置を講じることは、不利益な取扱いにあたる。", "結果を事業者に提供することに同意しないことを理由とする不利益な取扱いは禁止されている。", "医師の意見を勘案し、必要な範囲で時間外労働の制限などの就業上の措置を講じることも、不利益な取扱いにあたるため行ってはならない。"], "answer": 3, "explanation": "<ul><li>医師の意見を勘案し、必要な範囲で就業上の措置を講じることは、事業者に求められる対応であり、不利益な取扱いにはあたらない。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>面接指導の後、産業医の意見は「時間外労働の制限」だった。ところが上司が「それなら重要案件から外して降格する」と考えたため、人事が介入した。医師の意見の範囲を超える降格は不利益な取扱いにあたるとして、時間外労働の制限のみを行った。<\/p>", "related": "<ul><li>禁止される取扱いの例：解雇、有期契約の更新拒否（雇止め）、退職勧奨、不当な動機・目的による配置転換や職位の変更。<\/li><\/ul>"}, {"id": "5-10", "chapter": 5, "topic": "労働安全衛生マネジメントシステム", "level": 2, "stem": "<p>労働安全衛生マネジメントシステムに関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["労働安全衛生マネジメントシステムは、PDCAサイクルを一度回して完了する一過性の取組みである。", "ISO 45001は、メンタルヘルスケアに特化した国際規格である。", "心の健康づくり計画は、労働安全衛生マネジメントシステムの考え方を取り入れ、PDCAサイクルにより継続的に改善することが有効である。", "JIS Q 45100は、ISO 45001とは無関係に作られた海外の規格である。"], "answer": 2, "explanation": "<ul><li>①：誤り。PDCAサイクルを繰り返して継続的に改善する仕組みである。<\/li><li>②：誤り。ISO 45001は労働安全衛生マネジメントシステム全般の国際規格。<\/li><li>④：誤り。JIS Q 45100は、ISO 45001（JIS Q 45001）に、日本独自の安全衛生活動や健康確保の取組みなどを加えた国内規格。<\/li><\/ul>", "example": "<p>W社はISO 45001の認証取得にあわせて、メンタルヘルス対策を安全衛生目標の一つに位置づけた。毎年、ストレスチェックの集団分析結果と休業者数を内部監査で確認し、経営層による見直しで翌年度の計画を改めている。<\/p>", "related": "<ul><li>厚生労働省は「労働安全衛生マネジメントシステムに関する指針」を定めている。<\/li><\/ul>"}]}, {"num": 6, "title": "産業保健スタッフ等の活用による心の健康管理の推進", "questions": [{"id": "6-1", "chapter": 6, "topic": "職場復帰支援の手引き", "level": 1, "stem": "<p>厚生労働省「心の健康問題により休業した労働者の職場復帰支援の手引き」に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["職場復帰支援の流れの第1ステップは、「病気休業開始及び休業中のケア」である。", "主治医による職場復帰可能の判断は、必ずしも職場で求められる業務遂行能力まで回復しているかの判断とは限らないため、産業医等が精査したうえで採るべき対応を判断することが重要である。", "職場復帰にあたっては、原則として新しい環境（新しい職場）への配置転換や異動を行うことが望ましい。", "職場復帰後のフォローアップでは、症状の再燃・再発の有無の確認や、就業上の配慮の評価・見直しなどを行う。"], "answer": 2, "explanation": "<ul><li>手引きでは、原則として<strong>元の職場（休業前の職場）への復帰<\/strong>を考えるとしている。新しい環境への適応には負担がかかるため。ただし、異動等を誘因として発症した場合等は配置転換を考慮する。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>新規事業部への異動をきっかけに発症した社員の場合、元の職場（新規事業部）に戻すと再発のおそれがある。そのため例外的に、異動前に在籍していた部署への復帰を検討した。原則（元の職場）と例外の両方を押さえておく。<\/p>", "related": "<ul><li>5つのステップ<ol><li>病気休業開始及び休業中のケア<\/li><li>主治医による職場復帰可能の判断<\/li><li>職場復帰の可否の判断及び職場復帰支援プランの作成<\/li><li>最終的な職場復帰の決定<\/li><li>職場復帰後のフォローアップ<\/li><\/ol><\/li><li>職場復帰の可否は、労働者の意欲、通勤時間帯の一人での通勤、業務遂行に必要な集中力・生活リズムの回復などで判断する。<\/li><\/ul>"}, {"id": "6-2", "chapter": 6, "topic": "試し出勤制度", "level": 2, "stem": "<p>職場復帰支援における試し出勤制度等に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["試し出勤制度の導入は、労働基準法により事業者の義務とされている。", "試し出勤制度は、主治医による職場復帰可能の判断が出される前でなければ実施できない。", "試し出勤中に生じた災害は、その処遇の内容にかかわらず、労災保険の対象とはならない。", "社内制度として、模擬出勤、通勤訓練、試し出勤などを設けることが考えられる。"], "answer": 3, "explanation": "<ul><li>①：誤り。法令上の義務ではなく、社内制度として定めるもの。<\/li><li>②：誤り。そのような制限はない。<\/li><li>③：誤り。試し出勤中の処遇（賃金の有無、業務としての指揮命令の有無等）によっては労災保険の対象となりうるため、あらかじめ処遇や災害時の取扱いを明確にしておく必要がある。<\/li><li>④：正しい。手引きでは、模擬出勤（図書館等で過ごす）、通勤訓練（自宅から職場近くまで移動）、試し出勤（職場に試験的に一定期間出勤）が例示されている。<\/li><\/ul>", "example": "<p>N社では、休業中の社員がまず図書館で9時〜17時を過ごす模擬出勤を2週間、次に通勤時間帯に会社の最寄り駅まで行く通勤訓練を1週間行い、生活リズムを確認してから復職判定に進む。試し出勤の期間中は無給で業務の指示をしないことを、本人と書面で取り決めている。<\/p>", "related": "<ul><li>試し出勤中の作業について使用者が指示を与えたり、作業内容が業務（職務）に当たる場合などは、労働基準法等が適用される場合がある。<\/li><\/ul>"}, {"id": "6-3", "chapter": 6, "topic": "事業場外資源", "level": 2, "stem": "<p>事業場外資源に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["産業保健総合支援センターは、常時50人未満の事業場のみを支援対象としている。", "地域産業保健センター（地域窓口）は、主に常時50人未満の小規模事業場を対象に、長時間労働者に対する面接指導や健康相談などを無料で提供している。", "精神保健福祉センターは、すべての市町村に設置が義務づけられている。", "EAP（従業員支援プログラム）は、公的機関のみが提供するサービスである。"], "answer": 1, "explanation": "<ul><li>①：誤り。産業保健総合支援センター（さんぽセンター）は各都道府県に設置され、事業場の規模にかかわらず産業医・産業保健スタッフ・人事労務担当者等への研修や相談対応を行う。<\/li><li>③：誤り。精神保健福祉センターは<strong>都道府県・政令指定都市<\/strong>に設置される。<\/li><li>④：誤り。EAPは主に民間の専門機関が提供しており、事業場内に設置する内部EAPと外部EAPがある。<\/li><\/ul>", "example": "<p>従業員30人の運送会社には産業医がいないため、地域産業保健センターに依頼して、長時間労働のドライバーが無料で医師の面接指導を受けられるようにした。人事担当者は、産業保健総合支援センターのメンタルヘルス研修に参加した。<\/p>", "related": "<ul><li>その他の事業場外資源：保健所・保健センター、中央労働災害防止協会、医療機関（精神科・心療内科）、リワーク（復職支援）施設、地域障害者職業センター（リワーク支援）、こころの耳（働く人のメンタルヘルス・ポータルサイト）。<\/li><\/ul>"}, {"id": "6-4", "chapter": 6, "topic": "健康診断後の就業上の措置", "level": 2, "stem": "<p>「健康診断結果に基づき事業者が講ずべき措置に関する指針」に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["事業者は、医師等の意見を聴いた以上、その意見と異なる就業上の措置を講じることは一切許されない。", "事業者は、医師等からの意見聴取を、健康診断が行われた日から3か月以内に行う必要がある。", "就業上の措置を決定する場合には、あらかじめ当該労働者の意見を聴き、十分な話合いを通じてその労働者の了解が得られるよう努めることが適当である。", "医師等の意見における就業区分は、「通常勤務」「就業制限」「要休業」に区分される。"], "answer": 0, "explanation": "<ul><li>就業上の措置の最終的な決定は事業者が行う。医師等の意見を勘案し、必要があると認めるときに措置を講じる。意見と異なる措置をとる場合は、その理由を医師等や労働者に説明することが望ましい。<\/li><li>②③④：いずれも正しい。<\/li><\/ul>", "example": "<p>健康診断の後、産業医が「高血圧のため夜勤は禁止」と意見した。本人と話し合ったところ、本人は夜勤手当の減少を心配していたため、夜勤を月2回に減らし、1か月後に血圧を再検査することを条件とする措置にした。最終判断は事業者が行い、その理由を産業医と本人に説明した。<\/p>", "related": "<ul><li>「就業制限」の例：労働時間の短縮、出張の制限、時間外労働の制限、作業の転換、深夜業の回数の減少など。<\/li><li>措置を講じたときは、衛生委員会等への報告や、管理監督者の理解と協力が重要。<\/li><\/ul>"}, {"id": "6-5", "chapter": 6, "topic": "主治医との連携", "level": 1, "stem": "<p>主治医との連携に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["主治医が作成した診断書の病名は、職場の理解を得るため、本人の同意がなくても職場全体に周知してよい。", "主治医が「職場復帰可能」とした診断書は、産業医の意見よりも常に優先される。", "主治医への照会は産業医のみが行うことができ、人事労務担当者は職場復帰支援に関与してはならない。", "主治医への情報提供や照会にあたっては、原則として、事前に労働者本人の同意を得る必要がある。"], "answer": 3, "explanation": "<ul><li>①：誤り。病名は要配慮個人情報であり、本人同意なく周知することはできない。必要な情報は就業上の配慮事項に加工して伝える。<\/li><li>②：誤り。主治医は職場の業務内容を把握していないことが多く、診断書は本人の希望が反映されやすい面もある。産業医等が業務遂行能力の観点から精査し、最終的には事業者が判断する。<\/li><li>③：誤り。人事労務担当者は職場復帰支援プランの作成や就業上の配慮の調整に関与する重要な立場にある。<\/li><\/ul>", "example": "<p>主治医の診断書には「復職可」とだけあったが、職場はシフト制の窓口業務だった。人事は本人の同意を得て、勤務時間帯や業務内容を書いた情報提供書を主治医に送り、「当面は日勤のみであれば可」という具体的な意見を得た。<\/p>", "related": "<ul><li>手引きには、主治医への「職場復帰支援に関する情報提供依頼書」の様式例がある。<\/li><li>職場の業務内容や求められる業務遂行能力を主治医に伝えることで、より実態に即した意見が得られる。<\/li><\/ul>"}, {"id": "6-6", "chapter": 6, "topic": "産業医の職務", "level": 1, "stem": "<p>労働安全衛生規則に定める産業医の職務に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["健康診断の実施と、その結果に基づく労働者の健康を保持するための措置に関すること", "長時間労働者やストレスチェックの高ストレス者に対する面接指導に関すること", "健康教育、健康相談その他労働者の健康の保持増進を図るための措置に関すること", "労働者の解雇や懲戒処分の可否を決定すること"], "answer": 3, "explanation": "<ul><li>産業医は、医学的な見地から就業上の措置などについて意見を述べる立場にあり、解雇や懲戒処分を決定する権限はない。人事上の判断は事業者が行う。<\/li><li>①②③：いずれも産業医の職務に含まれる。<\/li><\/ul>", "example": "<p>人事部長が産業医に「休職を繰り返す社員を解雇してよいか判断してほしい」と依頼した。産業医は、医学的見地から就業の可否と必要な配慮について意見を述べ、解雇の判断は会社の責任で行うものだと説明した。<\/p>", "related": "<ul><li>産業医が辞任したときや解任されたときは、事業者はその旨と理由を衛生委員会に報告しなければならない。<\/li><\/ul>"}, {"id": "6-7", "chapter": 6, "topic": "産業保健スタッフ", "level": 2, "stem": "<p>事業場内産業保健スタッフ等に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["公認心理師は、医療機関の中でのみ業務を行うことができ、事業場で相談対応を行うことはできない。", "保健師は、保健指導や健康相談を通じて労働者のセルフケアを支援し、管理監督者との連携を担うことができる。", "心の健康づくり専門スタッフは、すべての事業場で配置が法律上義務づけられている。", "精神保健福祉士は、精神疾患の診断と薬物療法を行う。"], "answer": 1, "explanation": "<ul><li>①：誤り。公認心理師は、医療機関以外の職場などでも相談業務を行うことができる（主治医がいる場合はその指示を受ける）。<\/li><li>③：誤り。法律上の配置義務はなく、必要に応じて確保・活用する。<\/li><li>④：誤り。診断と薬物療法は医師が行う。<\/li><\/ul>", "example": "<p>X社では、常勤の保健師が、高ストレス者や長時間労働者への保健指導、休業者との定期的な連絡、管理職からの相談対応を担当し、必要に応じて嘱託産業医や外部の精神科医につないでいる。<\/p>", "related": "<ul><li>心の健康づくり専門スタッフの例：精神科・心療内科等の医師、精神保健福祉士、心理職。<\/li><li>公認心理師は、2017年に施行された公認心理師法による国家資格。<\/li><\/ul>"}, {"id": "6-8", "chapter": 6, "topic": "休業中のケア", "level": 2, "stem": "<p>心の健康問題で休業している労働者へのケアに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["療養を妨げないよう、休業期間中は会社から一切の連絡をしてはならない。", "休業開始時には、傷病手当金などの経済的な保障、相談窓口、休業の最長期間などについて情報を提供する。", "休業中の連絡は、窓口を一本化し、頻度や方法をあらかじめ本人と決めておくとよい。", "休業中に本人が不安を感じている場合には、事業場内外の相談先を紹介することが望ましい。"], "answer": 0, "explanation": "<ul><li>職場復帰支援の手引きでは、休業中も必要な情報を提供し、本人が安心して療養できるようにすることが重要とされている。連絡を一切しないと、本人の不安や孤立感を強めるおそれがある。<\/li><li>②③④：いずれも正しい。<\/li><\/ul>", "example": "<p>Y社では、休業開始時に人事担当者が「休業中の過ごし方と手続き」の資料を渡し、傷病手当金の申請方法、休職期間の上限、相談窓口を説明した。連絡は月1回、保健師からメールで行うことを本人と取り決めた。<\/p>", "related": "<ul><li>本人の同意を得て、家族と連絡をとり協力を得ることも有用である。<\/li><\/ul>"}, {"id": "6-9", "chapter": 6, "topic": "職場復帰後のフォローアップ", "level": 2, "stem": "<p>職場復帰後のフォローアップに関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["職場復帰後は、休業前と同じ業務量を直ちに担当させることが、早期の回復につながる。", "復職後に症状の再燃がみられても、一度決めた就業上の配慮は変更してはならない。", "職場復帰支援プランの実施状況は、管理監督者や産業保健スタッフ等が定期的に確認し、必要に応じて見直す。", "職場復帰後のフォローアップは上司のみが行うものであり、同僚への配慮は不要である。"], "answer": 2, "explanation": "<ul><li>①：誤り。業務量は段階的に戻していくのが原則。<\/li><li>②：誤り。症状や業務への適応状況に応じて、就業上の配慮を見直す。<\/li><li>④：誤り。手引きでは、復帰者を受け入れる管理監督者や同僚への過度な負担がかからないよう配慮することも求めている。<\/li><\/ul>", "example": "<p>復職した社員の職場復帰支援プランでは、1か月目は短時間勤務と残業禁止、2か月目からフルタイム、3か月目から出張を再開すると段階を設けた。2週間ごとに上司と保健師が面談し、睡眠の状況や業務の負荷を確認して計画を調整した。<\/p>", "related": "<ul><li>フォローアップで確認する事項：症状の再燃・再発の有無、勤務状況と業務遂行能力、職場復帰支援プランの実施状況、治療状況、職場環境の改善状況など。<\/li><\/ul>"}, {"id": "6-10", "chapter": 6, "topic": "リワークプログラム", "level": 2, "stem": "<p>リワーク（復職支援）プログラムに関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["精神科医療機関などで行われるリワークプログラムでは、通勤を想定した生活リズムの確立、作業課題、集団でのプログラムなどを通じて復職の準備を行う。", "地域障害者職業センターのリワーク支援は、障害者手帳を持つ人でなければ利用できない。", "リワークプログラムでは、休業に至った経緯を振り返り、再発を防ぐ方法を考える取組みが行われることが多い。", "リワークの利用状況や評価は、本人の同意を得て、職場復帰の可否の判断材料の一つとすることができる。"], "answer": 1, "explanation": "<ul><li>地域障害者職業センターのリワーク支援は、うつ病などで休職している人を対象としており、障害者手帳の所持は要件とされていない。休職者本人だけでなく事業主も支援の対象となる。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>休業中の社員が、主治医の勧めで医療機関のリワークに週4日通い、決まった時刻の通所、パソコン作業、グループワークを3か月続けた。本人の同意を得て提出されたリワークのスタッフの評価書は、産業医の復職判定で参考にされた。<\/p>", "related": "<ul><li>主な実施機関：医療機関（医療リワーク）、地域障害者職業センター（職リハリワーク）、就労移行支援事業所など。<\/li><\/ul>"}]}, {"num": 7, "title": "相談体制の確立", "questions": [{"id": "7-1", "chapter": 7, "topic": "自殺のリスクがある相談者への対応", "level": 1, "stem": "<p>自殺のリスクがある労働者への対応に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["自殺念慮を打ち明けられた場合、話題を避けずに率直に尋ねることがリスクの評価に有用である。", "「死にたい」と口にする人は実際には自殺しないことが多いため、深刻に受け止める必要はない。", "過去の自殺未遂歴は、自殺の重要な危険因子である。", "「誰にも言わないでほしい」と求められた場合でも、生命に危険が及ぶおそれがあるときは、安全の確保を優先して関係者と連携する。"], "answer": 1, "explanation": "<ul><li>自殺の意図を口にすることは重要なサインであり、真剣に受け止めて対応する必要がある。「死にたいと言う人は死なない」は代表的な誤解。<\/li><li>①③④：いずれも正しい。<\/li><\/ul>", "example": "<p>社員が面談で「もう消えてしまいたい」と口にした。担当者は「そう思うほどつらいのですね。具体的に考えたことはありますか」と率直に尋ねた。本人の了解を得て産業医と家族に連絡し、その日のうちに精神科の受診につないだ。<\/p>", "related": "<ul><li>自殺の危険因子：自殺未遂歴、精神疾患（特にうつ病）、アルコール・薬物乱用、喪失体験、孤立、身体疾患、事故傾性など。<\/li><li>対応の原則として「TALKの原則」（Tell：言葉に出して心配していることを伝える、Ask：死にたい気持ちについて率直に尋ねる、Listen：絶望的な気持ちを傾聴する、Keep safe：安全を確保する）がある。<\/li><\/ul>"}, {"id": "7-2", "chapter": 7, "topic": "自殺対策とゲートキーパー", "level": 2, "stem": "<p>自殺対策に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["職場で自殺が発生した場合の事後対応（ポストベンション）では、遺された同僚への心理的影響は考慮する必要はない。", "自殺対策基本法には、事業主の責務に関する規定は置かれていない。", "ゲートキーパーの役割として、「気づき」「声かけ」「傾聴」「つなぎ」「見守り」が挙げられる。", "飲酒は不安や抑うつを和らげるため、自殺の危険性を低下させる要因である。"], "answer": 2, "explanation": "<ul><li>①：誤り。遺された同僚や家族は強い心理的影響を受けるため、ケアが必要である（群発自殺の防止の観点も重要）。<\/li><li>②：誤り。自殺対策基本法では、事業主は国・地方公共団体の自殺対策に協力するとともに、雇用する労働者の心の健康の保持を図るため必要な措置を講ずるよう努めるものとされている。<\/li><li>④：誤り。アルコールは衝動性を高め、自殺の危険因子である。<\/li><\/ul>", "example": "<p>同僚の飲酒量が増え、口数が減ったことに気づき（気づき）、「最近元気がないけど大丈夫？」と声をかけた（声かけ）。じっくり話を聴き（傾聴）、保健師への相談を勧めて（つなぎ）、その後も様子を気にかけた（見守り）。ゲートキーパーの5つの役割の流れである。<\/p>", "related": "<ul><li>自殺対策基本法は2006年制定、2016年改正で都道府県・市町村に自殺対策計画の策定が義務づけられた。<\/li><li>自殺総合対策大綱は、おおむね5年を目途に見直される。<\/li><\/ul>"}, {"id": "7-3", "chapter": 7, "topic": "相談体制の整備", "level": 1, "stem": "<p>事業場における相談体制の整備に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["相談窓口は、事業場内と事業場外の複数を設け、労働者が選択できるようにすることが望ましい。", "相談窓口を設けた場合は、その存在や利用方法、プライバシーの保護について労働者に周知することが重要である。", "相談記録は相談担当者が適切に管理し、本人の同意なく人事評価に利用してはならない。", "相談件数が少ない相談窓口は、労働者のニーズがないと判断されるため、速やかに廃止すべきである。"], "answer": 3, "explanation": "<ul><li>相談件数が少ない背景には、周知不足、プライバシーへの不安、窓口へのアクセスのしにくさ等が考えられる。原因を分析して改善を図るべきであり、件数の少なさだけで廃止すべきではない。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>O社では社内の相談窓口の利用が年2件だった。アンケートで「人事に知られるのが不安」という声が多かったため、外部EAPの電話・オンライン相談を追加し、匿名で利用できることを給与明細と社内ポータルで周知した。その結果、利用が増えた。<\/p>", "related": "<ul><li>相談窓口の利用しやすさは、匿名性、受付時間、相談方法（電話・メール・SNS・対面）などによって大きく変わる。<\/li><li>家族からの相談にも対応できる体制が望ましい。<\/li><\/ul>"}, {"id": "7-4", "chapter": 7, "topic": "管理監督者による「いつもと違う」部下への対応", "level": 2, "stem": "<p>管理監督者による部下のメンタルヘルス不調への対応に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["遅刻・早退・欠勤の増加、ミスの増加、表情や言動の変化など「いつもと違う」様子は、ラインによるケアにおいて部下の不調に気づく重要な手がかりとなる。", "管理監督者は、部下に精神疾患の疑いがある場合、自ら病名を判断して本人に伝えるべきである。", "部下が医療機関の受診を拒否した場合は、業務命令によって直ちに精神科病院に入院させる手続きをとるべきである。", "家族への連絡は、いかなる状況であっても本人の同意がなければ行ってはならない。"], "answer": 0, "explanation": "<ul><li>②：誤り。診断は医師が行うもの。管理監督者は「いつもと違う」事実を伝え、産業保健スタッフ等への相談や受診を勧める役割を担う。<\/li><li>③：誤り。入院は精神保健福祉法の手続きによる医療上の判断であり、業務命令で行えるものではない。<\/li><li>④：誤り。原則は本人の同意を得るが、自傷のおそれなど生命・身体の保護のために必要な場合は、同意なく家族に連絡することも許容される。<\/li><\/ul>", "example": "<p>いつも締切を守る部下が3回続けて提出を遅らせ、昼食も一人でとるようになった。課長は「最近いつもと様子が違うようで心配している」と事実を伝えて、産業医との面談を勧めた。病名を推測して口にすることはしなかった。<\/p>", "related": "<ul><li>「いつもと違う」は、部下の普段の様子を把握していて初めて気づけるもの。日頃のコミュニケーションが前提となる。<\/li><\/ul>"}, {"id": "7-5", "chapter": 7, "topic": "精神保健福祉法の入院形態", "level": 3, "stem": "<p>精神保健福祉法に定める入院形態に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["任意入院は、本人の同意に基づいて行われる入院である。", "医療保護入院は、精神保健指定医の診察の結果、医療及び保護のため入院の必要がある者で任意入院が行われる状態にないと判定された場合に、家族等のうちいずれかの者の同意により行われる。", "本人が勤務する会社の人事部長が同意すれば、家族等の同意がなくても医療保護入院を行うことができる。", "措置入院は、2名以上の精神保健指定医の診察の結果、自傷他害のおそれがあると一致した場合に、都道府県知事の決定により行われる。"], "answer": 2, "explanation": "<ul><li>医療保護入院の同意者は「家族等」（配偶者、親権者、扶養義務者、後見人・保佐人）であり、勤務先の上司や人事担当者は含まれない。家族等がいない場合等は市町村長が同意者となる。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>社員が職場で激しい興奮状態になり、家族と連絡がつかない場合でも、上司や人事部長が医療保護入院に同意することはできない。会社としては、救急要請や保健所への相談を行い、家族への連絡を続けることになる。<\/p>", "related": "<ul><li>緊急措置入院：指定医1名の診察で72時間に限り入院させることができる。<\/li><li>応急入院：家族等の同意が得られない場合に、指定医の診察により72時間に限り入院させることができる。<\/li><li>2022年改正（2024年施行）で、医療保護入院の入院期間の上限設定や、家族等が意思表示をしない場合の市町村長同意などが規定された。<\/li><\/ul>"}, {"id": "7-6", "chapter": 7, "topic": "相談内容の取扱い", "level": 2, "stem": "<p>相談対応における情報の取扱いに関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["相談で知り得た情報は、どのような場合でも、本人以外の誰にも伝えてはならない。", "相談内容は、相談者の上司と速やかに共有することが原則である。", "相談内容を関係者と共有する必要がある場合は、原則として、誰にどこまで伝えるかについて本人の同意を得る。", "相談記録は、人事評価の資料として活用するため、人事部門で一括して保管する。"], "answer": 2, "explanation": "<ul><li>①：誤り。生命や身体に危険が及ぶおそれがある場合などは、本人の同意がなくても関係者と連携することが許される。<\/li><li>②：誤り。上司と共有するかどうかは、原則として本人の同意を得て決める。<\/li><li>④：誤り。相談記録は相談担当者が適切に管理し、人事評価に用いてはならない。<\/li><\/ul>", "example": "<p>上司との関係に悩む社員から相談を受けた保健師は、「業務量の調整を頼むために、忙しさについてだけ上司に伝えてもよいですか」と本人に確認した。同意を得た範囲だけを、人事を通じて上司に伝えた。<\/p>", "related": "<ul><li>ストレスチェックや面接指導の実施の事務に従事した者には、労働安全衛生法上の守秘義務がある。医師や保健師などには、それぞれの法律でも守秘義務が定められている。<\/li><\/ul>"}, {"id": "7-7", "chapter": 7, "topic": "家族からの相談", "level": 1, "stem": "<p>労働者の家族からの相談と家族との連携に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["家族は、睡眠や食欲、飲酒の変化など、職場では見えにくい不調のサインに気づきやすい立場にある。", "事業場の相談窓口を家族も利用できるようにしておくことは有用である。", "家族から相談を受けた場合でも、労働者本人の健康情報を家族に伝えるには、原則として本人の同意を得る。", "家族からの相談は職場の問題ではないため、会社として対応する必要はまったくない。"], "answer": 3, "explanation": "<ul><li>家族からの相談は、不調の早期発見や受診につなげる重要なきっかけとなる。会社としても適切に対応することが望ましい。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>社員の妻から「夫が最近眠れず、休日も横になったままで心配だ」と会社の相談窓口に電話があった。保健師は話を聴いたうえで本人に受診を勧める方法を助言し、本人の同意を得てから産業医との面談を設定した。<\/p>", "related": "<ul><li>休業中や職場復帰の場面でも、本人の同意を得て家族と連携することが有用である。<\/li><\/ul>"}, {"id": "7-8", "chapter": 7, "topic": "惨事ストレスへの対応", "level": 2, "stem": "<p>職場で重大な事故などが起きた後の心のケアに関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["事故の直後には、すべての従業員に事故の詳細を語らせる集団面接（心理的デブリーフィング）を強制的に行うことが推奨されている。", "サイコロジカル・ファーストエイド（PFA）では、安全の確保、ニーズの把握、話を聴くこと、必要な支援へのつなぎなどを行う。", "事故の直後に不眠や動揺が生じた場合は、すべて心的外傷後ストレス障害（PTSD）と診断される。", "惨事ストレスは被害に遭った本人のみに生じ、救援活動を行った同僚には生じない。"], "answer": 1, "explanation": "<ul><li>①：誤り。体験を詳しく語らせる心理的デブリーフィングを一律に行うことは、効果が乏しく、かえって悪化させるおそれがあるとして推奨されていない。<\/li><li>③：誤り。惨事の直後の不眠や動揺は自然な反応で、多くは時間とともに回復する。PTSDは症状が1か月以上続く場合などに診断される。<\/li><li>④：誤り。目撃者や救援活動にあたった同僚にも惨事ストレスは生じうる。<\/li><\/ul>", "example": "<p>工場で重大な事故が起きた翌日、会社は産業医と保健師を現場に派遣した。目撃した従業員に声をかけて休息と相談先を案内したが、詳しく語ることは強制しなかった。不眠などが続く人には、医療機関の受診を勧めた。<\/p>", "related": "<ul><li>WHO版のPFAでは、活動の原則を「見る・聞く・つなぐ」としている。<\/li><\/ul>"}, {"id": "7-9", "chapter": 7, "topic": "ハラスメント相談の事実確認", "level": 2, "stem": "<p>ハラスメントの相談を受けた後の対応に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["事実関係の確認は相談者からの聴取だけで行い、行為者とされる者からは話を聞かないのが原則である。", "相談者と行為者の主張が一致しない場合は、必要に応じて第三者からも事実関係を聴取する。", "事実確認の結果ハラスメントが確認された場合は、被害者への配慮のための措置と、行為者に対する措置を適正に行う。", "相談者や事実確認に協力した者のプライバシーを保護し、不利益な取扱いを行わないことを周知する。"], "answer": 0, "explanation": "<ul><li>パワハラ防止指針では、相談者と行為者の<strong>双方<\/strong>から事実関係を確認し、主張に不一致がある場合は第三者からも聴取するとされている。<\/li><li>②③④：いずれも正しい。<\/li><\/ul>", "example": "<p>部長からの暴言について相談を受けた人事は、相談者から日時と内容を聴き取り、本人の了解を得て部長からも話を聴いた。主張が食い違ったため、その場に居合わせた社員2名からも聴取し、暴言を確認した。会社は部長を懲戒処分とし、相談者の席を部長から離れた場所に移した。<\/p>", "related": "<ul><li>事実が確認できなかった場合も、方針の再周知や研修などの再発防止策を講じる。<\/li><\/ul>"}, {"id": "7-10", "chapter": 7, "topic": "自殺の危険が高まる時期", "level": 3, "stem": "<p>自殺の危険性の評価に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["うつ病による自殺の危険は症状が最も重い時期に限られ、回復期には低下する。", "自殺の危険因子が複数あっても、本人が否定すれば危険性は低いと判断してよい。", "異動や昇進などの職場の出来事は、自殺の危険因子とはならない。", "うつ病では、治療開始直後や回復期など、気力がある程度戻ってきた時期にも自殺の危険が高まることがあるため注意が必要である。"], "answer": 3, "explanation": "<ul><li>①：誤り。④のとおり、回復期にも注意が必要。<\/li><li>②：誤り。本人が否定しても、危険因子が重なっている場合は慎重に対応する。<\/li><li>③：誤り。異動や昇進などの環境の変化も危険因子となりうる。<\/li><\/ul>", "example": "<p>休業中のうつ病の社員が、復職を目前にして「職場に戻れる自信がない」と話すようになった。気力が戻りかけた回復期にも自殺の危険が高まるため、保健師は主治医と連携して見守りを強めた。<\/p>", "related": "<ul><li>自殺の背景には、うつ病などの精神疾患が存在することが多い。<\/li><li>職場の要因としては、長時間労働、配置転換、昇進、ハラスメントなどがある。<\/li><\/ul>"}]}, {"num": 8, "title": "教育研修", "questions": [{"id": "8-1", "chapter": 8, "topic": "管理監督者への教育研修", "level": 1, "stem": "<p>メンタルヘルス指針において、管理監督者への教育研修・情報提供の項目として示されて<strong>いないもの<\/strong>を一つ選べ。<\/p>", "choices": ["管理監督者の役割及び心の健康問題に対する正しい態度", "職場環境等の評価及び改善の方法", "心の健康問題により休業した者の職場復帰への支援の方法", "精神疾患の診断基準に基づき部下を診断する方法"], "answer": 3, "explanation": "<p>指針が示す管理監督者向けの項目は次のとおり（診断の方法は含まれない）。<\/p>\n<ul><li>メンタルヘルスケアに関する事業場の方針<\/li><li>職場でメンタルヘルスケアを行う意義<\/li><li>ストレス及びメンタルヘルスケアに関する基礎知識<\/li><li>管理監督者の役割及び心の健康問題に対する正しい態度<\/li><li>職場環境等の評価及び改善の方法<\/li><li>労働者からの相談対応（話の聴き方、情報提供及び助言の方法等）<\/li><li>心の健康問題により休業した者の職場復帰への支援の方法<\/li><li>事業場内産業保健スタッフ等との連携及びこれを通じた事業場外資源との連携の方法<\/li><li>セルフケアの方法<\/li><li>事業場内の相談先及び事業場外資源に関する情報<\/li><li>健康情報を含む労働者の個人情報の保護等<\/li><\/ul>", "example": "<p>P社の新任管理職研修（3時間）では、会社の方針、ストレスの基礎知識、「いつもと違う」部下への気づき方、傾聴のロールプレイ、産業医への相談ルートと職場復帰支援の流れを扱った。診断は医師の役割であることも明確に伝えた。<\/p>", "related": "<ul><li>管理監督者自身もストレスを抱えやすい立場にあるため、セルフケアの方法も教育項目に含まれている。<\/li><\/ul>"}, {"id": "8-2", "chapter": 8, "topic": "研修効果の評価", "level": 2, "stem": "<p>教育研修の効果評価に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["講義形式の研修は、ロールプレイやグループ討議などの参加型研修よりも、常に行動変容の効果が高い。", "Kirkpatrickの4段階評価モデルでは、レベル1「反応」、レベル2「学習」、レベル3「行動」、レベル4「結果」の4段階で研修の効果を評価する。", "研修の効果は、研修直後の満足度アンケートによって評価すれば十分である。", "管理監督者向けの研修は、管理監督者に就任した時に1回実施すれば、その後の継続的な実施は不要である。"], "answer": 1, "explanation": "<ul><li>①：誤り。知識の習得には講義形式が効率的だが、相談対応スキルなどの行動変容にはロールプレイ等の参加型が有効とされる。目的に応じて組み合わせることが重要。<\/li><li>③：誤り。満足度（レベル1）だけでなく、知識の理解度、職場での行動の変化、組織への成果まで評価することが望ましい。<\/li><li>④：誤り。継続的・定期的なフォローアップ研修が望ましい。<\/li><\/ul>", "example": "<p>傾聴研修の評価の例：レベル1＝研修直後のアンケートでの満足度、レベル2＝理解度テストの点数、レベル3＝3か月後に部下との定期面談を実施しているか、レベル4＝翌年のストレスチェックで「上司の支援」の得点が上がったか。<\/p>", "related": "<ul><li>研修の企画：目的・対象・内容・方法・講師・時期・評価方法を事前に設計する。<\/li><\/ul>"}, {"id": "8-3", "chapter": 8, "topic": "セルフケアに関する教育研修", "level": 1, "stem": "<p>メンタルヘルス指針における労働者へのセルフケアの教育研修に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["ストレスへの対処は自己責任であり、相談は他の手段がすべて尽きたときの最終手段であることを教育する。", "ストレスへの気づき方、ストレスの予防・軽減及びストレスへの対処の方法を教育する。", "自発的な相談の有用性や、事業場内の相談先及び事業場外資源に関する情報を提供する。", "ストレス及びメンタルヘルスケアに関する基礎知識を教育する。"], "answer": 0, "explanation": "<ul><li>指針はセルフケアの教育項目として「<strong>自発的な相談の有用性<\/strong>」を挙げており、早めの相談を促すことが重要。自己責任を強調すると相談をためらわせ、問題の深刻化につながる。<\/li><li>②③④：いずれも指針の項目。<\/li><\/ul>", "example": "<p>Q社の新入社員研修では、ストレスチェック結果の見方、睡眠や運動などのセルフケア、「早めの相談は弱さではない」ことを伝え、社内外の相談先を載せた名刺大のカードを配った。<\/p>", "related": "<ul><li>セルフケアの項目：事業場の方針、ストレス及びメンタルヘルスケアの基礎知識、セルフケアの重要性及び心の健康問題に対する正しい態度、ストレスへの気づき方、ストレスの予防・軽減・対処の方法、自発的な相談の有用性、事業場内の相談先及び事業場外資源に関する情報。<\/li><\/ul>"}, {"id": "8-4", "chapter": 8, "topic": "教育研修の企画", "level": 2, "stem": "<p>事業場における教育研修の企画に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["新たに管理監督者に昇任した者に対しては、昇任時に研修を実施することが効果的である。", "研修ニーズは、ストレスチェックの集団分析結果や休業者の発生状況などから把握することができる。", "人事労務管理スタッフは、教育研修を企画・実施する立場にあるため、自らが教育研修の対象となることはない。", "事業場内産業保健スタッフ等に対しても、職務に応じた専門的な事項を含む教育研修・知識修得等の機会の提供が必要である。"], "answer": 2, "explanation": "<ul><li>指針は、人事労務管理スタッフを含む事業場内産業保健スタッフ等に対しても教育研修・知識修得等の機会を提供するよう求めている。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>R社では、集団分析で「上司の支援」の得点が低い部署が多かったため、翌年度は管理職向けの傾聴研修を優先して実施した。研修を企画する人事スタッフ自身も、産業保健総合支援センターの研修を受講した。<\/p>", "related": "<ul><li>教育研修の対象は、「労働者」「管理監督者」「事業場内産業保健スタッフ等」の3層で整理される。<\/li><li>事業場内に講師がいない場合は、産業保健総合支援センターや外部機関の活用も考えられる。<\/li><\/ul>"}, {"id": "8-5", "chapter": 8, "topic": "リラクセーション技法", "level": 2, "stem": "<p>ストレス対処法に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["漸進的筋弛緩法は、Jacobsonにより考案されたもので、筋肉を最大限に緊張させた状態を持続させることを目的とする。", "自律訓練法は、Schultzにより体系化されたもので、四肢の重感・温感などの公式（言語暗示）を段階的に練習する。", "認知行動療法は、主に過去の生育歴の解釈を中心として、無意識の葛藤を明らかにすることを目的とする。", "呼吸法では、胸式呼吸で速く浅い呼吸を繰り返すことが、リラクセーションに効果的である。"], "answer": 1, "explanation": "<ul><li>①：誤り。漸進的筋弛緩法は、筋肉を意図的に緊張させた後に<strong>一気に弛緩<\/strong>させ、その感覚の違いを体験することで緊張を緩める方法。<\/li><li>③：誤り。説明は精神分析的アプローチ。認知行動療法は、現在の問題に焦点を当て、認知（考え方の癖）と行動に働きかける。<\/li><li>④：誤り。腹式呼吸でゆっくりと深く呼吸する（特に呼気を長くする）ことが効果的。<\/li><\/ul>", "example": "<p>プレゼンの前に緊張しやすい社員が、両手を5秒間ぐっと握ってから一気に力を抜く（漸進的筋弛緩法）ことと、4秒で吸って6〜8秒かけて吐く腹式呼吸を続けたところ、手の震えが落ち着いた。<\/p>", "related": "<ul><li>自律訓練法の標準練習：背景公式（気持ちが落ち着いている）＋第1公式（重感）〜第6公式（額の涼感）。終了時には消去動作を行う。<\/li><li>マインドフルネス、ソーシャルサポートの活用、睡眠・運動・食事などの生活習慣の改善もセルフケアの要素。<\/li><\/ul>"}, {"id": "8-6", "chapter": 8, "topic": "研修の手法", "level": 1, "stem": "<p>教育研修の手法に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["ロールプレイは、相談対応などの場面を演じることで、傾聴などのスキルを体験的に身につけることができる。", "ケーススタディは、正解が一つに決まっている問題を暗記するための手法である。", "グループ討議は、参加者同士の意見交換が起こりにくいため、職場の課題の共有には向かない。", "講義形式は、知識を体系的に伝えることには適さないため、教育研修では用いるべきではない。"], "answer": 0, "explanation": "<ul><li>②：誤り。ケーススタディは、事例をもとに問題点や対応策を考える手法で、必ずしも正解は一つではない。<\/li><li>③：誤り。グループ討議は、参加者同士の意見交換を通じて職場の課題を共有するのに適している。<\/li><li>④：誤り。講義形式は知識を体系的に伝えるのに適しており、他の手法と組み合わせて用いる。<\/li><\/ul>", "example": "<p>管理職研修で、「最近遅刻が増えた部下との面談」の場面を3人1組（上司役・部下役・観察役）で演じた。観察役からのフィードバックで、すぐに助言してしまう自分の癖に気づいた受講者が多かった。<\/p>", "related": "<ul><li>講義で知識を伝え、ケーススタディで考え、ロールプレイで練習するという組合せが効果的。<\/li><\/ul>"}, {"id": "8-7", "chapter": 8, "topic": "eラーニングと情報提供", "level": 1, "stem": "<p>eラーニングや情報提供に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["厚生労働省のポータルサイト「こころの耳」では、セルフケアや職場のメンタルヘルス対策に関する情報やeラーニングが提供されている。", "eラーニングは、時間や場所を選ばずに受講できるため、交替勤務や事業場が分散している職場でも活用しやすい。", "eラーニングは体験型の学習と組み合わせる必要はなく、すべての研修をeラーニングに置き換えるのが最も効果的である。", "受講状況や理解度テストの結果を記録・集計できることは、eラーニングの利点の一つである。"], "answer": 2, "explanation": "<ul><li>傾聴などのスキルの習得には、ロールプレイなどの体験型の学習が有効であり、目的に応じてeラーニングと組み合わせることが望ましい。<\/li><li>①②④：いずれも正しい。<\/li><\/ul>", "example": "<p>全国に営業所が点在するA社では、セルフケア研修をeラーニングで実施して全社員の受講状況を管理した。一方、管理職の傾聴研修は、オンラインのグループワークでロールプレイを行った。<\/p>", "related": "<ul><li>「こころの耳」では、電話・SNS・メールによる相談窓口も案内されている。<\/li><\/ul>"}, {"id": "8-8", "chapter": 8, "topic": "管理監督者研修の効果", "level": 2, "stem": "<p>管理監督者に対する教育研修に関する次の記述のうち、<strong>最も不適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["管理監督者への教育研修は、管理監督者の知識や態度を改善し、部下の心理的ストレス反応の低減に効果があると報告されている。", "研修の効果を持続させるために、一定期間後にフォローアップ研修を行うことが望ましい。", "部下からの相談対応について、実際の場面を想定した演習を取り入れると効果的である。", "管理監督者研修は、メンタルヘルス不調の部下がいる管理監督者だけが受講すればよい。"], "answer": 3, "explanation": "<ul><li>管理監督者研修は、一次予防（職場環境改善）や早期対応のためのものであり、すべての管理監督者が受講することが望ましい。<\/li><li>①②③：いずれも正しい。<\/li><\/ul>", "example": "<p>B社では、管理職研修を受けた部署で、翌年のストレスチェックの「上司の支援」の得点が上がり、部下が早めに相談するケースが増えた。半年後には、相談事例を持ち寄るフォローアップ研修を実施した。<\/p>", "related": "<ul><li>教育研修を職場環境改善の取組みと組み合わせると、より効果が高まる。<\/li><\/ul>"}, {"id": "8-9", "chapter": 8, "topic": "成人学習の考え方", "level": 2, "stem": "<p>成人を対象とした教育研修の考え方に関する次の記述のうち、<strong>最も適切なもの<\/strong>を一つ選べ。<\/p>", "choices": ["成人の学習では、学習者の経験は学習の妨げになるため、できるだけ考慮しないほうがよい。", "成人の学習者は、自分の仕事や生活の課題に役立つ、問題解決型の内容に対して学習意欲が高まりやすい。", "Knowlesのアンドラゴジーでは、学習者が教師に依存的であることが前提とされている。", "成人向けの研修では、受講者の主体的な参加を促す工夫は不要である。"], "answer": 1, "explanation": "<ul><li>①：誤り。成人学習では、学習者の経験は重要な学習資源とされる。<\/li><li>③：誤り。アンドラゴジーでは、成人は<strong>自己主導的<\/strong>な学習者であることが前提とされる。<\/li><li>④：誤り。主体的な参加を促すことが、学習効果を高める。<\/li><\/ul>", "example": "<p>C社の管理職研修では、講師が理論を説明する前に、受
