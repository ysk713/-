<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界医療情報マップ</title>
  <meta name="description" content="地球儀の国をクリックすると、その国の医療・感染症ニュースと動画が見られます。病名を選ぶと報道ベースの分布も表示。毎朝自動更新。">
  <!-- SNS で共有したときのカード表示 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="世界医療情報マップ">
  <meta property="og:title" content="世界医療情報マップ">
  <meta property="og:description" content="地球儀の国をクリックすると、その国の医療・感染症ニュースと動画が見られます。病名を選ぶと報道ベースの分布も表示。毎朝自動更新。">
  <meta property="og:url" content="https://ysk713.github.io/-/world-health-map/">
  <meta property="og:image" content="https://ysk713.github.io/-/world-health-map/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://ysk713.github.io/-/world-health-map/">
  <link rel="stylesheet" href="style.css?v=20261019b">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>世界医療情報マップ</h1>
      <span id="updated" class="muted">データ読み込み中…</span>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="国名で検索（例：ケニア、Brazil）" list="country-list" autocomplete="off">
      <datalist id="country-list"></datalist>
      <div id="regions" class="chips" role="tablist" aria-label="地域"></div>
      <select id="disease" aria-label="病気の分布を見る"><option value="">病気の分布を見る…</option></select>
      <button id="translate-btn" class="chip translate" hidden>見出しを日本語に訳す</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="世界地図">
      <div id="globe" role="img" aria-label="衛星写真の地球儀。国をクリックすると医療情報が表示されます" hidden></div>
      <svg id="map" role="img" aria-label="国をクリックすると医療情報が表示されます"></svg>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="map-mode" class="map-mode" role="group" aria-label="地図の表示">
        <button type="button" data-mode="satellite" aria-pressed="false">衛星写真</button>
        <button type="button" data-mode="simple" aria-pressed="false">簡略地図</button>
      </div>
      <div class="map-tools">
        <button id="zoom-in" title="拡大" aria-label="拡大">＋</button>
        <button id="zoom-out" title="縮小" aria-label="縮小">－</button>
        <button id="zoom-reset" title="全体表示" aria-label="全体表示">⟲</button>
      </div>
      <div class="legend" aria-label="凡例">
        <span id="legend-title">直近の記事数</span>
        <div id="legend-scale" class="legend-scale"></div>
        <div class="legend-labels"><span>少</span><span>多</span></div>
        <div id="credit" class="credit" hidden>地球の画像: NASA Blue Marble</div>
      </div>
    </section>

    <aside id="panel" class="panel" aria-live="polite"></aside>
  </main>

  <template id="tpl-video">
    <div class="video-block">
      <div class="player"><iframe title="動画" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
      <p class="video-title"></p>
      <div class="thumbs"></div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="app.js?v=20261019b"></script>
</body>
</html>
