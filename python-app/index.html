<style>
/* Layout: 左に章の目次、右にレッスン本文と演習。狭い画面では目次を上に折りたたむ。エディタは両テーマ共通の濃紺。 */
:root {
  --bg: #f3f6f9;
  --surface: #ffffff;
  --ink: #15212e;
  --muted: #5b6979;
  --line: #d9e1ea;
  --accent: #2c69ab;
  --accent-soft: #e3edf8;
  --accent-ink: #ffffff;
  --hl: #f0bf2c;
  --hl-ink: #2b2100;
  --ok: #1d8657;
  --ok-soft: #e1f3ea;
  --err: #c03d36;
  --err-soft: #fbe8e6;
  --code-bg: #0f1a26;
  --code-fg: #dbe5ef;
  --code-muted: #6c7f93;
  --code-line: #1f2d3c;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131b; --surface: #131d28; --ink: #e3eaf1; --muted: #93a2b2; --line: #243344;
    --accent: #72a9e4; --accent-soft: #1a2b3e; --accent-ink: #0c131b; --hl: #f3cb4a; --hl-ink: #2b2100;
    --ok: #4cc28a; --ok-soft: #10291e; --err: #f07b72; --err-soft: #32161a;
    --code-bg: #091018; --code-line: #18242f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131b; --surface: #131d28; --ink: #e3eaf1; --muted: #93a2b2; --line: #243344;
  --accent: #72a9e4; --accent-soft: #1a2b3e; --accent-ink: #0c131b; --hl: #f3cb4a; --hl-ink: #2b2100;
  --ok: #4cc28a; --ok-soft: #10291e; --err: #f07b72; --err-soft: #32161a;
  --code-bg: #091018; --code-line: #18242f; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
code, pre, textarea, .mono { font-family: var(--font-mono); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { max-width: 1180px; margin: 0 auto; padding-block: 18px 48px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding-block: 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 22px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand .prompt { font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-size: 18px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 4px 14px; border-radius: 999px; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hl); }
.status.ready .dot { background: var(--ok); }
.status.fail .dot { background: var(--err); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 110px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--hl); width: 0; transition: width .4s; }

/* Layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px; }
.toc details { border: 0; }
.toc summary { display: none; }
.part { margin-bottom: 14px; }
.part h3 { margin: 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li button {
  width: 100%; display: grid; grid-template-columns: 26px 1fr 16px; align-items: center; gap: 6px;
  text-align: left; border: 0; background: transparent; color: var(--ink); padding: 5px 8px; border-radius: 6px; font-size: 14px; line-height: 1.4;
}
.toc li button:hover { background: var(--accent-soft); }
.toc li button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.toc .num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc .mark { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); }
.toc .mark.done { background: var(--hl); border-color: var(--hl); }

/* Lesson */
main { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
.lesson h2 { margin: 2px 0 14px; font-size: 28px; line-height: 1.35; text-wrap: balance; }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 0 0 12px; padding-left: 1.3em; }
.prose code { background: var(--accent-soft); color: var(--ink); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
.prose pre { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; overflow-x: auto; font-size: 13px; line-height: 1.6; margin: 0 0 14px; }
.prose pre code { background: none; padding: 0; }
.prose table { border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
.tablewrap { overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 4px 12px 4px 0; text-align: left; }
.prose th { color: var(--muted); font-weight: 500; font-size: 12px; }

.block { margin-top: 26px; }
.block-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.block-head h4 { margin: 0; font-size: 16px; }
.block-head .tag { font-size: 11px; letter-spacing: .1em; font-weight: 700; color: var(--muted); }

/* Editor */
.editor { background: var(--code-bg); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--code-line); }
.ed-body { display: grid; grid-template-columns: auto minmax(0, 1fr); }
.gutter { margin: 0; padding: 12px 8px 12px 12px; color: var(--code-muted); font-size: 13px; line-height: 1.6; text-align: right; user-select: none; overflow: hidden; font-variant-numeric: tabular-nums; }
.editor textarea {
  width: 100%; min-height: 120px; resize: vertical; border: 0; outline: 0; background: transparent; color: var(--code-fg);
  font-size: 13px; line-height: 1.6; padding: 12px 12px 12px 6px; white-space: pre; overflow: auto; tab-size: 4; caret-color: var(--hl);
}
.editor textarea:focus-visible { outline: none; }
.editor:focus-within { border-color: var(--accent); }
.ed-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--code-line); }
.ed-bar .sp { flex: 1; }
.ed-bar .kbd { font-size: 11px; color: var(--code-muted); }
.btn { border: 1px solid transparent; border-radius: 7px; padding: 5px 14px; font-size: 13px; font-weight: 500; }
.btn.run { background: var(--hl); color: var(--hl-ink); }
.btn.run::before { content: "▶ "; font-size: 10px; }
.btn.grade { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--code-fg); border-color: var(--code-line); }
.btn:disabled { opacity: .5; cursor: wait; }
.output {
  margin: 0; background: #070c12; color: var(--code-fg); font-size: 13px; line-height: 1.6;
  padding: 10px 14px; white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--code-line); max-height: 320px; overflow: auto;
}
.output:empty { display: none; }
.output .e { color: #ff8f86; }
.output .m { color: var(--code-muted); }
.stdin { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px 0; }
.stdin label { font-size: 11px; color: var(--code-muted); letter-spacing: .06em; }
.stdin textarea { min-height: 44px; height: 52px; background: #070c12; border-radius: 6px; padding: 6px 10px; }

/* Exercise */
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; }
.task p { margin: 0 0 8px; }
.task p:last-child { margin-bottom: 0; }
.task code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
.task pre { background: var(--bg); border-radius: 6px; padding: 8px 12px; font-size: 13px; overflow-x: auto; margin: 4px 0 8px; }
.verdict { margin-top: 10px; border-radius: var(--radius); padding: 12px 16px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ng { background: var(--err-soft); color: var(--err); }
.verdict strong { display: block; font-size: 15px; margin-bottom: 2px; }
.verdict .detail { color: var(--ink); font-family: var(--font-mono); font-size: 12.5px; }
.reveal { margin-top: 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 16px; font-size: 14px; }
.reveal pre { margin: 6px 0 0; font-size: 13px; overflow-x: auto; }
.links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* Quiz */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.quiz .q { margin: 0 0 10px; font-weight: 500; }
.quiz .q code, .quiz .exp code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.choices button { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 12px; font-family: var(--font-mono); font-size: 13px; }
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.choices button.wrong { border-color: var(--err); background: var(--err-soft); color: var(--err); }
.choices button:disabled { cursor: default; }
.exp { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }
.pager button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 14px; font-size: 14px; max-width: 48%; text-align: left; }
.pager button small { display: block; color: var(--muted); font-size: 11px; }
.pager .next { margin-left: auto; text-align: right; }

/* Playground */
.play-grid { display: grid; gap: 14px; }
.snips { display: flex; flex-wrap: wrap; gap: 8px; }
.snips button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.snips button:hover { border-color: var(--accent); color: var(--accent); }
.note { font-size: 13px; color: var(--muted); max-width: 68ch; }
.note code { background: var(--accent-soft); color: var(--ink); padding: 1px 5px; border-radius: 4px; }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .toc { position: static; max-height: none; }
  .toc summary { display: block; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .toc details[open] summary { margin-bottom: 10px; }
  .lesson h2 { font-size: 23px; }
  .top { position: static; }
  .bar { width: 70px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

<script type="text/python" id="pyrunner">
from browser import window
import sys
import json


class _Out:
    def __init__(self):
        self.parts = []

    def write(self, s):
        s = str(s)
        self.parts.append(s)
        return len(s)

    def flush(self):
        pass

    def getvalue(self):
        return "".join(self.parts)


def _make_input(out, stdin, echo):
    lines = stdin.split("\n") if stdin else []
    if lines and lines[-1] == "":
        lines.pop()

    def _input(prompt=""):
        if echo:
            out.write(str(prompt))
        if not lines:
            raise EOFError("input() で読み込む値がありません。入力欄に値を書いてください")
        v = lines.pop(0)
        if echo:
            out.write(v + "\n")
        return v
    return _input


def _err_info(e):
    line = None
    if isinstance(e, SyntaxError):
        line = getattr(e, "lineno", None)
        msg = getattr(e, "msg", None) or str(e)
    else:
        msg = str(e)
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "<main>":
                line = tb.tb_lineno
            tb = tb.tb_next
    return {"type": type(e).__name__, "msg": msg, "line": line}


def _exec(code, stdin, echo):
    out = _Out()
    ns = {"__name__": "__main__", "input": _make_input(out, stdin, echo)}
    saved = (sys.stdout, sys.stderr)
    sys.stdout = sys.stderr = out
    err = None
    try:
        exec(compile(code, "<main>", "exec"), ns)
    except BaseException as e:
        err = _err_info(e)
    finally:
        sys.stdout, sys.stderr = saved
    return out.getvalue(), ns, err


def _norm(s):
    lines = [l.rstrip() for l in str(s).replace("\r\n", "\n").split("\n")]
    return "\n".join(lines).strip("\n")


def _show(s):
    s = str(s).rstrip("\n")
    return s if s else "（何も表示されていません）"


def run(code, stdin, test):
    code = str(code)
    stdin = str(stdin or "")
    test = str(test or "")
    output, ns, err = _exec(code, stdin, not test)
    res = {"output": output, "error": err, "test": None}
    if not test or err is not None:
        return json.dumps(res, ensure_ascii=False)

    def _check_output(expected):
        if _norm(output) != _norm(expected):
            raise AssertionError("表示された内容が期待と違います。\n― 期待 ―\n" + _show(expected) + "\n― 実際 ―\n" + _show(output))

    def _expect_io(stdin_text, expected):
        o, _, e = _exec(code, stdin_text, False)
        shown = stdin_text.rstrip("\n").replace("\n", " ⏎ ")
        if e is not None:
            raise AssertionError("入力が「" + shown + "」のとき " + e["type"] + " が発生しました: " + e["msg"])
        if _norm(o) != _norm(expected):
            raise AssertionError("入力が「" + shown + "」のときの表示が違います。\n― 期待 ―\n" + _show(expected) + "\n― 実際 ―\n" + _show(o))

    def _eq(actual, expected, label):
        if actual != expected:
            raise AssertionError(label + " は " + repr(expected) + " になるはずですが、" + repr(actual) + " でした")

    def _raises(exc_type, fn, label):
        try:
            fn()
        except exc_type:
            return
        except BaseException as e:
            raise AssertionError(label + " で " + exc_type.__name__ + " が出るはずですが、" + type(e).__name__ + " が出ました")
        raise AssertionError(label + " で " + exc_type.__name__ + " が出るはずですが、何も起きませんでした")

    ns.update(_check_output=_check_output, _expect_io=_expect_io, _eq=_eq, _raises=_raises)
    sink = _Out()
    saved = (sys.stdout, sys.stderr)
    sys.stdout = sys.stderr = sink
    try:
        exec(test, ns)
        res["test"] = {"passed": True, "message": ""}
    except AssertionError as e:
        res["test"] = {"passed": False, "message": str(e) or "テストに合格しませんでした"}
    except BaseException as e:
        res["test"] = {"passed": False, "message": type(e).__name__ + ": " + str(e)}
    finally:
        sys.stdout, sys.stderr = saved
    return json.dumps(res, ensure_ascii=False)


window.pyRun = run
window.pyReady()
</script>

  body: R`<p>値には「型」があります。主なものは整数 <code>int</code>、小数 <code>float</code>、文字列 <code>str</code>、真偽値 <code>bool</code>（<code>True</code>/<code>False</code>）です。<code>type(値)</code> で確かめられます。</p>

{
  id: "while", part: "基礎編", title: "while ループ",
  body: R`<p><code>while 条件:</code> は、条件が True の間ずっと繰り返します。回数が事前に決まらないときに使います。</p>
<pre><code>n = 1

    n *= 2

<ul><li><code>break</code> でループを途中で抜けます。</li><li><code>continue</code> で残りを飛ばして次の繰り返しへ進みます。</li></ul>
<p><strong>注意:</strong> 条件がずっと True のままだと無限ループになり、このページが固まります。その場合はページを再読み込みしてください（コードは実行前に自動保存されています）。</p>`,
  example: R`count = 0
n = 1
while n < 1000:
    n *= 3
    count += 1
print(n, count)

for i in range(10):
    if i % 2 == 0:
        continue
    if i > 7:
        break
    print(i)`,
  task: R`<p><strong>コラッツの問題</strong>: 正の整数 n について、偶数なら 2 で割り、奇数なら 3 倍して 1 を足す、という操作を n が 1 になるまで繰り返します。</p><p>n を <code>input()</code> で読み込み、1 になるまでの<strong>操作の回数</strong>を表示してください。例: 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1 なので <code>8</code>。</p>`,
  stdin: "6",
  starter: R`n = int(input())
steps = 0
`,
  test: R`_expect_io("6\n", "8")
_expect_io("1\n", "0")
_expect_io("27\n", "111")`,
  hint: R`while n != 1: の中で、n % 2 == 0 かどうかで処理を分け、steps += 1 します。偶数のときは n //= 2 を使うと整数のままです。`,
  solution: R`n = int(input())

{
  id: "dict", part: "データと関数", title: "辞書 dict",
  body: R`<p>辞書は「キー」と「値」の組を持つデータです。名前で値を引けるので、住所録や集計に向いています。</p>

<p>存在しないキーを <code>price["メロン"]</code> のように読むと <code>KeyError</code> になります。<code>get()</code> を使うと安全です。数を数えるときは <code>counts[w] = counts.get(w, 0) + 1</code> が定番です。</p>`,

banana:2
cherry:1</pre>`,

`,

{

  body: R`<p>まとまった処理に名前をつけて何度も使えるようにするのが関数です。<code>def</code> で定義し、<code>return</code> で結果を返します。</p>

  body: R`<p>クラスは「データ」と「それを扱う処理（メソッド）」をひとまとめにした設計図です。設計図から作った実体をインスタンス（オブジェクト）と呼びます。</p>

  task: R`<p>銀行口座を表すクラス <code>BankAccount</code> を作ってください。</p><ul><li><code>BankAccount(owner, balance=0)</code> で作成。属性 <code>owner</code> と <code>balance</code> を持つ</li><li><code>deposit(amount)</code>: 残高を増やす</li><li><code>withdraw(amount)</code>: 残高を減らす。残高が足りないときは <code>ValueError</code> を起こし、残高は変えない</li><li><code>str(口座)</code> で <code>山田: 1000円</code> のように表示される</li></ul>`,

  id: "gen", part: "中級編", title: "ジェネレータと yield",
  body: R`<p>関数の中で <code>return</code> の代わりに <code>yield</code> を使うと、値を<strong>1つずつ順番に</strong>生み出すジェネレータになります。必要になったときに次の値を計算するので、無限に続く数列も扱えます。</p>
<pre><code>def countdown(n):
    while n &gt; 0:
        yield n
        n -= 1

for x in countdown(3):
    print(x)      # 3, 2, 1

g = countdown(2)
next(g)   # 2
next(g)   # 1</code></pre>
<p><code>(x * x for x in range(10))</code> のように丸かっこで書く「ジェネレータ式」もあります。<code>sum()</code> などに直接渡せてメモリを節約できます。</p>`,
  example: R`def evens():

    a, b = 0, 1

def take(gen, n):

print(take(fib(), 7))
`,

{
  id: "deco", part: "中級編", title: "デコレータ",
  body: R`<p>Python では関数も値なので、変数に入れたり、引数として渡したり、関数の中で関数を作って返したりできます。</p>
<p><strong>デコレータ</strong>は「関数を受け取り、機能を足した新しい関数を返す関数」です。<code>@名前</code> を関数定義の上に書いて使います。</p>
<pre><code>def shout(func):
    def wrapper(*args, **kwargs):
        result = func(*args, **kwargs)
        return result.upper() + "!"
    return wrapper

@shout            # hello = shout(hello) と同じ
def hello(name):
    return f"hello {name}"

hello("py")   # 'HELLO PY!'</code></pre>
<p><code>*args, **kwargs</code> は「どんな引数でもそのまま受け取って渡す」書き方です。<code>functools.wraps</code> を使うと元の関数名などが引き継がれます。</p>`,
  example: R`import functools

def log(func):
    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        print(f"呼び出し: {func.__name__}{args}")
        return func(*args, **kwargs)
    return wrapper

@log
def add(a, b):
    return a + b

print(add(2, 3))
print(add.__name__)`,
  task: R`<p>関数が呼ばれた回数を数えるデコレータ <code>count_calls</code> を作ってください。</p><ul><li>デコレートされた関数は、元の関数と同じ結果を返す</li><li>関数の属性 <code>calls</code> に、これまで呼ばれた回数が入る（最初は 0）</li></ul><pre>@count_calls
def square(x):
    return x * x

square(3)       # 9
square(4)       # 16
square.calls    # 2</pre>`,
  starter: R`def count_calls(func):
    def wrapper(*args, **kwargs):
        pass
    return wrapper
`,
  test: R`@count_calls
def square(x):
    return x * x

@count_calls
def greet(name, mark="!"):
    return "hi " + name + mark

_eq(square.calls, 0, "最初の square.calls")
_eq(square(3), 9, "square(3)")
_eq(square(4), 16, "square(4)")
_eq(square.calls, 2, "2回呼んだ後の square.calls")
_eq(greet("a", mark="?"), "hi a?", 'greet("a", mark="?")')
_eq(greet.calls, 1, "greet.calls（square とは別に数える）")`,
  hint: R`wrapper の外（return wrapper の前）で wrapper.calls = 0 と初期化し、wrapper の中で wrapper.calls += 1 してから return func(*args, **kwargs) します。`,
  solution: R`def count_calls(func):
    def wrapper(*args, **kwargs):
        wrapper.calls += 1
        return func(*args, **kwargs)
    wrapper.calls = 0
    return wrapper`,
  quiz: { q: R`<code>@deco</code> を <code>def f(): ...</code> の上に書くのと同じ意味のコードは？`, choices: ["f = deco", "deco = f(deco)", "f = deco(f)", "f(deco)"], answer: 2,
    explain: R`デコレータは <code>f = deco(f)</code> の省略記法です。元の f が deco に渡され、返ってきた関数が新しい f になります。` }
},
{
  id: "final", part: "中級編", title: "総合演習: 成績集計",
  body: R`<p>ここまでの知識を組み合わせます。実際のプログラムでは、テキストを読み込んで分解し、データ構造に整理して、集計・並べ替えをする流れがとても多く出てきます。</p>

sorted(people, key=lambda p: p[1], reverse=True)   # 点数の高い順</code></pre>
<p><code>key=</code> には「並べ替えの基準を返す関数」を渡します。<code>lambda 引数: 式</code> は名前のない小さな関数です。Python の <code>sorted</code> は<strong>安定ソート</strong>なので、同点のときは元の順番が保たれます。</p>`,
  example: R`data = ["佐藤,82", "鈴木,95", "高橋,70"]
people = []
for line in data:
    name, score = line.split(",")
    people.append((name, int(score)))

for name, score in sorted(people, key=lambda p: p[1], reverse=True):
    print(f"{name:　<4}{score:>4}点")`,
  task: R`<p><code>"名前,点数"</code> 形式の文字列のリストを受け取り、集計結果を辞書で返す関数 <code>summarize(lines)</code> を作ってください。</p><ul><li><code>"average"</code>: 平均点（小数第1位に丸める）</li><li><code>"top"</code>: 最高点の人の名前（同点なら先に出てきた人）</li><li><code>"ranking"</code>: 点数の高い順に並べた名前のリスト（同点は元の順番）</li><li><code>"passed"</code>: 60点以上の人数</li></ul><pre>summarize(["佐藤,82", "鈴木,95", "高橋,58"])
→ {"average": 78.3, "top": "鈴木",
   "ranking": ["鈴木", "佐藤", "高橋"], "passed": 2}</pre>`,
  starter: R`def summarize(lines):
    pass


print(summarize(["佐藤,82", "鈴木,95", "高橋,58"]))
`,
  test: R`r = summarize(["佐藤,82", "鈴木,95", "高橋,58"])
_eq(r.get("average"), 78.3, '"average"')
_eq(r.get("top"), "鈴木", '"top"')
_eq(r.get("ranking"), ["鈴木", "佐藤", "高橋"], '"ranking"')
_eq(r.get("passed"), 2, '"passed"')
r2 = summarize(["A,70", "B,90", "C,90", "D,40"])
_eq(r2.get("top"), "B", '同点のときの "top"')
_eq(r2.get("ranking"), ["B", "C", "A", "D"], '同点を含む "ranking"')
_eq(r2.get("average"), 72.5, '2つ目のデータの "average"')
_eq(r2.get("passed"), 3, '2つ目のデータの "passed"')`,
  hint: R`まず (名前, 点数) のタプルのリストを作ります。ranking は sorted(people, key=lambda p: p[1], reverse=True)。top は ranking の先頭です。passed は sum(1 for _, s in people if s >= 60) で数えられます。`,
  solution: R`def summarize(lines):
    people = []
    for line in lines:
        name, score = line.split(",")
        people.append((name, int(score)))
    ranked = sorted(people, key=lambda p: p[1], reverse=True)
    scores = [s for _, s in people]
    return {
        "average": round(sum(scores) / len(scores), 1),
        "top": ranked[0][0],
        "ranking": [n for n, _ in ranked],
        "passed": sum(1 for s in scores if s >= 60),
    }


print(summarize(["佐藤,82", "鈴木,95", "高橋,58"]))`,
  quiz: { q: R`<code>sorted(["bb", "a", "ccc"], key=len)</code> の結果は？`, choices: ["['a', 'bb', 'ccc']", "['ccc', 'bb', 'a']", "['a', 'ccc', 'bb']", "[1, 2, 3]"], answer: 0,
    explain: R`<code>key=len</code> で各要素の長さを基準に並べます。返るのは元の要素のリストで、長さの数値ではありません。` }
}
]; // END_LESSONS

const ERROR_HINTS = {
  SyntaxError: "文法の間違いです。かっこや引用符の閉じ忘れ、if や for の行末の : を確認しましょう。",
  IndentationError: "インデント（行頭の空白）がずれています。同じブロックの行は同じ数のスペースでそろえます。",
  NameError: "まだ定義されていない名前を使っています。変数名・関数名の打ち間違いや、定義より前で使っていないか確認しましょう。",
  TypeError: "型の組み合わせが合いません。文字列と数を足していないか、関数の引数の数が合っているか確認しましょう。",
  ValueError: "値の中身が不正です。たとえば int(\"abc\") のように数にできない文字列を変換しようとしていませんか。",
  ZeroDivisionError: "0 で割ろうとしています。",
  IndexError: "リストや文字列の範囲外の位置を読もうとしています。インデックスは 0 から 長さ-1 までです。",
  KeyError: "辞書にないキーを読もうとしています。get() を使うか、in で存在を確かめましょう。",
  AttributeError: "その値にはないメソッドや属性を使っています。綴りや、値の型を確認しましょう。",
  EOFError: "input() で読む値が足りません。入力欄に値を1行ずつ書いてください。",
  RecursionError: "関数の呼び出しが深くなりすぎました。再帰の終了条件を確認しましょう。",
};

/* ---------- state ---------- */
const STORE_KEY = "py-renshu:v1";
let state = { done: {}, quiz: {}, code: {}, last: LESSONS[0].id, play: null, playStdin: null };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- Python runtime ---------- */
let pyIsReady = false;
window.pyReady = () => {
  pyIsReady = true;
  document.getElementById("status").className = "status ready";
  document.getElementById("status-text").textContent = "Python 準備OK";
  document.querySelectorAll("button[data-needs-py]").forEach(b => b.disabled = false);
};
function runPython(code, stdin, test) {
  if (!pyIsReady) return null;
  try { return JSON.parse(window.pyRun(code, stdin || "", test || "")); }
  catch (e) { return { output: "", error: { type: "内部エラー", msg: String(e && e.message || e), line: null }, test: null }; }
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function renderOutput(el, res) {
  if (!res) { el.innerHTML = '<span class="m">Python がまだ準備中です。数秒待ってからもう一度押してください。</span>'; return; }
  let html = esc(res.output);
  if (res.error) {
    const e = res.error;
    const where = e.line ? `${e.line}行目で ` : "";
    html += `<span class="e">${esc(where + e.type + ": " + e.msg)}</span>`;
    const hint = ERROR_HINTS[e.type];
    if (hint) html += `\n<span class="m">ヒント: ${esc(hint)}</span>`;
  }
  if (!res.output && !res.error) html = '<span class="m">（実行しました。表示する内容はありません）</span>';
  el.innerHTML = html;
}

/* ---------- editor ---------- */
function makeEditor(host, opts) {
  host.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "editor";
  wrap.innerHTML = `
    <div class="ed-body"><pre class="gutter" aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${esc(opts.label || "コード")}" id="${opts.id}"></textarea></div>
    ${opts.stdin !== undefined ? `<div class="stdin"><label for="${opts.id}-in">入力（input() に1行ずつ渡される値）</label><textarea class="mono" spellcheck="false" id="${opts.id}-in"></textarea></div>` : ""}
    <div class="ed-bar"></div>
    <pre class="output" aria-live="polite"></pre>`;
  host.appendChild(wrap);
  const ta = wrap.querySelector(".ed-body textarea");
  const gutter = wrap.querySelector(".gutter");
  const inTa = wrap.querySelector(".stdin textarea");
  const bar = wrap.querySelector(".ed-bar");
  const out = wrap.querySelector(".output");
  ta.value = opts.code;
  if (inTa) inTa.value = opts.stdin || "";

  const fit = () => {
    const n = ta.value.split("\n").length;
    gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
    ta.style.height = "auto";
    ta.style.height = Math.max(opts.minLines ? opts.minLines * 20.8 + 24 : 120, Math.min(ta.scrollHeight + 2, 560)) + "px";
  };
  ta.addEventListener("input", () => { fit(); opts.onChange && opts.onChange(ta.value); });
  ta.addEventListener("scroll", () => { gutter.scrollTop = ta.scrollTop; });
  inTa && inTa.addEventListener("input", () => opts.onStdin && opts.onStdin(inTa.value));

  ta.addEventListener("keydown", e => {
    const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); opts.onRun && opts.onRun(); return; }
    if (e.key === "Tab") {
      e.preventDefault();
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      if (e.shiftKey) {
        const m = v.slice(ls).match(/^ {1,4}/);
        if (m) { ta.setRangeText("", ls, ls + m[0].length, "end"); ta.setSelectionRange(Math.max(ls, s - m[0].length), Math.max(ls, en - m[0].length)); }
      } else if (s === en) {
        ta.setRangeText("    ", s, en, "end");
      } else {
        const block = v.slice(ls, en).replace(/^/gm, "    ");
        ta.setRangeText(block, ls, en, "select");
      }
      ta.dispatchEvent(new Event("input"));
    } else if (e.key === "Enter" && !e.isComposing && s === en) {
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const line = v.slice(ls, s);
      let indent = line.match(/^ */)[0];
      if (/:\s*(#.*)?$/.test(line)) indent += "    ";
      e.preventDefault();
      ta.setRangeText("\n" + indent, s, en, "end");
      ta.dispatchEvent(new Event("input"));
    } else if (e.key === "Backspace" && s === en && s > 0) {
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const before = v.slice(ls, s);
      if (before.length && /^ +$/.test(before) && before.length % 4 === 0) {
        e.preventDefault();
        ta.setRangeText("", s - 4, s, "end");
        ta.dispatchEvent(new Event("input"));
      }
    }
  });

  requestAnimationFrame(fit);
  return {
    ta, inTa, bar, out,
    get value() { return ta.value; },
    set value(v) { ta.value = v; fit(); },
    get stdin() { return inTa ? inTa.value : ""; },
    set stdin(v) { if (inTa) inTa.value = v; },
    button(label, cls, fn, needsPy) {
      const b = document.createElement("button");
      b.className = "btn " + cls; b.textContent = label; b.type = "button";
      if (needsPy) { b.dataset.needsPy = "1"; b.disabled = !pyIsReady; }
      b.addEventListener("click", fn);
      bar.appendChild(b);
      return b;
    },
    spacer(text) { const s = document.createElement("span"); s.className = "sp"; bar.appendChild(s); if (text) { const k = document.createElement("span"); k.className = "kbd"; k.textContent = text; bar.appendChild(k); } },
  };
}

function runInto(ed, test) {
  ed.out.innerHTML = '<span class="m">実行中…</span>';
  return new Promise(resolve => setTimeout(() => {
    const res = runPython(ed.value, ed.stdin, test);
    renderOutput(ed.out, res);
    resolve(res);
  }, 20));
}

/* ---------- TOC + progress ---------- */
const PARTS = [...new Set(LESSONS.map(l => l.part))];
function renderToc() {
  const toc = document.getElementById("toc");
  toc.innerHTML = PARTS.map(p => `<div class="part"><h3>${esc(p)}</h3><ol>${
    LESSONS.map((l, i) => l.part === p ? `<li><button type="button" data-id="${l.id}" ${l.id === state.last ? 'aria-current="true"' : ""}>
      <span class="num">${String(i + 1).padStart(2, "0")}</span><span>${esc(l.title)}</span><span class="mark ${state.done[l.id] ? "done" : ""}" aria-label="${state.done[l.id] ? "クリア済み" : "未クリア"}"></span></button></li>` : "").join("")
  }</ol></div>`).join("");
  toc.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    openLesson(b.dataset.id);
    if (window.matchMedia("(max-width: 820px)").matches) document.getElementById("toc-details").open = false;
  }));
  const n = LESSONS.filter(l => state.done[l.id]).length;
  document.getElementById("progress-text").textContent = `${n} / ${LESSONS.length} クリア`;
  document.getElementById("bar").style.width = (n / LESSONS.length * 100) + "%";
  const cur = LESSONS.findIndex(l => l.id === state.last);
  document.getElementById("toc-summary").textContent = `目次 · ${String(cur + 1).padStart(2, "0")} ${LESSONS[cur].title}`;
}

/* ---------- lesson view ---------- */
function openLesson(id) {
  const idx = Math.max(0, LESSONS.findIndex(l => l.id === id));
  const L = LESSONS[idx];
  state.last = L.id; save();
  const main = document.getElementById("lesson");
  const prev = LESSONS[idx - 1], next = LESSONS[idx + 1];
  main.innerHTML = `
    <div class="eyebrow">${esc(L.part)} · 第${idx + 1}回</div>
    <h2>${esc(L.title)}</h2>
    <div class="prose">${L.body}</div>

    <div class="block"><div class="block-head"><span class="tag">EXAMPLE</span><h4>動かしてみよう</h4></div><div id="ex-host"></div></div>

    <div class="block"><div class="block-head"><span class="tag">EXERCISE</span><h4>演習</h4></div>
      <div class="task">${L.task}</div>
      <div id="task-host"></div>
      <div id="verdict"></div>
      <div class="links">
        <button type="button" class="linkbtn" id="show-hint">ヒントを見る</button>
        <button type="button" class="linkbtn" id="show-sol">解答例を見る</button>
      </div>
      <div id="reveal"></div>
    </div>

    <div class="block"><div class="block-head"><span class="tag">QUIZ</span><h4>確認クイズ</h4></div>
      <div class="quiz"><p class="q">${L.quiz.q}</p><div class="choices" id="choices"></div><p class="exp" id="exp" hidden></p></div>
    </div>

    <nav class="pager">
      ${prev ? `<button type="button" id="prev"><small>前へ</small>${esc(prev.title)}</button>` : ""}
      ${next ? `<button type="button" class="next" id="next"><small>次へ</small>${esc(next.title)}</button>` : ""}
    </nav>`;

  // Example
  const ex = makeEditor(document.getElementById("ex-host"), { id: "ex-" + L.id, code: L.example, label: "例のコード", stdin: L.exampleStdin, onRun: () => runInto(ex) });
  ex.button("実行", "run", () => runInto(ex), true);
  ex.button("元に戻す", "ghost", () => { ex.value = L.example; ex.out.textContent = ""; });
  ex.spacer("Ctrl + Enter で実行");

  // Exercise
  const saved = state.code[L.id];
  const ed = makeEditor(document.getElementById("task-host"), {
    id: "task-" + L.id, code: saved != null ? saved : L.starter, label: "演習のコード", minLines: 6,
    stdin: L.stdin,
    onChange: v => { state.code[L.id] = v; save(); },
    onRun: () => runInto(ed),
  });
  const verdict = document.getElementById("verdict");
  ed.button("実行", "run", () => runInto(ed), true);
  ed.button("採点する", "grade", async () => {
    state.code[L.id] = ed.value; save();
    const res = await runInto(ed, L.test);
    if (!res) return;
    if (res.error) {
      verdict.innerHTML = `<div class="verdict ng"><strong>エラーで止まりました</strong>下の実行結果のエラーを直してから、もう一度採点しましょう。</div>`;
    } else if (res.test && res.test.passed) {
      const first = !state.done[L.id];
      state.done[L.id] = true; save(); renderToc();
      verdict.innerHTML = `<div class="verdict ok"><strong>正解です！</strong>${first ? "このレッスンをクリアしました。" : "もう一度クリアしました。"}${next ? "解答例と見比べたら、次のレッスンへ進みましょう。" : "全レッスンの最後まで到達しました。"}</div>`;
    } else {
      verdict.innerHTML = `<div class="verdict ng"><strong>あと少し</strong><span class="detail">${esc(res.test ? res.test.message : "")}</span></div>`;
    }
  }, true);
  ed.button("最初から", "ghost", () => {
    ed.value = L.starter; state.code[L.id] = L.starter; save(); ed.out.textContent = ""; verdict.innerHTML = "";
  });
  ed.spacer(state.done[L.id] ? "クリア済み" : "");

  const reveal = document.getElementById("reveal");
  document.getElementById("show-hint").addEventListener("click", () => {
    reveal.innerHTML = `<div class="reveal"><strong>ヒント</strong><br>${esc(L.hint)}</div>`;
  });
  document.getElementById("show-sol").addEventListener("click", () => {
    reveal.innerHTML = `<div class="reveal"><strong>解答例</strong>（書き方は1通りではありません）<pre>${esc(L.solution)}</pre><button type="button" class="linkbtn" id="copy-sol">エディタに貼り付ける</button></div>`;
    document.getElementById("copy-sol").addEventListener("click", () => { ed.value = L.solution; state.code[L.id] = L.solution; save(); });
  });

  // Quiz
  const ch = document.getElementById("choices"), exp = document.getElementById("exp");
  L.quiz.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = c;
    b.addEventListener("click", () => {
      ch.querySelectorAll("button").forEach((x, j) => { x.disabled = true; if (j === L.quiz.answer) x.classList.add("right"); });
      if (i !== L.quiz.answer) b.classList.add("wrong");
      exp.hidden = false;
      exp.innerHTML = (i === L.quiz.answer ? "<strong>正解。</strong>" : "<strong>不正解。</strong>") + L.quiz.explain;
      state.quiz[L.id] = i === L.quiz.answer; save();
    });
    ch.appendChild(b);
  });

  prev && document.getElementById("prev").addEventListener("click", () => { openLesson(prev.id); window.scrollTo(0, 0); });
  next && document.getElementById("next").addEventListener("click", () => { openLesson(next.id); window.scrollTo(0, 0); });
  renderToc();
}
