<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>診断書・指示書 作成支援</title>
  <meta name="description" content="個人用医薬品購送で使う診断書・指示書（様式B）を入力フォームから作成し、用量上限・投薬期間制限・保険適応などの不備をその場でチェックします。データはブラウザ内だけで処理されます。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>診断書・指示書 作成支援</h1>
      <p class="sub">入力内容はこのブラウザの中だけに保存されます。外部には送信しません。</p>
    </div>
    <button type="button" id="topBackup" title="保存データをJSONファイルとしてPCにダウンロードします">バックアップ</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-page="edit" class="active">作成</button>
    <button data-page="list">保存一覧</button>
    <button data-page="settings">設定</button>
  </nav>

  <main id="main"></main>
  <div id="print"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="../geppou/data.js"></script>
  <script src="drugs.js"></script>
  <script src="app.js"></script>
</body>
</html>
