<style>

.small{font-size:12.5px}

nav.tabs button{background:none;border:1px solid transparent;border-bottom:none;border-radius:var(--r) var(--r) 0 0;padding:9px 16px;cursor:pointer;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}

.btn.danger{color:var(--kesu);border-color:var(--kesu)}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

.notice{border:1px dashed var(--hissu);color:var(--ink);background:color-mix(in srgb,var(--hissu) 10%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13px}

.drop.over,.drop:hover{border-color:var(--accent)}
.drop strong{display:block;font-size:15px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}

.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}

.doc .fn{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pill.s-照会中{color:var(--accent);border-color:currentColor}
.pill.s-回答受領{color:var(--konkyo);border-color:currentColor}
.pill.s-完了,.pill.s-照会不要{color:var(--ok);border-color:currentColor}

th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

mark{background:var(--mark);color:var(--mark-ink);padding:0 1px;border-radius:2px}

.kv .k{font-size:12px;color:var(--muted);font-weight:700}

.paper{background:var(--paper);color:var(--paper-ink);margin:14px;border:1px solid var(--paper-line);border-radius:4px;padding:16px;overflow-x:auto;min-height:120px}

.summary{display:flex;flex-wrap:wrap;gap:8px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;display:flex;flex-direction:column;min-width:96px}

.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// ---------- docx / xlsx 読み込み ----------
async function openZip(file, kind) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  if (buf.length > 4 && dv.getUint32(0, true) === 0xE011CFD0)
    throw new Error(kind === 'xlsx' ? '旧形式（.xls）です。Excelで「.xlsx」として保存し直してから読み込んでください。' : '旧形式（.doc）です。Wordで「.docx」として保存し直してから読み込んでください。');
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error(kind === 'xlsx' ? 'Excelファイル（.xlsx）として読めませんでした。' : 'Wordファイル（.docx）として読めませんでした。');
  const count = dv.getUint16(eocd + 10, true), td = new TextDecoder(), map = new Map();
  let p = dv.getUint32(eocd + 16, true);
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    map.set(td.decode(buf.subarray(p + 46, p + 46 + nlen)), { method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), lho: dv.getUint32(p + 42, true) });
    p += 46 + nlen + elen + clen;
  }
  return {
    has: n => map.has(n),
    async text(n) {
      const e = map.get(n);
      if (!e) throw new Error(`ファイル内に ${n} が見つかりませんでした。`);
      const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
      const data = buf.subarray(start, start + e.csize);
      if (e.method === 0) return td.decode(data);
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return td.decode(await new Response(stream).arrayBuffer());
    },
  };
}

      else if (ln === 'ins') it(c, true);
      else if (!SKIP.has(ln)) it(c, inIns);

  if (/<html|<body|<p[ >]/i.test(s)) {
    s = s.replace(/<(script|style)[\s\S]*?<\/\1>/gi, '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|h\d|li|tr)>/gi, '\n')

// ワクチン接種可能医療機関一覧（Excel）
const VX = { name: /医療機関名|病院名|施設名|^医療機関$|^名称$/, addr: /所在地|住所/, tel: /電話|TEL|連絡先/i, dept: /診療科/, ja: /日本語/, en: /英語/, note: /備考/, url: /URL|ＵＲＬ|ホームページ|ウェブサイト|^HP$/i, skip: /^(No\.?|番号|№|#|＃)$/i };
const VX_LABEL = { name: '医療機関名', addr: '所在地', tel: '電話番号', dept: '診療科', ja: '日本語対応', en: '英語対応', note: '備考', url: 'URL' };
function cellRef(r, c) { let s = '', n = c + 1; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - 1 - m) / 26; } return s + (r + 1); }

}
function vxTable(g) {
  const get = (r, c) => String((g[r] || [])[c] ?? '').trim();
  let L = null;
  outer: for (let r = 0; r < g.length; r++) for (let c = 0; c < (g[r] || []).length; c++) {
    if (classify(get(r, c)) !== 'name') continue;
    if ((g[r] || []).some((x, i) => i !== c && ['addr', 'tel'].includes(classify(x)))) { L = { dir: 'row', at: r, from: c }; break outer; }
    if (g.some((row, i) => i !== r && ['addr', 'tel'].includes(classify((row || [])[c])))) { L = { dir: 'col', at: c, from: r }; break outer; }

  const labels = [], recs = [];
  if (L.dir === 'row') {
    (g[L.at] || []).forEach((_, c) => { const t = get(L.at, c), k = classify(t); if (k && k !== 'skip') labels.push({ i: c, k, t }); });
    for (let r = L.at + 1; r < g.length; r++) {
      const vals = labels.map(l => get(r, l.i));
      if (vals.filter(Boolean).length < 2) continue;
      recs.push({ vals, refs: labels.map(l => cellRef(r, l.i)) });
    }
  } else {
    const maxC = Math.max(0, ...g.map(r => r ? r.length : 0));
    for (let r = L.from; r < g.length; r++) { const t = get(r, L.at), k = classify(t); if (k && k !== 'skip') labels.push({ i: r, k, t }); }
    for (let c = L.at + 1; c < maxC; c++) {
      const vals = labels.map(l => get(l.i, c));

}
function checkXlsx(d, st) {
  const out = [], cfg = st.cfg;

// ---------- 連絡先（URL・電話番号）の抽出 ----------
const RE_URL = /(https?:\/\/|www\.)[^\s　、。，）」<>"]+/gi;
const RE_TEL = /(電話|TEL|Tel|tel|℡)[^0-9０-９+＋（(]{0,4}([+＋]?[0-9０-９（）()\-－‐ 　]{6,30}[0-9０-９])/g;

function contactsOf(d) {
  if (d.slim) return (d.contactsCache || []).map(c => Object.assign({}, c, { kokan: d.kokan }));
  const out = [];
  const push = (kind, value, ctx, loc) => { value = value.replace(/[.,]$/, '').trim(); if (value) out.push({ kind, value, ctx: ctx.slice(0, 40), loc, kokan: d.kokan, doc: d.name }); };
  const scan = (t, loc, ctxDefault) => {
    for (const m of t.matchAll(RE_URL)) push('url', m[0], ctxDefault || t.slice(0, m.index).trim() || t, loc);
    for (const m of t.matchAll(RE_TEL)) push('tel', m[2], ctxDefault || t.slice(0, m.index).replace(/[　\s]+$/, '') || t, loc);
  };
  if (d.type === 'xlsx') {
    d.sheets.forEach(sh => {
      const T = vxTable(sh.grid);
      if (!T) return;
      T.recs.forEach(rec => {
        const nm = rec.vals[T.labels.findIndex(l => l.k === 'name')] || '';
        T.labels.forEach((l, i) => {
          const v = rec.vals[i], loc = `${sh.name}!${rec.refs[i]}`;
          if (!v) return;
          if (l.k === 'tel') v.split(/[\/／、,\n]/).forEach(x => x.trim() && push('tel', x, nm, loc));
          else if (l.k === 'url') push('url', v, nm, loc);
          else if (l.k === 'note') scan(v, loc, nm);
        });
      });
    });
  } else {
    let last = '';
    d.paras.forEach((p, i) => {
      if (!p.t) return;
      const before = out.length;
      scan(p.t, `第${i + 1}段落`, '');
      for (let j = before; j < out.length; j++) if (out[j].ctx === p.t.slice(0, 40) && last) out[j].ctx = last;

各段落の先頭の [数字] が段落番号です。次の形のJSON配列だけを返してください：

原稿：
${lines}`;
  const res = await SAMPLE.json(prompt, { modelTier: 'complex', signal: (aiCtl = new AbortController()).signal, onText });
  const arr = Array.isArray(res) ? res : [];
  return arr.slice(0, 20).map(x => {

    const q = String(x.quote || '').slice(0, 60);
    const at = q && pt.includes(q) ? pt.indexOf(q) : -1;
    return Object.assign({ cat: '参考', para: at >= 0 ? pi : 0, msg: `【Claude・${x.kind || '内容'}・確度${x.confidence || '−'}】${x.problem || ''}`, fix: x.suggestion || '', ask: false, noWrite: false },
      at >= 0 ? around(pt, at, q.length) : { quote: q || '（位置不明）' });

const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
let toastTimer;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4200); }
function catCounts(d) { const c = {}; CATS.forEach(k => c[k] = 0); d.findings.forEach(f => c[f.cat] = (c[f.cat] || 0) + 1); return c; }
function askCount(d) { return d.findings.filter(f => f.ask).length; }
function quoteHtml(f) {
  if (!f.hl) return esc(f.quote);
  const [a, l] = f.hl;
  return esc(f.quote.slice(0, a)) + '<mark>' + esc(f.quote.slice(a, a + l)) + '</mark>' + esc(f.quote.slice(a + l));
}
function dropMail(kokan) { delete S.mailEdits[kokan]; }
function revInfo(d) {
  if (d.pseudo) return `段落 ${d.paras.length}　ウェブページ由来のファイル（テキストとして読み込み）`;
  if (typeof d.revs === 'number') return `段落 ${d.paras.length}　見え消し ${d.revs}箇所`;
  const au = Object.entries(d.revs.authors || {}).map(([a, n]) => `${a} ${n}`).join('、');
  return `段落 ${d.paras.length}　表 ${d.tables || 0}　見え消し 挿入${d.revs.ins}・削除${d.revs.del}${au ? `（${au}）` : ''}` +
    (d.hiddenByIns ? `　※見え消しを承諾しないと空に見える段落が${d.hiddenByIns}あり、承諾後の本文でチェックしました` : '');
}

  </div>
  <div class="card"><h3>ワクチン表（Excel）のチェック</h3>
    <p class="muted small" style="margin:0">見出しに「医療機関名」と「所在地」または「電話」がある表を探し、医療機関が行・列のどちら向きに並んでいても読み取ります。日本語対応・英語対応・ワクチン以外の見出しは、ワクチン名の欄として扱います。別添３の作成要領に合わせて調整してください。</p>
    <div class="grid2">
      <div class="field"><label for="cfg-vxMax">1シートに載せられる医療機関の数</label><input id="cfg-vxMax" data-cfg="vxMax" type="number" value="${esc(c.vxMax)}"></div>
      <div class="field"><label for="cfg-vxSymbols">ワクチン欄で使ってよい記号（空白区切り）</label><input id="cfg-vxSymbols" data-cfg="vxSymbols" value="${esc(c.vxSymbols)}"></div>
      <div class="field"><label for="cfg-vxLangSymbols">日本語・英語の欄で使ってよい記号（空欄は「通用しない」）</label><input id="cfg-vxLangSymbols" data-cfg="vxLangSymbols" value="${esc(c.vxLangSymbols || '○ △')}"></div>
    </div>
    <label class="small row" style="gap:6px"><input type="checkbox" id="cfg-beppyo" data-cfgbool="beppyo" ${c.beppyo !== false ? 'checked' : ''}>原稿に、訓令別表の巡回先・健康相談対象公館の記載があるかを確認する（令和7年4月1日施行の別表）</label>
    <div class="field"><label for="cfg-vxNoteWords">備考に必ず書く事項（1行に1語。備考にその語が無ければ指摘）</label><textarea id="cfg-vxNoteWords" data-cfg="vxNoteWords" style="min-height:80px;white-space:pre-wrap" placeholder="例：予約&#10;料金">${esc(c.vxNoteWords)}</textarea></div>
  </div>
  <div class="card"><h3>チェックルール（原稿とワクチン表の文字）</h3>
    <p class="muted small" style="margin:0">1行が1ルールです。種別「禁止」は段落やセルの中に<b>あれば</b>指摘、「必須」は原稿全体（「範囲」に（４）〜（８）を書けばその節の中）に<b>なければ</b>指摘します（ワクチン表には「禁止」だけを使います）。パターンは正規表現（<code>A|B</code> で「AまたはB」）。照会列に「○」を入れると最初から照会対象になります。</p>
    ${bad.length ? `<div class="notice">${bad.join('、')}行目のパターンが正しくないため使っていません。括弧の対応を確かめてください。</div>` : ''}
    <div class="field"><label for="rules">ルール（タブ区切り）</label><textarea id="rules" data-area="rules" spellcheck="false" style="min-height:260px">${esc(rulesTsv)}</textarea></div>
    <div class="row"><button class="btn primary" data-act="recheck">この設定で全ファイルを再チェック</button><button class="btn" data-act="default-rules">ルールを既定に戻す</button></div>
  </div>
  <div class="card"><h3>保存とデータ</h3>
    <p class="muted small" style="margin:0">チェック結果・宛先・進捗・連絡先の確認状況はこのブラウザ内に保存されます。</p>
    <div class="row">
      ${DL || !IN_VIEWER ? `<button class="btn" data-act="save-app">このアプリをHTMLファイルで保存</button>` : ''}
      <span id="wipe-area"><button class="btn danger" data-act="wipe">保存データをすべて消去</button></span>
    </div>
    <p class="muted small" style="margin:0">画面が開かなくなったときは、このページのURLの末尾に <code>#reset</code> を付けて開くと、保存データを消去した状態で開きます。</p>
    ${DL || !IN_VIEWER ? `<p class="muted small" style="margin:0">保存したHTMLはブラウザ（Edge等）で開けば使えます。その場合はウェブサイトの自動確認と、照会メールの.eml保存も使えます。</p>` : ''}
  </div>`;
}

// ---------- 操作 ----------
function parseTsv(t) {
  return t.split(/\r?\n/).map(l => l.split('\t').map(x => x.trim())).filter(r => r.some(Boolean));
}
function setGroupSent(kokan) {
  (groups().get(kokan) || []).forEach(d => { const p = S.progress[d.name] = S.progress[d.name] || {}; if (p.status === '未照会' || !p.status) { p.status = '照会中'; p.sent = today(); } });
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button,[data-sel]');
  if (!b) return;
  const ds = b.dataset;
  if (ds.tab) { S.tab = ds.tab; save(); render(); return; }
  if (ds.sel) { S.sel = ds.sel; S.filter = 'all'; save(); render(); return; }
  if (ds.filter) { S.filter = ds.filter; render(); return; }
  if (ds.copy) { toast(await copyText(ds.copy) ? 'コピーしました。' : 'コピーできませんでした。文字を選択してコピーしてください。'); return; }
  if (ds.copymail) {
    const el = document.querySelector(`.paper[data-k="${CSS.escape(ds.copymail)}"]`);
    toast(await copyRich(el) ? '本文をコピーしました。Outlookの本文に貼り付けてください。' : '本文を選択しました。Ctrl+C でコピーしてください。');
    return;
  }
  if (ds.eml) {
    const el = document.querySelector(`.paper[data-k="${CSS.escape(ds.eml)}"]`);
    saveFile(`${ds.eml}_照会.eml`, emlFor(ds.eml, groups().get(ds.eml) || [], el.innerHTML), 'message/rfc822'); return;
  }
  if (ds.ai) {
    const d = S.docs.find(x => x.name === ds.ai);
    const n = d.paras.reduce((a, p) => a + p.t.length, 0);
    $('#revise-area').innerHTML = `<div class="notice">この原稿の本文（約${n.toLocaleString()}字）をClaude（Anthropic社）に送り、医学的内容・データ・整合性を確認します。省外への送信になるため、取り扱いが許される原稿でのみ使ってください。結果は「参考」として別枠に出し、照会メールや原稿には、照会にチェックしたものだけが入ります。
      <div class="row" style="margin-top:8px"><button class="btn sm primary" data-ai-go="${esc(d.name)}">送信して確認</button><button class="btn sm" data-act="ai-cancel">やめる</button></div></div>`;
    return;
  }
  if (ds.aiGo) {
    const d = S.docs.find(x => x.name === ds.aiGo);
    $('#revise-area').innerHTML = `<div class="notice"><span id="ai-status">Claudeが確認中です（1〜2分かかることがあります）…</span> <button class="btn sm" data-act="ai-stop">中止</button></div>`;
    try {
      d.ai = await aiReview(d, ({ text }) => { const el = $('#ai-status'); if (el) el.textContent = `Claudeが回答を書いています…（${text.length}字）`; });
      runCheck(d); dropMail(d.kokan); save(); S.filter = '参考'; render();
      toast(`Claudeの確認結果：${d.ai.length}件を「参考」に追加しました。`);
    } catch (e) {
      const msg = { not_granted: 'Claudeの利用が許可されませんでした。', cancelled: '中止しました。', rate_limited: '混み合っています。少し待ってからもう一度お試しください。' }[e && e.code] || `確認できませんでした（${esc((e && (e.message || e.code)) || e)}）。`;
      const el = $('#revise-area'); if (el) el.innerHTML = `<div class="notice">${msg}</div>`;
    }
    return;
  }
  if (ds.revise || ds.reviseForce) {
    const d = S.docs.find(x => x.name === (ds.revise || ds.reviseForce));
    const sb = sendBack(d);
    if (sb.on && !ds.reviseForce) {
      $('#revise-area').innerHTML = `<div class="notice">差し戻し推奨：①の欠損の指摘が${sb.count}件${sb.severe ? `（うち本文なし・表の崩壊など${sb.severe}件）` : ''}あります。こちらで直し込まず、医務官に再提出を依頼することをお勧めします。
        <div class="row" style="margin-top:8px"><button class="btn sm" data-revise-force="${esc(d.name)}">それでも体裁修正版を作成</button></div></div>`;
      return;
    }
    b.disabled = true;
    try {
      const r = await buildRevisedDocx(d);
      if (r.problems.length) { $('#revise-area').innerHTML = `<div class="notice">作成を中止しました：${r.problems.map(esc).join('、')}。原稿の構造が想定と違う可能性があります。</div>`; return; }
      $('#revise-area').innerHTML = `<div class="notice" style="border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)">見え消し修正 ${r.fixed}か所、コメント ${r.comments}件で作成しました（自動検証：XMLの妥当性・往復テストとも問題なし）。${r.skipped.length ? `<br>位置を特定できず書き込まなかった指摘：${r.skipped.length}件（レポートで確認してください）` : ''}</div>`;
      await saveFile(`☆【体裁修正済み】${d.kokan}.docx`, r.blob, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    } catch (err) { $('#revise-area').innerHTML = `<div class="notice">作成できませんでした：${esc(err.message)}</div>`; }
    finally { b.disabled = false; }
    return;
  }
  if (ds.reset) { dropMail(ds.reset); save(); render(); toast('本文を作り直しました。'); return; }
  if (ds.sent) { setGroupSent(ds.sent); save(); render(); toast('照会中にしました。'); return; }
  switch (ds.act) {
    case 'to-mail': S.tab = 'mail'; save(); render(); break;
    case 'ai-cancel': $('#revise-area').innerHTML = ''; break;
    case 'ai-stop': if (aiCtl) aiCtl.abort(); break;
    case 'recheck': {
      const live = S.docs.filter(d => !d.slim);
      live.forEach(d => runCheck(d)); S.mailEdits = {}; save(); render();
      toast(`${live.length}件を再チェックしました。` + (live.length < S.docs.length ? `本文を保存していない${S.docs.length - live.length}件は、ファイルを読み込み直すと再チェックされます。` : ''));
      break;
    }
    case 'default-rules': S.rules = DEFAULT_RULES.map(r => r.slice()); save(); render(); toast('ルールを既定に戻しました。［全ファイルを再チェック］で反映されます。'); break;
    case 'wipe': $('#wipe-area').innerHTML = `<span class="small">本当に消去しますか？</span> <button class="btn danger sm" data-act="wipe-yes">消去する</button> <button class="btn sm" data-act="wipe-no">やめる</button>`; break;
    case 'wipe-no': render(); break;
    case 'wipe-yes': try { localStorage.removeItem(KEY); } catch (_) {} S = blank(); S.sample = false; S.tab = 'settings'; render(); toast('消去しました。'); break;
    case 'save-app': saveFile('医療事情原稿チェッカー.html', PRISTINE, 'text/html'); break;
    case 'copy-tsv': toast(await copyText(progressRows().map(r => r.join('\t')).join('\n')) ? 'コピーしました。Excelに貼り付けてください。' : 'コピーできませんでした。'); break;
    case 'save-csv': saveFile(`医療事情_進捗_${today()}.csv`, '﻿' + progressRows().map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n'), 'text/csv'); break;
    case 'ping': {
      const urls = [...new Map(allContacts().filter(c => c.kind === 'url').map(c => [c.key, c])).values()];
      if (!urls.length) { toast('確認するウェブサイトがありません。'); break; }
      b.disabled = true;
      let done = 0, ng = 0;
      await Promise.all(urls.map(async c => {
        const ok = await pingUrl(c.value);
        const s = S.contacts[c.key] = S.contacts[c.key] || {};
        if (s.st !== 'つながらない' && s.st !== '確認済み') s.st = ok ? '確認済み' : '自動で接続できず';
        s.at = `自動確認 ${today()}`;
        if (!ok) ng++;
        b.textContent = `確認中… ${++done}/${urls.length}`;
      }));
      save(); render();
      toast(`${urls.length}件を確認しました。接続できなかったもの：${ng}件（開いて確かめ、閉鎖していれば「つながらない」にしてください）。`);
      break;
    }
  }
});
function progressRows() {
  return [['公館', '種類', 'ファイル名', 'チェック日', '指摘件数', '照会件数', '状態', '照会日', '回答受領日', 'メモ']].concat(
    S.docs.map(d => { const p = S.progress[d.name] || {}; return [d.kokan, srcLabel(d), d.name, d.checkedAt, d.findings.length, askCount(d), p.status || '', p.sent || '', p.replied || '', p.memo || '']; }));
}
document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'file') { loadFiles(t.files); t.value = ''; return; }
  if (t.id === 'onlyask') { S.onlyAsk = t.checked; render(); return; }
  if (ds.ask !== undefined) {
    const d = S.docs.find(x => x.name === S.sel), f = d.findings.find(x => String(x.id) === ds.ask);
    f.ask = t.checked; dropMail(d.kokan);
    const p = S.progress[d.name];
    if (p.status === '未照会' || p.status === '照会不要') p.status = askCount(d) ? '未照会' : '照会不要';
    save(); render(); return;
  }
  if (ds.cst) {
    const s = S.contacts[ds.cst] = S.contacts[ds.cst] || {};
    s.st = t.value; s.at = `${today()} 手動`;
    allContacts().filter(c => c.key === ds.cst).forEach(c => dropMail(c.kokan));
    save(); render(); return;
  }
  if (ds.cnote) { (S.contacts[ds.cnote] = S.contacts[ds.cnote] || {}).note = t.value; allContacts().filter(c => c.key === ds.cnote).forEach(c => dropMail(c.kokan)); save(); return; }
  if (ds.kokan) { const d = S.docs.find(x => x.name === ds.kokan); dropMail(d.kokan); d.kokan = t.value.trim() || kokanOf(d.name); dropMail(d.kokan); save(); render(); return; }
  if (ds.pf) {
    const p = S.progress[ds.doc] = S.progress[ds.doc] || {};
    p[ds.pf] = t.value;
    if (ds.pf === 'replied' && t.value && p.status !== '完了') p.status = '回答受領';
    if (ds.pf === 'sent' && t.value && p.status === '未照会') p.status = '照会中';
    save(); render(); return;
  }
  if (ds.cfgbool) { S.cfg[ds.cfgbool] = t.checked; save(); toast('［全ファイルを再チェック］で反映されます。'); return; }
  if (ds.cfg) { S.cfg[ds.cfg] = ['oldYear', 'vxMax', 'blankRun', 'sendBackMin'].includes(ds.cfg) ? (+t.value || 0) : t.value; S.mailEdits = {}; save(); return; }
  if (ds.area === 'addr') {
    S.addr = parseTsv(t.value).filter(r => r[0] !== '公館名').map(r => ({ kokan: r[0] || '', name: r[1] || '', email: r[2] || '', cc: r[3] || '', note: r[4] || '' }));
    S.mailEdits = {}; save(); render(); toast(`宛先を${S.addr.length}件登録しました。`); return;
  }
  if (ds.area === 'rules') {
    S.rules = parseTsv(t.value).filter(r => r[0] !== '区分').map(r => [0, 1, 2, 3, 4, 5, 6, 7].map(i => r[i] || ''));
    save(); render(); toast('ルールを保存しました。［全ファイルを再チェック］で反映されます。'); return;
  }
});
document.addEventListener('input', e => {
  const el = e.target.closest('.paper');
  if (el) { S.mailEdits[el.dataset.k] = el.innerHTML; save(); }
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('#drop'); if (!z) return; e.preventDefault(); z.classList.add('over');
}));
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('#drop'); if (!z) return; e.preventDefault(); z.classList.remove('over'); loadFiles(e.dataTransfer.files);
});

S = load();
render();
if (BOOT_MSG) toast(BOOT_MSG);
if (IN_VIEWER) claude.use('downloads').then(d => { DL = d; render(); }).catch(() => {});
if (IN_VIEWER) claude.use('sample').then(f => { SAMPLE = f; render(); }).catch(() => {});
</script>
</body>
</html>
